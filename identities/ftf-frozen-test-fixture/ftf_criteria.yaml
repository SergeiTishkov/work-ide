# Рубрика скоринга вакансий. Читается tools/score.py.
# Итоговый score — 0..100, плюс отдельный список dealbreaker-флагов и
# needs_manual_review. Каждый компонент объясняется в score_breakdown.
#
# Философия: обычная система поиска работы штрафует за "legacy", "boring",
# "bureaucracy" — здесь всё наоборот. Мы намеренно ищем то, что отпугивает
# большинство кандидатов, потому что там ниже конкуренция и выше готовность
# платить за скучную стабильность.

weights:
  remote_location_fit: 25
  stack_fit: 15
  legacy_enterprise_signal: 25
  low_intensity_signal: 20
  compensation_signal: 10
  contractor_friendliness: 5
# сумма = 100
#
# ВАЖНО (подтверждено человеком явно, 2026-07-30): low_intensity_signal
# (20) намеренно весит вдвое больше compensation_signal (10), а разброс
# low_intensity_signal (-20..+20) вчетверо шире разброса compensation_signal
# (примерно +2..+10). Это осознанно: "гарантированно скучную и лёгкую
# работу за $5k/мес возьму, чем стрессовую за $8k/мес". Не выравнивать эти
# веса, даже если захочется "починить" низкий score денежной, но стрессовой
# вакансии — это работает как задумано.

remote_location_fit:
  worldwide_remote:
    points: 25
    keywords:
      - "remote worldwide"
      - "remote - anywhere"
      - "remote anywhere"
      - "work from anywhere"
      - "hire anywhere"
      - "globally remote"
      - "international remote"
      - "remote (global)"
  eor_or_contractor_international:
    points: 18
    keywords: []  # заполняется из profile.yaml eor_platforms_signal + слова contractor/1099/freelance
  acceptable_region_signal:
    # Подтверждено человеком явно (2026-07-30): Израиль/ОАЭ — реалистичные,
    # "гарантированные" целевые регионы найма (не хуже США/Канады, просто
    # другой потолок ЗП). Это описание МЕСТОПОЛОЖЕНИЯ КОМПАНИИ, а не
    # требование резидентства — поэтому "EU Remote"/"Remote Europe" здесь
    # намеренно НЕТ (см. restrictive_region_signal ниже: это была ошибка в
    # первой версии — "EU Remote" в реальной вакансии означает требование
    # резидентства В ЕС, что дисквалифицирует человека ровно так же, как
    # "US Remote", а не является плюсом).
    points: 16
    keywords:
      - "israel"
      - "tel aviv"
      - "uae"
      - "united arab emirates"
      - "dubai"
      - "abu dhabi"
  restrictive_region_signal:
    # ЖЁСТКОЕ требование резидентства/присутствия в конкретном регионе,
    # который не Грузия/Кавказ — это ПОЛНЫЙ ОТСЕВ (dealbreaker), а не
    # просто "ниже приоритет" (подтверждено человеком явно дважды,
    # 2026-07-30: сначала на примере "remote LATAM", затем на примере
    # "(EU Remote)" в реальной найденной вакансии — обе физически
    # недоступны человеку из Грузии). Список заведомо не исчерпывающий
    # (регионов бесконечно много) — needs_manual_review и собственное
    # чтение агентом остаются последней линией защиты для того, что список
    # не поймал. Если ОДНОВРЕМЕННО есть worldwide/EOR-сигнал — не считаем
    # dealbreaker (скорее всего, компания гибче, чем формулировка одного
    # requisition).
    keywords:
      - "remote (us)"
      - "remote - us"
      - "us remote only"
      - "us only"
      - "must be located in the united states"
      - "must reside in the us"
      - "must be based in the us"
      - "remote latam"
      - "latam only"
      - "latin america only"
      - "remote apac"
      - "apac only"
      - "asia pacific only"
      - "remote (uk)"
      - "uk only"
      - "must be based in the uk"
      - "must be located in the uk"
      - "canada only"
      - "must be based in canada"
      - "must reside in canada"
      - "india only"
      - "must be based in india"
      - "philippines only"
      - "eastern europe only"
      - "western europe only"
      - "nordics only"
      - "dach only"
      - "benelux only"
      - "australia and new zealand only"
      - "anz only"
      - "mexico only"
      - "must be based in mexico"
      - "eu remote"
      - "remote (eu)"
      - "remote europe"
      - "eu only"
      - "europe only"
      - "must be based in the eu"
      - "must be based in israel"
      - "israel only"
      - "must be based in uae"
      - "uae only"
  hard_dealbreakers:
    points: -1000  # эффективно исключает вакансию из "hot" категорий
    keywords:
      - "must relocate"
      - "on-site required"
      - "in-office"
      - "hybrid required"
      - "security clearance"
      - "us citizen required"
      - "us citizenship required"
      - "must be a us citizen"
      - "eu citizenship required"
      - "must be eu resident"
      - "eu work permit required"
      - "israeli citizenship required"
      - "uae residency required"
      # Реальный найденный баг (2026-07-30): вакансия Rangeview буквально
      # писала "ONSITE" (без "required") и "ITAR: must be a U.S. person" -
      # ни то, ни другое не ловилось прежним списком.
      - "onsite"
      - "on-site"
      - "on site"
      - "in office"
      - "in-person"
      - "must work from our office"
      - "office-based"
      - "office based"
      - "no remote work"
      - "not a remote"
      - "itar"
      - "must be a u.s. person"
      - "u.s. person required"
      - "united states person required"
  structured_location_gate:
    # КРИТИЧНО (реальный найденный баг, 2026-07-30): многие источники отдают
    # гео-ограничение СТРУКТУРНЫМ полем (WWR region, Remotive
    # candidate_required_location, Jobicy jobGeo, Himalayas
    # locationRestrictions), а не фразой в тексте. Раньше проверялся только
    # текст, поэтому вакансии с location_raw = "USA" / "Canada only" /
    # "Brazil" / "Costa Rica" / "Texas" спокойно проходили фильтр — ~20 из
    # 32 кандидатов оказались недоступны человеку по гео.
    #
    # Логика: если поле локации заполнено и НЕ содержит явного маркера
    # "весь мир" — это гео-ограничение, то есть dealbreaker (кроме случая,
    # когда одновременно есть worldwide/EOR-сигнал в тексте, который это
    # перевешивает).
    worldwide_markers:
      - "anywhere"
      - "worldwide"
      - "world wide"
      - "global"
      - "globally"
      - "remote (global)"
      - "no restriction"
      - "any location"
      - "any country"
    # Перечисление континентов (Remotive: "Americas, Europe, Asia, Africa,
    # Oceania") — фактически "весь мир", хотя слова "worldwide" там нет.
    # Если в поле локации упомянуто >= continent_threshold континентов,
    # считаем это отсутствием ограничения.
    continent_names:
      - "americas"
      - "north america"
      - "south america"
      - "europe"
      - "asia"
      - "africa"
      - "oceania"
      - "emea"
      - "apac"
      - "latam"
    continent_threshold: 3
    # Значения локации, которые означают просто "удалённо", БЕЗ указания
    # страны — это не гео-ограничение. Реальный найденный баг (2026-07-31,
    # после подключения ATS): Greenhouse/Ashby пишут "Remote job" (209
    # вакансий), GitLab — "Distributed" (39, так они обозначают all-remote
    # компанию), и всё это резалось как "источник ограничивает найм".
    # Если после вычёркивания этих слов от значения ничего не остаётся —
    # ограничения нет, дальше работает обычная логика (неизвестная
    # локация -> needs_manual_review, а не отказ).
    remote_without_country_tokens:
      - "remote"
      - "job"
      - "jobs"
      - "distributed"
      - "telecommute"
      - "work from home"
      - "wfh"
      - "flexible"
      - "n/a"
      - "na"
      - "-"

  # Подтверждено человеком явно (2026-07-30): "мне нужны ТОЛЬКО РЕМОУТ
  # позиции" - по умолчанию вакансия должна быть ПОДТВЕРЖДЕНА как remote,
  # иначе это dealbreaker, а не просто "неизвестно, но пусть будет". Раньше
  # отсутствие сигнала о локации давало лишь мягкое needs_manual_review;
  # теперь оно ведёт к отклонению, если нет НИ явного worldwide/EOR/region
  # сигнала, НИ хотя бы намёка на remote в тексте, НИ флага remote=true от
  # источника.
  header_scope_gate:
    # Реальный найденный баг 2026-07-31 (ручной чек-лист, два кандидата из
    # топа выдачи): Stripe и Airtable пришли с WWR с region-полем "Anywhere
    # in the World", а в первой строке описания стояло "Headquarters: US
    # Remote" и "Headquarters: … ; Remote - US" соответственно. Обе — только
    # для резидентов США, обе были в hot_lead.
    #
    # Причина расхождения: WWR-фиды категорийные ("Programming"), их region
    # заполняется размашисто; строку Headquarters пишет сам работодатель.
    # Поэтому при конфликте верим заголовку работодателя.
    #
    # Смотрим ТОЛЬКО заголовочные строки: фраза "our US remote team" в теле
    # описания — рассказ о компании, а не требование к кандидату.
    scan_first_lines: 6
    header_line_patterns:
      - "^headquarters\\s*:"
      - "^location\\s*:"
      - "^hiring in\\s*:"
    # Ограничение — только связка "remote + страна/регион". Просто
    # "Headquarters: Saudi Arabia" ограничением НЕ является: это адрес
    # компании, а не заявление о том, где она нанимает.
    # Выводится из config/derivation/regions.yaml (residency_required_phrases
    # тех регионов, где человек не резидент).
    restriction_patterns:
      - "remote\\s*[-–—/(,]*\\s*(us|usa|u\\.s\\.|united states|america)\\b"
      - "\\b(us|usa|u\\.s\\.|united states)\\s*[-–—/(,]*\\s*remote\\b"
      - "remote\\s*[-–—/(,]*\\s*(eu|europe|european union)\\b"
      - "\\b(eu|europe|european union)\\s*[-–—/(,]*\\s*remote\\b"
      - "remote\\s*[-–—/(,]*\\s*(uk|united kingdom|canada|latam|apac|india)\\b"
      - "\\b(uk|united kingdom|canada|latam|apac|india)\\s*[-–—/(,]*\\s*remote\\b"

  timezone_gate:
    # Требование к часовому поясу — отдельная ось от страны, и раньше не
    # проверялась ничем. Реальный случай 2026-07-31: пять вакансий Proxify
    # содержат "Located in CET timezone (+/- 3 hours), we are unable to
    # consider applications from candidates in other time zones". Человек
    # в UTC+4 в это окно попадает (CET+3 = UTC+4), но узнали мы это чтением
    # глазами, а не проверкой.
    #
    # Разбирается только явная форма "<TZ> +/- N часов". Вольные
    # формулировки ("significant overlap with PST") дают needs_manual_review,
    # а не отказ: скрыть настоящую вакансию хуже, чем показать сомнительную.
    exclusive_phrases:
      - "unable to consider applications from candidates in other time zones"
      - "candidates in other time zones"
      - "must be located in"
      - "must be based in the"
      - "only considering candidates in"
      - "required to work in the"
    zone_offsets:
      utc: 0
      gmt: 0
      wet: 0
      cet: 1
      cest: 2
      eet: 2
      eest: 3
      msk: 3
      gst: 4
      ist: 5
      sgt: 8
      jst: 9
      aest: 10
      est: -5
      edt: -4
      cst: -6
      cdt: -5
      mst: -7
      mdt: -6
      pst: -8
      pdt: -7
      pacific: -8
      eastern: -5
      central: -6
      mountain: -7

  remote_synonym_keywords:
    - "remote"
    - "work from home"
    - "distributed team"
    - "distributed workforce"
    - "remote-first"
    - "wfh"
    - "home-based"
    - "telecommute"
    - "telework"
    - "work remotely"
  # ЗАМОРОЖЕНО вместе с остальной фикстурой. Обобщённый механизм неоднозначных
  # топонимов; тесты проверяют и это правило, и работу механизма на другом
  # примере (Cambridge), чтобы он не был "заточен под Georgia".
  ambiguous_place_names:
    - name: georgia
      trigger_keywords: ["georgia"]
      meaning_a:
        label: "страна Грузия (Кавказ)"
        context_keywords: ["tbilisi", "batumi", "kutaisi", "caucasus",
                           "country of georgia", "sakartvelo"]
      meaning_b:
        label: "штат США Georgia (GA)"
        context_keywords: ["ga,", "georgia, usa", "atlanta", "savannah",
                           "georgia (state)"]
      on_ambiguous: needs_manual_review
    - name: cambridge
      trigger_keywords: ["cambridge"]
      meaning_a:
        label: "Cambridge, Великобритания"
        context_keywords: ["cambridgeshire", "united kingdom", "england", "uk"]
      meaning_b:
        label: "Cambridge, Массачусетс, США"
        context_keywords: ["massachusetts", "ma,", "boston", "harvard", "mit"]
      on_ambiguous: needs_manual_review

stack_fit:
  # ==== IDENTITY TUNING ====
  # Как называть стек этой идентичности в сообщениях об отказе. Появляется в
  # поле dealbreakers, которое читает человек, поэтому пишется по-человечески.
  stack_label: ".NET/JS"

  # Веса намеренно отражают РЕАЛЬНУЮ частоту технологий в CV человека (см.
  # profile.yaml → tech_stack), а не общее "это тоже .NET-совместимо".
  # core — встречается почти в каждой роли за 7+ лет; strong — регулярно, но
  # не всегда; familiar — было в 1-2 ролях. Подтверждено человеком явно
  # (2026-07-30): технологии, с которыми реально работал чаще, должны
  # весить больше тех, с которыми пересекался мало.
  points_per_core_keyword: 3
  points_per_strong_keyword: 2
  points_per_familiar_keyword: 1
  cap: 15
  # "Стековый спам": блоки, перечисляющие все технологии мира ради попадания
  # в любой поиск. Реальный найденный случай 2026-07-31: у Lemon.io в конце
  # КАЖДОГО объявления идёт абзац "NOT YOUR TECH STACK?" со списком ~60
  # технологий, включая ".NET & C#" и Angular. Из-за него их "Senior Graphic
  # Designer" получал core_hits ["C#", "Angular"], максимальные 15 баллов за
  # стек и проходил гейт релевантности. Текст отрезается по маркеру ТОЛЬКО
  # для оценки стека — гео и язык по-прежнему читают описание целиком
  # (в этом же блоке у Lemon.io перечислены страны найма).
  noise_section_markers:
    - "NOT YOUR TECH STACK?"
    - "We have a variety of projects, so if you have"
    - "we would be happy to connect with you and match you with a project"
  # ключевые слова стека берутся из profile.yaml tech_stack.core/.strong/.familiar
  #
  # Гейт релевантности (см. score.py → score_vacancy): вакансия допускается
  # дальше только если есть хотя бы одно core ИЛИ strong совпадение — одного
  # familiar-совпадения недостаточно (иначе, например, случайное совпадение
  # "LESS" с обычным английским словом "less" в финансовой вакансии проходит
  # фильтр — реальный найденный баг, 2026-07-30).
  #
  # ИСКЛЮЧЕНИЕ (подтверждено человеком явно, 2026-07-30): Java/Scala сами
  # по себе НЕ считаются релевантными (Java web-разработка — не то, на что
  # человек может рассчитывать), НО Java/Scala В КОНТЕКСТЕ дата-пайплайнов
  # (Spark/Databricks/ETL — реальный опыт, предыдущего места работы) —
  # приемлемый, желанный вариант. Поэтому: Java/Scala + хотя бы одно слово
  # из data_pipeline_context_keywords тоже проходит гейт релевантности.
  # Гейт основного языка (подтверждено человеком явно, 2026-07-30: "не
  # дотнет/js ... — выкинуть"). Общие инфраструктурные технологии (Docker,
  # Azure, HTML, CSS, микросервисы) встречаются практически в любой
  # вакансии и НЕ являются доказательством, что роль подходит .NET/JS
  # разработчику. Реальная находка: две вакансии Canonical (embedded/Linux
  # systems engineering) прошли гейт только по слову "Docker".
  #
  # Требование: в тексте должен встретиться хотя бы один НАСТОЯЩИЙ язык/
  # фреймворк из стека человека, а не только инфраструктурное слово.
  primary_language_keywords:
    - ".NET Core"
    - ".NET Framework"
    - "C#"
    - "ASP.NET"
    - "ASP.NET MVC"
    - "ASP.NET Core"
    - "ASP.NET Web API"
    - "Entity Framework"
    - "EF Core"
    - "EF6"
    - "JavaScript"
    - "TypeScript"
    - "Angular"
    - "AngularJS"
    - "React"
    - "Node.js"
    - "jQuery"
  data_pipeline_language_keywords:
    - "java"
    - "scala"
  data_pipeline_context_keywords:
    - "apache spark"
    - "spark"
    - "databricks"
    - "delta lake"
    - "data pipeline"
    - "data engineer"
    - "etl"
    - "big data"

role_complexity_signal:
  # Подтверждено человеком явно (2026-07-30) на реальных находках:
  # "Principal Machine Learning Scientist", "Staff Software Engineer,
  # Agentic Platform" — это НЕ простая работа на 2-4ч/день, даже если в
  # описании компании мелькают "enterprise"/"banking" как рынок сбыта.
  # Это отдельная ось от legacy_enterprise_signal: одно дело — легаси
  # поддержка в банке, совсем другое — R&D/новая архитектура с нуля в
  # той же компании. При срабатывании гейта классификация не может
  # подняться выше low_priority, независимо от остальных компонентов
  # (тот же механизм, что stack_fit gate в score.py).
  #
  # Совпадение в TITLE вакансии — гейтит сразу (1 попадание достаточно).
  title_red_flag_patterns:
    - "principal.*scientist"
    - "staff.*scientist"
    - "principal.*research"
    - "staff.*research"
    - "research scientist"
    - "applied scientist"
    - "machine learning scientist"
    - "machine learning engineer"
    - "\\bml engineer\\b"
    - "data scientist"
    - "founding engineer"
    - "head of ai"
    - "director of ai"
    - "chief ai officer"
    - "agentic"
    - "llm engineer"
    - "ai engineer"
    - "artificial intelligence engineer"
    - "genai engineer"
  # Совпадения в описании — нужно минимум threshold_hits штук (одно случайное
  # модное словечко в бойлерплейте не должно гейтить нормальную легаси-роль).
  description_red_flag_keywords:
    - "build from scratch"
    - "greenfield"
    - "0 to 1"
    - "0->1"
    - "own the technical vision"
    - "own the entire architecture"
    - "cutting-edge"
    - "cutting edge"
    - "state-of-the-art"
    - "state of the art"
    - "novel algorithms"
    - "publish papers"
    - "phd preferred"
    - "phd required"
    - "research new methods"
    - "large-scale distributed systems"
    - "hyperscale"
  threshold_hits: 2
  # Реальный найденный случай (2026-07-30, через ручной чек-лист —
  # docs/VACANCY_CHECKLIST.md): "Staff/Senior Software Engineer (AI CICD)"
  # @ Chainguard — venture-backed стартап, строящий "agentic AI" продукты
  # с нуля ("Extend Chainguard's agentic AI foundation..."). "Agentic"/
  # "LLM systems"/"GenAI" — однозначные, недвусмысленные сигналы
  # AI/R&D-фокуса; одного упоминания достаточно, порог threshold_hits для
  # них не нужен (в отличие от более расплывчатых "cutting-edge" и т.п.,
  # которые могут быть маркетинговым бойлерплейтом).
  description_red_flag_keywords_strong_single_hit:
    - "agentic"
    - "agentic ai"
    - "llm systems"
    - "genai"

