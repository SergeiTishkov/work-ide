  # Гейт "DevOps под нейтральным заголовком". Списки выше проверяют ЗАГОЛОВОК;
  # реальная находка 2026-07-31 — "Software Engineer, Compute (8+ YOE)" @
  # Airtable: заголовок нейтральный, тело целиком про Kubernetes-платформу
  # (~70 кластеров, миграция CNI-плагина, операторы, Terraform, ArgoCD, SLO).
  # Score 45, второе место в выдаче.
  #
  # Порог обязателен: одно-два упоминания Kubernetes/Docker/CI-CD есть почти
  # в любой вакансии прикладного разработчика. Отсекаем только плотную
  # концентрацию, означающую, что роль ИМЕННО про эксплуатацию.
  infrastructure_role_gate:
    threshold_hits: 4
    description_keywords:
