role_relevance_signal:
  # ПОЛНЫЙ ОТСЕВ (dealbreaker), не просто минус в баллах. Подтверждено
  # человеком явно (2026-07-30) на реальных находках: "CFO Controller",
  # "Product Manager, Mapping and Weather Visualization" — это НЕ роли
  # разработчика ПО, шанс попасть на такую вакансию для .NET/JS-разработчика
  # 0%, независимо от того, что в описании компании могут мелькать
  # legacy/enterprise-слова. Срабатывает по НАЗВАНИЮ вакансии: если
  # заголовок matches профессию из wrong_profession_title_patterns и НЕ
  # matches ни одного developer_role_override_patterns — dealbreaker.
  # tech_agnostic_override_keywords — если компания явно говорит "любой
  # стек ОК" где-то в тексте, гейт стека/языка/профессии не применяется
  # (доверяем явному заявлению компании).
  wrong_profession_title_patterns:
    - "\\bcfo\\b"
    - "chief financial officer"
    - "\\bcontroller\\b"
    - "\\baccountant\\b"
    - "bookkeeper"
    - "product manager"
    - "product owner"
    - "account executive"
    - "account manager"
    # Реальная находка 2026-07-31: "Technical Account Manager 2 - South
    # Africa" @ Datadog — клиентская роль, не разработка. В заголовке нет
    # ни "engineer", ни "developer", поэтому мягкого списка достаточно.
    - "technical account manager"
    - "sales executive"
    - "sales manager"
    - "business development"
    - "customer support"
    - "customer service"
    - "support consultant"
    - "\\brecruiter\\b"
    - "talent acquisition"
    - "hr generalist"
    - "human resources"
    - "marketing manager"
    - "content writer"
    - "copywriter"
    - "office manager"
    - "administrative assistant"
    - "executive assistant"
    - "\\bwebmaster\\b"
    - "web administration"
    - "web administrator"
    - "network administrator"
    - "database administrator"
    - "country manager"
    - "commercial manager"
    - "solution sales"
    - "operations manager"
    # Реальный найденный случай (2026-07-30, найдено ручным чек-листом):
    # "Web Publisher Half time US Timezone" - работа с CMS/Figma/контентом
    # (не программирование), прошла фильтр только из-за упоминания
    # HTML/CSS (слишком общий, слабый сигнал стека сам по себе).
    - "web publisher"
    - "content editor"
    - "content management"
    - "cms administrator"
    - "\\bpublisher\\b"
  # ЖЁСТКИЙ уровень: эти паттерны НЕ снимаются developer_role_override
  # (в отличие от списка выше). Причина — реальные находки 2026-07-30
  # (ручной чек-лист после подключения новых источников): "GTM Operations
  # Process Architect" @ Stripe, "Partner Solutions Architect" @ Nebius,
  # "Senior Manager, DevOps" @ Modivcare. Все они содержат
  # "architect"/"engineer"/"devops" в заголовке, из-за чего обычный
  # override снимал гейт — хотя это заведомо не роли рядового разработчика
  # (go-to-market операции, пресейл-архитектура, менеджмент людей).
  hard_wrong_profession_title_patterns:
    - "\\bgtm\\b"
    - "go[- ]to[- ]market"
    - "operations process"
    - "process architect"
    - "solutions architect"
    - "solution architect"
    - "presales"
    - "pre-sales"
    - "sales engineer"
    # Реальная находка 2026-07-31: "Principal Partner Solutions
    # Engineer, SAARC (Based in Bangalore)" @ Cloudflare — пресейл,
    # в списке был только "solutions architect".
    - "solutions engineer"
    - "solution engineer"
    - "customer engineer"
    - "customer success"
    - "\\bmanager,"
    - "senior manager"
    - "engineering manager"
    - "engineering leader"
    - "engineering leadership"
    - "leadership team"
    - "tech lead"
    - "\\bdirector\\b"
    - "\\bvp\\b"
    - "\\bhead of\\b"
    - "chief .* officer"
    # DevRel: "Developer Advocate"/"Developer Relations" — публичные
    # выступления, статьи, работа с сообществом, а не разработка ПО.
    # Реальная находка 2026-07-30: "Senior Developer Advocate - Data
    # Observability" @ Datadog прошла гейт из-за слова "Developer".
    - "developer advocate"
    - "developer relations"
