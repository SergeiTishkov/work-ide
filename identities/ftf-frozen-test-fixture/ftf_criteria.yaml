    - "platform engineer"
    - "sysadmin"
    - "system administrator"
    - "systems administrator"
    - "cloud engineer"
    - "cloud infrastructure"
    - "cloud operations"
    - "release engineer"
    - "build engineer"
    # Дизайн — не программирование. Реальная находка 2026-07-31: "Senior
    # Graphic Designer" @ Lemon.io попала в worth_a_look со score 27 (стек
    # засчитался из рекламного блока, см. stack_fit.noise_section_markers).
    # В жёстком списке, потому что заголовки вида "Design Engineer" тоже не
    # являются ролью прикладного разработчика.
    - "\\bdesigner\\b"
