# Вопросник идентичности KISEL — заполнен с человеком.
#
# Это origin story идентичности: почему её настройки именно такие. Ответы
# собраны в разговоре 2026-07-29..31 и восстановлены ретроспективно при
# переходе на мультиидентичностную архитектуру.
#
# Шаблон с полным списком вопросов и пояснениями — в
# identities/_template/tmpl_questionnaire.yaml; как проводить опрос —
# в docs/QUESTIONNAIRE.md.
#
# ВАЖНО про формат: поле `drives` перечисляет, что именно порождает ответ.
# Если меняете ответ — проверьте перечисленные там места.

schema_version: 1
identity_prefix: kisel
filled_with_user_at: "2026-07-31"
source_of_answers: "разговор с человеком 2026-07-29..31 (восстановлено ретроспективно)"

answers:
  # --- §0 Мета -------------------------------------------------------------
  - id: meta.purpose
    q: "Для чего этот поиск? Одним абзацем."
    answer: >
      Спокойная занятость на 2-4 часа в день: скучная и предсказуемая.
      Основная работа полностью закрывает потребность в интересных задачах,
      здесь нужны только деньги и спокойствие.
    drives: ["kisel_identity.md", "все веса в kisel_criteria.yaml"]

  - id: meta.kind
    q: "Личная идентичность или шаблон для других?"
    answer: "personal"
    drives: ["profile.identity.kind"]

  - id: meta.prefix
    q: "Префикс (агент предлагает варианты, человек выбирает)."
    answer: "kisel — Keep It Simple, Easy, Legacy. Читается как «кисель»: тягучее,
      мутное, слегка сладковатое и медленное — точное описание искомой работы"
    note: "Альтернативы, которые предлагались: dotq (DOTNET+Quiet), zask (заскорузлый), skuk (скука)."
    drives: ["имя папки identities/kisel/", "префикс всех файлов"]

  # --- §1 Кто вы -----------------------------------------------------------
  - id: person.name
    q: "Имя (или псевдоним, если не хотите его в гите)."
    answer: local   # личное, живёт в Малой Конституции
    drives: ["profile.owner.name"]

  - id: person.linkedin
    q: "Ссылка на LinkedIn."
    answer: local   # личное, живёт в Малой Конституции
    note: >
      Проверено: публичный срез без логина даёт меньше деталей, чем CV, и
      однажды выдал недостоверную информацию о языках. При расхождении верить CV
      и словам человека.
    drives: ["profile.owner.linkedin"]

  - id: person.cv
    q: "Есть ли CV файлом? Где лежит?"
    answer: "Да, PDF и DOCX — в local-constitution/personal/kisel/"
    note: >
      Личные документы не место в общем репозитории. Имена файлов исходные,
      владельческие — переименовывать нельзя (человек попросил явно
      2026-07-31), см. docs/LOCAL_CONSTITUTION.md.
    drives: ["profile.owner.cv_files"]

  - id: person.experience
    q: "Сколько лет опыта, текущий уровень."
    answer: "7+ лет, Senior Software Engineer"
    drives: ["profile.owner.years_experience", "profile.owner.role"]

  - id: person.contact
    q: "Контакт для User-Agent бота: в гит, в Малую Конституцию или никак?"
    answer: "В Малую Конституцию (local)"
    drives: ["profile.contact.user_agent_contact"]

  # --- §2 Резидентство (порождает ВСЮ гео-логику) --------------------------
  - id: residency.country
    q: "В какой стране физически находитесь (проживание, не гражданство)?"
    answer: "Грузия (страна на Кавказе, НЕ штат США)"
    why: >
      Из этого выводятся ВСЕ гео-дисквалификаторы. Ошибка здесь тихо выбрасывает
      половину рынка или, наоборот, наполняет выдачу недоступными вакансиями.
    drives:
      - "criteria.remote_location_fit.restrictive_region_signal"
      - "criteria.remote_location_fit.hard_dealbreakers (гражданские цензы)"
      - "criteria.remote_location_fit.ambiguous_place_names"
      - "profile.owner.location"

  - id: residency.not_in
    q: "Где вы точно НЕ резидент (для вывода дисквалификаторов)?"
    answer: "Не ЕС, не Россия, не Беларусь, не США, не Канада"
    drives: ["criteria.remote_location_fit.restrictive_region_signal"]

  - id: residency.timezone
    q: "Часовой пояс и приемлемое пересечение с работодателем."
    answer: >
      UTC+4 круглый год. Хорошее пересечение с US East Coast вечером,
      с Западным побережьем хуже, но возможно. Async-friendly предпочтительно.
    drives: ["profile.owner.timezone_notes"]

  # --- §3 Неоднозначные топонимы -------------------------------------------
  - id: ambiguous_places
    q: "Название вашей страны/города совпадает с другим местом?"
    answer: >
      Да, и это главная ловушка: "Georgia" в вакансиях почти всегда означает
      штат США, а не страну.
    drives: ["criteria.remote_location_fit.ambiguous_place_names"]

  # --- §4 Языки ------------------------------------------------------------
  - id: languages.spoken
    q: "Какими языками владеете?"
    answer: "Английский, русский. Больше никакими."
    note: >
      Явно подтверждено человеком, вопреки более раннему автоматическому
      извлечению из публичного LinkedIn, где значились немецкий и китайский на
      elementary-уровне. Верим человеку.
    drives: ["profile.owner.languages", "criteria.language_requirement_signal"]

  - id: languages.policy
    q: "Требование языка, которого вы не знаете — дисквалификация или штраф?"
    answer: "Дисквалификация"
    drives: ["criteria.language_requirement_signal (как гейт)"]

  # --- §5 Формат работы ----------------------------------------------------
  - id: format.remote
    q: "Только удалённо, гибрид, или офис тоже?"
    answer: "ТОЛЬКО удалённо. Без подтверждения удалёнки — отказ."
    drives: ["criteria.remote_location_fit.hard_dealbreakers", "гейт 'не подтверждено как remote'"]

  - id: format.oncall
    q: "Дежурства/ночные вызовы приемлемы?"
    answer: "Нет"
    drives: ["criteria.low_intensity_signal.negative_keywords"]

  # --- §6 Целевые регионы --------------------------------------------------
  - id: regions.dream
    q: "Регионы мечты (высокий потолок, низкая вероятность)."
    answer: "США, Канада"
    drives: ["profile.target_regions.dream"]

  - id: regions.realistic
    q: "Реалистичные регионы (где реально наймут)."
    answer: "Израиль, ОАЭ. Не 'план Б хуже', а равноценная цель с другим потолком."
    note: "По Израилю есть реальный опыт работы (реальный опыт сотрудничества)."
    drives: ["profile.target_regions.solid_realistic", "criteria.acceptable_region_signal"]

  - id: regions.distinction
    q: "Различать ли 'компания из X' и 'нужно резидентство в X'?"
    answer: "Обязательно. Это разные вещи."
    note: >
      Ошибка здесь уже случалась: "EU Remote" сначала попал в плюсы как
      "европейская компания", хотя означает требование резидентства в ЕС.
    drives: ["criteria.remote_location_fit (разделение acceptable/restrictive)"]

  # --- §7 Тип занятости ----------------------------------------------------
  - id: employment.second_job
    q: "Планируете совмещать эту работу с другой занятостью?"
    answer: "Да"
    why: "Определяет, считать ли пункты об эксклюзивности дисквалификаторами."
    drives: ["profile.employment_type_priority.dealbreaker_signals"]

  - id: employment.preferred
    q: "Предпочтительный тип занятости."
    answer: "Контракт/1099/part-time/fractional/freelance. W-2 full-time — только с явными признаками низкой нагрузки."
    drives: ["profile.employment_type_priority"]

  - id: employment.eor
    q: "Оформление через EOR (Deel, Remote.com, Oyster…) приемлемо?"
    answer: "Да, это сильный положительный сигнал"
    drives: ["profile.eor_platforms_signal", "criteria.contractor_friendliness"]

  # --- §8 Нагрузка ---------------------------------------------------------
  - id: load.hours
    q: "Сколько часов в день готовы работать?"
    answer: "2-4"
    drives: ["profile.goal.hours_per_day_target"]

  - id: load.tradeoff
    q: "ГЛАВНЫЙ размен: гарантированно спокойная работа по нижней границе денег ИЛИ выше оплата с признаками стресса?"
    answer: >
      Спокойная. Дословно: "лучше гарантированно скучную и лёгкую работу на 2-4
      часа в день за 5к возьму, чем стрессовую за 8к".
    drives: ["веса: low_intensity_signal=20 против compensation_signal=10"]

  - id: load.ai
    q: "Планируете активно использовать AI в работе?"
    answer: "Да"
    why: "Повышает ценность хорошо задокументированных легаси-стеков, которые LLM понимают отлично."
    drives: ["profile.goal.ai_assisted", "обоснование legacy_enterprise_signal"]

  # --- §9 Деньги -----------------------------------------------------------
  - id: comp.range
    q: "Целевой диапазон."
    answer: "$5000-8000/мес; ~$60-96k/год; ~$55-130/час"
    drives: ["profile.goal.target_compensation"]

  - id: comp.no_data
    q: "Как трактовать 'зарплата не указана' — нейтрально или штраф?"
    answer: "Нейтрально. Нет данных ≠ плохая зарплата."
    drives: ["criteria.compensation_signal.no_range_points: 0"]

  # --- §10 Стек ------------------------------------------------------------
  - id: stack.core
    q: "Core: технологии из большинства последних ролей."
    answer: "C#, .NET Core/Framework, ASP.NET (MVC/Web API/Core), SQL Server, Angular/AngularJS"
    drives: ["profile.tech_stack.core", "criteria.stack_fit.primary_language_keywords"]

  - id: stack.strong
    q: "Strong: регулярно, но не всегда."
    answer: "EF/EF Core, TypeScript, JavaScript, React, Azure, Docker, микросервисы, CQRS, DDD, Event Sourcing, HTML/CSS"
    drives: ["profile.tech_stack.strong"]

  - id: stack.familiar
    q: "Familiar: было в 1-2 ролях."
    answer: "Node.js, MongoDB, Cosmos DB, DynamoDB, Spark, Databricks, Python, jQuery, SOAP, XSLT, PHP, GraphQL, Scala, Java"
    drives: ["profile.tech_stack.familiar"]

  - id: stack.contextual
    q: "Технологии, которые считаются только в определённом контексте?"
    answer: >
      Java/Scala — ТОЛЬКО для дата-пайплайнов (Spark/Databricks/ETL). Java-web
      не подходит: "я дотнетчик, меня на джава позицию не возьмут".
    drives: ["criteria.stack_fit.data_pipeline_language_keywords + _context_keywords"]

  - id: stack.substring_traps
    q: "Есть ли среди ваших ключевых слов подстроки обычных слов?"
    answer: >
      Да, обожглись трижды: голое ".NET" ловило "VB.NET"; "LESS" ловил "no less
      than"; "eor" ловил "theoretical". Все три убраны или заменены.
    why: "Дешёвый вопрос, который экономит целый цикл отладки."
    drives: ["profile.tech_stack (какие ключи вообще включать)"]

  # --- §11 Роли ------------------------------------------------------------
  - id: roles.excluded
    q: "Какие роли исключить полностью?"
    answer: >
      Не-разработка (CFO, Product Manager, Sales, Support, Recruiter, Webmaster,
      Developer Advocate) и отдельно DevOps/SRE/платформа/инфраструктура —
      "выкинь девопсов, это не моя вакансия".
    drives: ["criteria.role_relevance_signal (оба списка)"]

  - id: roles.greenfield
    q: "Greenfield/R&D/'с нуля' — хотите или избегаете?"
    answer: "Избегаю. Нужна поддержка существующего, а не создание нового."
    drives: ["criteria.role_complexity_signal (как гейт)"]

  - id: roles.startup_vs_legacy
    q: "Стартап или зрелая легаси-компания?"
    answer: "Легаси, и чем скучнее, тем лучше"
    drives: ["знак legacy_enterprise_signal (плюс)", "startup в negative_keywords"]

  - id: roles.industries_avoid
    q: "Индустрии, которых избегать."
    answer: "crypto, web3, AI-first стартапы"
    drives: ["criteria.low_intensity_signal.negative_keywords"]

  # --- §12 Компании --------------------------------------------------------
  - id: company.age
    q: "Предпочтение по возрасту компании."
    answer: "Зрелые, 10+ лет: устоявшиеся процессы, легаси, спокойный темп"
    drives: ["criteria.company_reputation_signal.company_age"]

  - id: company.reputation
    q: "Насколько важны отзывы сотрудников? Что важнее — общий рейтинг или work-life balance?"
    answer: "Важны. WLB важнее общего рейтинга."
    why: "Компания может быть 'хорошей' за счёт зарплат и карьеры, но выжимать людей."
    drives: ["criteria.company_reputation_signal (веса WLB > overall)"]

  # --- §13 Инструменты -----------------------------------------------------
  - id: tools.sources
    q: "Какие источники включить?"
    answer: "Все доступные, включая arbeitnow несмотря на низкий выход"
    drives: ["kisel_sources.yaml"]

  - id: tools.hn_keywords
    q: "Ключевые слова для HN 'Who is hiring' (максимум 5, каждое — HTTP-запрос)."
    answer: ".NET, C#, ASP.NET, legacy, SQL Server"
    drives: ["kisel_sources.yaml → hn_whoishiring.params.keywords"]

  - id: tools.manual_ingestion
    q: "Будете ли пользоваться ручным вводом находок агента?"
    answer: "Да, и это важный канал"
    drives: ["kisel_sources.yaml → manual"]

  # --- §14 Отчётность ------------------------------------------------------
  - id: report.language
    q: "Язык отчёта."
    answer: "Русский"
    drives: ["формат отчёта (сейчас захардкожен, см. ARCHITECTURE.md)"]

  - id: report.salary_visibility
    q: "Что показывать про зарплату в отчёте?"
    answer: >
      Всегда явно: сумму И источник (указано в вакансии / найдено вручную на
      стороннем сайте / нет данных).
    drives: ["report.py _fmt_salary_info"]

  # --- §15 Приватность -----------------------------------------------------
  - id: privacy.git
    q: "Что можно коммитить в общий identities/, а что только локально?"
    answer: >
      Имя и LinkedIn — можно. CV и почта — только в Малую Конституцию.
    drives: ["profile.contact.user_agent_contact: local", "profile.owner.cv_files"]

  - id: privacy.never
    q: "Что агент не должен делать никогда?"
    answer: >
      Обходить анти-бот защиту (подделка отпечатка браузера, CAPTCHA).
      Публиковать CV или личные данные где-либо.
    drives: ["Большая Конституция, раздел про границу парсинга"]
