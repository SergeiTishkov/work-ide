# Источники идентичности KISEL.
#
# Здесь ТОЛЬКО предпочтения: какие источники включены и с какими параметрами.
# Эндпоинты, тип источника, признак remote_only и документация по каждому
# источнику — в общем каталоге config/sources.catalog.yaml.
#
# Каталог доступных блоков с описанием сильных и слабых сторон каждого —
# docs/BUILDING_BLOCKS.md.

schema_version: 1

sources:
  # --- Основные: только удалённые вакансии, англоязычные -------------------
  - name: weworkremotely
    enabled: true
    # Лучший источник по соотношению сигнал/шум: ~242 вакансии за прогон,
    # структурное поле region, англоязычные.

  - name: remoteok
    enabled: true

  - name: remotive
    enabled: true

  - name: jobicy
    enabled: true

  - name: himalayas
    enabled: true

  # --- Вакансии напрямую от работодателей ---------------------------------
  - name: ats
    enabled: true
    # Список компаний — в kisel_ats_targets.yaml. Это главный рычаг качества:
    # сам источник работает отлично, но его выход целиком определяется тем,
    # какие компании в списке.

  # --- Нишевые ------------------------------------------------------------
  - name: hn_whoishiring
    enabled: true
    params:
      # Заданы явно, а не взяты из tech_stack.core: "legacy" и "SQL Server" —
      # не языки, но для ЭТОЙ идентичности они ценнее половины стека, потому
      # что ищется именно легаси-поддержка. Каждое слово = один HTTP-запрос.
      keywords: [".NET", "C#", "ASP.NET", "legacy", "SQL Server"]
      hits_per_keyword: 50

  - name: arbeitnow
    enabled: true
    # Оставлен включённым осознанно, несмотря на низкий выход: по замеру
    # 2026-07-30 давал 68% базы при ~6% полезного (немецкоязычный рынок,
    # отсеивается языковым фильтром). Изредка приносит англоязычные
    # remote-вакансии европейских компаний. Если начнёт мешать — поставить
    # enabled: false, код трогать не нужно.

  - name: manual
    enabled: true
    # Ручной канал: находки агента с LinkedIn/Indeed и карьерных страниц,
    # заносимые через tools/ingest_manual.py. Для этой идентичности он важен
    # особенно: публичные джоб-борды слабо покрывают комбинацию
    # "легаси + worldwide remote + высокая ставка".
