# =============================================================================
#  ШАБЛОН ПРОФИЛЯ ИДЕНТИЧНОСТИ
# =============================================================================
#  Копируется как <префикс>_profile.yaml и заполняется по ответам вопросника.
#  Человекочитаемая "истина" о том, кто ищет и что именно.
#
#  Заполнять ВМЕСТЕ С ЧЕЛОВЕКОМ (docs/ONBOARDING.md), а не догадками.
# =============================================================================

identity:
  kind: personal   # personal | shared_example | fixture
  # Одной фразой: что означает высокий score именно в ЭТОМ поиске. Строка
  # печатается в шапке каждого отчёта, поэтому пишется человеческим языком.
  # У каждой идентичности она своя: то, что здесь плюс, для другого поиска
  # может быть минусом.
  scoring_philosophy: >
    <например: чем выше score, тем больше вакансия похожа на спокойную
    легаси-поддержку с низкой конкуренцией — то, что нужно.>
  display_name: "<короткое название, видно в баннере инструментов>"
  abbreviation: "<ПРЕФИКС> = <расшифровка>"
  created_at: "<ГГГГ-ММ-ДД>"

contact:
  # Куда писать владельцу сайта, если он захочет связаться (честный
  # User-Agent — инженерное обязательство проекта).
  #   "local"        -> читать из local-constitution/personal/<p>/<p>_contact.yaml
  #   "you@mail.com" -> прямо здесь (попадёт в общий репозиторий!)
  #   null           -> без контакта (doctor выдаст предупреждение)
  user_agent_contact: "local"

owner:
  name: "<имя или псевдоним>"
  role: "<должность>"
  years_experience: 0
  linkedin: "<ссылка или null>"
  # Личные документы — только в Малой Конституции, вне гита. Имя файла
  # оставляется владельческое: правило префиксов на чужие документы не
  # распространяется (см. docs/LOCAL_CONSTITUTION.md). Пробелы в пути — норма.
  cv_files:
    - "local-constitution/personal/<префикс>/CV Ivan Petrov Software Engineer.pdf"
  # Языки, которыми владеете достаточно для работы. В языковой фильтр попадут
  # те, которых здесь НЕТ (см. config/derivation/languages.yaml).
  languages:
    - "English"
  location:
    country: "<страна проживания>"
    # Если название страны/города неоднозначно — предупредите здесь явно.
    disambiguation_warning: >
      <например: в вакансиях "Georgia" почти всегда означает штат США, а не
      страну. Если у вас такой проблемы нет — уберите это поле.>
  timezone_notes: >
    <ваш часовой пояс и с какими регионами он удобно пересекается>

target_regions:
  # Различайте: "компания находится в X" ≠ "нужно резидентство в X".
  dream:            # высокий потолок оплаты, меньше шансов
    - "<регион>"
  solid_realistic:  # где реально наймут
    - "<регион>"

goal:
  purpose: >
    <зачем этот поиск, одним абзацем>
  hours_per_day_target: [0, 0]
  ai_assisted: true
  target_compensation:
    currency: USD
    monthly_parttime_usd: [0, 0]
    annual_parttime_usd: [0, 0]
    hourly_contractor_usd: [0, 0]
    priority_note: >
      <что важнее: спокойствие или деньги. Это определяет соотношение весов
      low_intensity_signal и compensation_signal в criteria.>

employment_type_priority:
  high: []
  medium: []
  low_but_possible: []
  # Пункты, делающие вакансию невозможной. Если планируется совмещение с
  # другой занятостью — оставьте здесь требования эксклюзивности.
  dealbreaker_signals:
    - "must relocate"
    - "on-site required"

# Стек по ФАКТИЧЕСКОЙ частоте в резюме, а не по ощущениям.
# Влияет на гейт релевантности: без совпадения по core/strong вакансия
# отсеивается целиком.
tech_stack:
  core: []       # было в большинстве последних ролей
  strong: []     # регулярно, но не всегда
  familiar: []   # одна-две роли за карьеру
  # ОСТОРОЖНО с короткими и общими словами: ".NET" ловит "VB.NET",
  # "LESS" ловит "no less than", "EOR" ловит "theoretical".

ideal_company_traits:
  high_priority: []
  low_priority_avoid: []

# Упоминание такой платформы означает, что компания технически готова оформить
# человека вне своей страны. Список общий, менять обычно не нужно.
eor_platforms_signal:
  - "Deel"
  - "Remote.com"
  - "Oyster HR"
  - "Papaya Global"
  - "Multiplier"
  - "Globalization Partners"
  - "G-P"
  - "Velocity Global"
