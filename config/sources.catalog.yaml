# =============================================================================
#  THE SOURCE CATALOGUE — shared machinery, identical for every user
# =============================================================================
#  This describes WHAT each source can do: endpoint, kind, whether it is
#  remote-only, which parameters it accepts, and what to expect of its data
#  quality.
#
#  There is nothing personal here: whether a source is enabled, and with what
#  parameters, is the identity's decision in its own `<prefix>_sources.yaml`.
#  The split follows the boundary between "a fact about the world" and "a
#  person's preference": a stale URL is a bug for everybody at once, while a
#  disabled arbeitnow is somebody's deliberate choice.
#
#  An identity CANNOT override url/kind/remote_only: those are properties of
#  the board rather than settings. It can override enabled and params.
#
#  How to read params_schema: it lists the parameters the fetcher accepts from
#  an identity, with their type and meaning. The full description for building
#  your own identity is in docs/BUILDING_BLOCKS.md.
# =============================================================================

schema_version: 1

sources:
  - name: weworkremotely
    kind: rss_multi
    remote_only: true
    urls:
      - "https://weworkremotely.com/categories/remote-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"
    params_schema:
      urls: "the list of RSS feeds; all five categories by default"
    yield_notes: >
      The project's best source by signal-to-noise. ~242 vacancies per run,
      remote only, in English. It gives the structured region field
      ("Anywhere in the World" / "USA Only") — the most dependable geography
      signal of any source. Measured 2026-07-30: the programming category alone
      gives 25 vacancies, all five give 242.
    caveats: >
      It keeps the application funnel to itself: in 71% of vacancies "To apply"
      leads back to weworkremotely.com. The fetcher extracts the company site
      from the "Headquarters/URL" block so that you can apply directly.

  - name: remoteok
    kind: json_api
    remote_only: true
    url: "https://remoteok.com/api"
    params_schema:
      url: "the API endpoint"
    yield_notes: "~100 latest vacancies per call, remote only. No depth in time."
    caveats: >
      The feed is noisy: news items have been observed instead of vacancies.
      The parser validates the required fields strictly (position, company,
      apply_url) and discards rubbish silently — do not read the raw record
      count as a number of vacancies.

  - name: remotive
    kind: json_api
    remote_only: true
    url: "https://remotive.com/api/remote-jobs?limit=200"
    params_schema:
      url: "the API endpoint"
    yield_notes: >
      ~35 vacancies per call. It gives candidate_required_location — an
      explicit structured geography restriction.
    caveats: "The limit/search/category parameters are ignored in practice — we take what is given."

  - name: jobicy
    kind: json_api
    remote_only: true
    url: "https://jobicy.com/api/v2/remote-jobs?count=100&industry=dev"
    params_schema:
      url: "the API endpoint; industry=dev gives the highest share of development"
    yield_notes: >
      ~100 vacancies. It returns structured salary (salaryMin/Max/Currency/
      Period) and geography (jobGeo) — more dependable than parsing text.
    caveats: "The tag= parameter returns nothing; using it is pointless."

  - name: himalayas
    kind: json_api
    remote_only: true
    url: "https://himalayas.app/jobs/api?limit=100"
    params_schema:
      url: "the API endpoint"
      queries: >
        optional search words. When given, the source switches from the plain
        feed (the newest twenty of ~100,000) to the filtered search endpoint
      employment_types: >
        optional, with queries: the board's own spellings — "Part Time",
        "Contractor", "Full Time". Every query is multiplied by every type
      max_pages: "pages per (query x type) in search mode, twenty records each (3 by default)"
    yield_notes: >
      ~20 vacancies per call regardless of limit. locationRestrictions is a
      list of permitted countries (empty = worldwide), the most explicit
      geography signal of any source. The search endpoint filters by
      engagement for real (measured 2026-09-13): "developer" + "Part Time"
      109, ".net" + "Part Time" 29, "c#" + "Contractor" 130, and every record
      carries the type asked for as `employmentType`.
    caveats: "The plain feed is few and arbitrary; the search mode is what makes it useful."

  - name: remoterocketship
    kind: html_page_data
    remote_only: false
    # No `url` on purpose: the listing is built from slug and employment type
    # (https://www.remoterocketship.com/jobs/<slug>/<employment>/), and a
    # templated url would be pinged literally by doctor.py and handed to a
    # fetcher that has no such parameter.
    params_schema:
      slugs: >
        title or technology slugs, e.g. net, developer, fullstack-engineer. Read
        a slug's first page before listing it: some fall back to everything
      employment_types: "part-time, contract (full-time exists but is the default nobody needs filtered)"
    yield_notes: >
      The one open board found that filters by engagement for real: every
      record on /jobs/net/contract/ says contract, every one on
      /jobs/developer/part-time/ says part-time, and the type arrives as a
      field. Salary already converted to US dollars, a tech stack, and the
      employer's own posting URL. Measured 2026-09-13: net/contract 115,
      developer/part-time 114, fullstack-engineer/contract 454.
    caveats: >
      Twenty newest per listing and no paging for an anonymous page (?page=2
      repeats 19 of 20), so breadth comes from more slugs. /jobs/c-sharp/ is a
      trap: it claims thousands and lists pharmacists. An unknown slug is a
      404 and is reported. The card holds a two-line summary only; the job
      page's schema.org JobPosting has the full text.

  - name: linkedin
    kind: html_guest_search
    remote_only: false
    params_schema:
      keywords: "a list of keywords; each is multiplied by each country"
      locations: "a list of countries; by default the tiers from profile.target_markets"
      max_pages: "at most how many pages to read per query (100 by default, past any list the search serves); a query ends sooner when its list does"
      posted_within_days: "only vacancies posted within N days, LinkedIn's f_TPR (7 by default; 0 for any age)"
      split_at_ceiling: "split a query that reaches the 100-result ceiling into a \"remote ...\" query and regional ones (true by default)"
      enrich_limit: "how many vacancy pages to read for a description while fetching (0 in the templates: tools/enrich_descriptions.py reads them after scoring)"
    yield_notes: >
      Measured 2026-10-02: TEN cards per page, the next page at start=10, 20...
      (an earlier note here said 30 and start=0,25,50 — the fetcher believed
      it and read one page per pair). f_TPR is honoured; f_WT, f_JT and sortBy
      are ignored. An anonymous request is served at most 100 results per
      query (start=100 comes back empty however long the list: 736 UK
      postings of a week, 100 served); the fetcher splits a query at that
      ceiling into "remote ..." and regional ones (UK: 100 became 322).
      The live contract and the history are in docs/sources/linkedin.md.
      It covers Israel, the UAE, Saudi Arabia, Singapore, Switzerland, Germany
      and the Netherlands at once — markets whose own boards are closed
      (Bayt/GulfTalent/Drushim/NodeFlair answer 403/404).
    caveats: >
      The project's only HTML source: the guest page is undocumented and can
      change. The parser must return 0 and an error when the markup changes,
      which is pinned by a test against a frozen snapshot. A card carries no
      description text, only title, company and location: the gates that read
      a description work blind on these vacancies, so the manual checklist
      matters especially for them.


  - name: devitjobs
    kind: json_api
    remote_only: false
    params_schema:
      boards: "the list of boards: uk and/or us"
    yield_notes: "Measured 2026-08-04: UK 2447 records, US 1590. The largest source by volume."
    caveats: >
      The response has NO description text — only the title, tags and
      structured fields. The gates that read a description work blind here.

  - name: jobs_ch
    kind: json_api
    remote_only: false
    params_schema:
      queries: "search queries"
      pages: "pages per query, 20 records each (the board ignores rows)"
    yield_notes: "Measured 2026-08-04: 250 records from 3 queries of 5 pages."
    caveats: "A national board: most vacancies are local and in German."

  - name: mycareersfuture
    kind: json_api
    remote_only: false
    params_schema:
      queries: "search queries"
      pages: "pages per query, 100 records each"
    yield_notes: "Measured 2026-08-04: 384 records. Singapore's government portal."
    caveats: >
      A national portal: remoteness comes from the text rather than a flag.
      Applying needs a Singpass login, and Singpass is for Singapore residents
      (2026-10-04): useless to anyone applying from abroad. Off in both
      templates, and their criteria reject its vacancies (closed_sources).

  - name: landing_jobs
    kind: json_api
    remote_only: false
    yield_notes: "Measured 2026-08-04: 50 records. It has a remote flag and a pay range."
    caveats: "Some vacancies are posted anonymously — the company is recovered from the URL."

  - name: workingnomads
    kind: json_api
    remote_only: true
    yield_notes: "Measured 2026-08-04: 28 records. A curated selection."

  - name: rss_boards
    kind: rss
    remote_only: false
    params_schema:
      boards: "jobspresso and/or berlinstartupjobs"
    yield_notes: "Measured 2026-08-04: 22 records in total."
    caveats: "Records with no recognised company are discarded — there is nothing to deduplicate them by."


  - name: 4dayweek
    kind: json_api
    remote_only: false
    params_schema:
      categories: "the board's categories; for development, engineering"
      pages: "pages of 100 records per category"
    yield_notes: >
      Measured 2026-08-05: 23,182 vacancies on the board, ~21% engineering.
      The project's only source that searches along the INTENSITY AXIS rather
      than the stack: the schedule_type field arrives structured (4_day_week,
      compressed_week, 9_day_fortnight, flexible_hours…).
    caveats: >
      The list response has no description text — the gates that read one work
      from the title and tags. In exchange, the working pattern arrives proven
      rather than guessed from text.


  - name: ats
    kind: ats_boards
    remote_only: false
    params_schema:
      targets: >
        a list of companies of the form {company, provider, token}; by default
        taken from <prefix>_ats_targets.yaml
    yield_notes: >
      Vacancies straight from employers through the official public APIs of
      their ATS (Greenhouse / Lever / Ashby / Recruitee) — the very ones the
      vacancy widgets on company sites run off. No third party's application
      funnel, no subscriptions, no intermediary. Measured: Stripe 546
      GitLab 185, Notion 111.
    caveats: >
      The main lever on quality is the COMPANY LIST, not the source itself.
      The technology companies in the starting list yield no .NET vacancies;
      for a particular profile the list has to be filled with relevant
      employers.

  - name: hn_whoishiring
    kind: hn_algolia
    remote_only: false
    url: "http://hn.algolia.com/api/v1/search"
    params_schema:
      keywords: >
        a list of keywords to search the thread with; BY DEFAULT taken from
        the active identity's profile.tech_stack.core. Each word is one HTTP
        request to Algolia, so the list is short (a cost budget).
      hits_per_keyword: "how many comments to request per word (50 by default)"
    yield_notes: >
      Legacy and enterprise vacancies often land here rather than on the job
      boards. Sometimes there are quiet, uncontested vacancies here.
    caveats: "Free-form and noisy; company and location are parsed heuristically."

  - name: arbeitnow
    kind: json_api
    remote_only: false
    url: "https://www.arbeitnow.com/api/job-board-api"
    params_schema:
      url: "the API endpoint"
    yield_notes: "~175 vacancies per call."
    caveats: >
      NOTE: in practice this is predominantly the GERMAN labour market.
      Measured 2026-07-30: it gave 68% of the whole base at about 6% useful
      yield — the overwhelming majority are German-language ("m/w/d",
      "Deutschkenntnisse") and are cut by the language filter, and remote is a
      minority among them. Useful only to somebody who reads German or is
      willing to tolerate a low yield.

  - name: contractoruk
    kind: html_search
    remote_only: false
    params_schema:
      queries: "search words; the board matches them as a loose substring"
      max_pages: "pages of 20 cards per query (3 by default)"
    yield_notes: >
      Measured 2026-09-08: 20 cards a page, 142 records over four queries and
      three pages, 121 of them with a day rate and 52 badged Remote. A board of
      CONTRACTS rather than staff jobs — day rate, duration and IR35 status,
      which is the shape of work a contractor abroad can take.
    caveats: >
      Two listing paths behave differently: /contract_jobs?q= silently ignores
      the query and returns building trades, /all_contract_jobs?q= filters. The
      pager is zero-based. "c#" is not searchable there however it is encoded.
      The board never publishes the recruiter, so company is a placeholder, and
      the card carries a ~200-character summary rather than a description.

  - name: reed
    kind: html_search
    remote_only: false
    params_schema:
      keywords: "URL slugs, e.g. net-developer"
      max_pages: "pages of 25 cards per keyword and variant (3 by default)"
    yield_notes: >
      Measured 2026-09-08: 25 cards a page, 98 records from one keyword over
      two pages, every one of them with a stated salary. The largest of the UK
      boards. Its filters were tested the way LinkedIn's should have been: the
      remote slug shares 15 of 25 results with the plain search and the
      contract slug shares none, so all three variants are fetched.
    caveats: >
      Class names are build hashes and change on every deploy — the parser
      reads data-qa attributes instead. The card carries no description;
      enrich_descriptions reads the vacancy page, which publishes a schema.org
      JobPosting.

  - name: jobserve
    kind: html_form_search
    remote_only: false
    params_schema:
      queries: "search phrases, e.g. '.net developer'"
    yield_notes: >
      Measured 2026-09-08: 20 results a query, 14 of 20 naming the agency, 16
      with a day rate and all 20 with a real paragraph of description — the
      richest card of the four UK sources, and the only one that publishes the
      recruiter on the listing.
    caveats: >
      ASP.NET WebForms: a search is three requests (GET the form, POST its
      hidden fields with the keyword, GET JobListing.aspx?shid=...). The field
      names must carry the ctl00$ control prefix or the search silently does
      not happen, and &ovrpp=jl is required — without it the listing came back
      empty on one run in three.

  - name: outside_ir35
    kind: html_search
    remote_only: false
    params_schema:
      queries: "optional search words; the whole board fits in one request"
    yield_notes: >
      Measured 2026-09-08: 50 contracts on a single page, every one with a
      company, a day rate and a working mode, and every one declared outside
      IR35. Only two were .NET that day — a tiny source where almost everything
      is the right KIND of work.
    caveats: >
      Only the .com resolves; the .co.uk is not in DNS. Utility CSS, so the
      parser hangs on the /job/<id> URL shape rather than class names. No
      description on the card and no structured data on the vacancy page.

  - name: manual
    kind: manual_ingest
    remote_only: false
    params_schema: {}
    yield_notes: >
      Not an automatic source. Through tools/ingest_manual.py the agent enters
      finds obtained by ordinary web search — above all from Indeed, Dice and
      companies' careers pages.
    caveats: >
      The one legitimate way to use sites that cannot be read programmatically
      (403 behind anti-bot protection). See docs/SOURCES.md.
