# =============================================================================
#  ТЕХНОЛОГИИ, КОТОРЫЕ НЕЛЬЗЯ ИСКАТЬ ПОДСТРОКОЙ
# =============================================================================
#  Обычная запись выше — "каноническое имя: [формы]", и поиск идёт подстрокой.
#  Для части технологий этого недостаточно: их написание либо встречается
#  внутри посторонних слов, либо, наоборот, само содержит другое название.
#
#  ".NET" — канонический пример и самый дорогой баг в истории проекта.
#  Подробный разбор: docs/TECH_MATCHING.md. Коротко:
#    * подстрока ".net" есть в любом почтовом домене и в любой ссылке;
#    * поэтому в keywords её класть нельзя;
#    * но без неё заголовок "Senior .NET Backend Developer" не совпадает НИ
#      С ОДНИМ ключом, потому что все они длиннее (".NET Core", "ASP.NET");
#    * замер 2026-08-05: 754 вакансии с .NET в заголовке, отклонены ВСЕ,
#      из них 325 — с формулировкой "не .NET/JS роль".
#
#  Решение из двух частей, и обе обязательны:
#    1. почта и ссылки вырезаются из текста ДО поиска (tools/textclean.py);
#    2. технология ищется регуляркой, а не подстрокой.
#
#  ФОРМАТ
#    <каноническое имя>:
#      pattern: регулярка по нормализованному (нижний регистр) тексту
#      redundant_if: [имена], при наличии которых совпадение не засчитывается
#
#  redundant_if обязателен там, где название вложено в другое: ".NET" есть
#  внутри "ASP.NET", и без оговорки одна платформа считалась бы дважды.
#
#  Идентичность НЕ повторяет эти регулярки. Она называет технологию
#  каноническим именем в своём tech_stack, а как её найти — знает этот файл.
# =============================================================================

matching_patterns:

  ".NET":
    substring_unsafe: true
    patterns:
      - '\.net\b'
      - '\bdotnet\b'
      - '\bnet framework\b'
    redundant_if: [".NET Core", ".NET Framework", "ASP.NET", "ASP.NET Core",
                   "ASP.NET MVC", "ASP.NET Web API"]

  ".NET Core":
    patterns:
      - '\bnet core\b'
    redundant_if: [".NET Core"]

  "VB.NET":
    substring_unsafe: true
    patterns:
      - '\bvb\.net\b'

  "C++":
    substring_unsafe: true
    # "c++" не имеет границы слова справа: \b после "+" не срабатывает,
    # поэтому подстрока "c++" ловится в "c++/cli" и подобном корректно, а
    # регулярка нужна, чтобы не поймать "abc++".
    patterns:
      - '(?<![\w+])c\+\+'

  "Go":
    substring_unsafe: true
    # "go" — слишком короткое и слишком частое слово ("go to", "ongoing").
    # Только в явно языковых оборотах.
    patterns:
      - '\bgolang\b'
      - '\bgo developer\b'
      - '\bgo engineer\b'
      - '\bin go\b'
