# =============================================================================
#  TECHNOLOGIES THAT CANNOT BE MATCHED BY SUBSTRING
# =============================================================================
#  An ordinary entry above is "canonical name: [forms]", matched by substring.
#  For some technologies that is not enough: their spelling either occurs
#  inside unrelated words or itself contains another name.
#
#  ".NET" is the canonical example and the most expensive bug in the project's
#  history. The full account is in docs/TECH_MATCHING.md. In short:
#    * the substring ".net" is in every mail domain and every link;
#    * so it cannot go into keywords;
#    * but without it the title "Senior .NET Backend Developer" matches NOT ONE
#      key, because every key is longer (".NET Core", "ASP.NET");
#    * measured 2026-08-05: 754 vacancies with .NET in the title, ALL rejected,
#      325 of them with the wording "not a .NET/JS role".
#
#  A two-part solution, and both parts are mandatory:
#    1. email addresses and links are stripped from the text BEFORE matching
#       (tools/textclean.py);
#    2. the technology is matched by regex rather than by substring.
#
#  FORMAT
#    <canonical name>:
#      pattern: a regex over normalised (lowercase) text
#      redundant_if: [names] whose presence cancels the match
#
#  redundant_if is mandatory where one name is nested inside another: ".NET" is
#  inside "ASP.NET", and without the caveat one platform would count twice.
#
#  An identity does NOT repeat these regexes. It names the technology by its
#  canonical name in its tech_stack, and this file knows how to find it.
# =============================================================================

matching_patterns:

  ".NET":
    substring_unsafe: true
    patterns:
      - '\.net\b'
      - '\bdotnet\b'
      - '\bnet framework\b'
    redundant_if: [".NET Core", ".NET Framework", "ASP.NET", "ASP.NET Core",
                   "ASP.NET MVC", "ASP.NET Web API"]

  ".NET Core":
    patterns:
      - '\bnet core\b'
    redundant_if: [".NET Core"]

  "VB.NET":
    substring_unsafe: true
    patterns:
      - '\bvb\.net\b'

  "C++":
    substring_unsafe: true
    # "c++" has no word boundary on the right: \b after "+" does not fire, so
    # the substring "c++" is caught correctly inside "c++/cli" and the like,
    # and the regex is needed to avoid catching "abc++".
    patterns:
      - '(?<![\w+])c\+\+'

  "Go":
    substring_unsafe: true
    # "go" is too short and too common a word ("go to", "ongoing"). Only in
    # explicitly language-related turns of phrase.
    patterns:
      - '\bgolang\b'
      - '\bgo developer\b'
      - '\bgo engineer\b'
      - '\bin go\b'
