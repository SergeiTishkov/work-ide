# =============================================================================
#  СЛОВАРЬ ТЕХНОЛОГИЙ — что вообще бывает в вакансиях
# =============================================================================
#  Используется отчётом, чтобы показать строкой, какой стек ждут на проекте.
#  Это ГЛОБАЛЬНОЕ требование: список технологий полезен любому пользователю
#  проекта независимо от того, что он ищет, поэтому словарь общий и лежит в
#  config/, а не в идентичности.
#
#  Важно: словарь описывает МИР, а не человека. Здесь есть технологии, которых
#  никто из пользователей не знает — и это правильно: увидеть в отчёте
#  незнакомый стек не менее полезно, чем знакомый.
#
#  ФОРМАТ
#    <Каноническое имя>: [форма, форма, …]
#  Каноническое имя попадает в отчёт, формы — то, чем технологию называют в
#  тексте вакансии. Поиск идёт подстрокой по нормализованному тексту.
#
#  ПРАВИЛО, КУПЛЕННОЕ ОПЫТОМ: никаких коротких общих слов.
#  На этом проекте уже ловились: "LESS" внутри "no less than", "eor" внутри
#  "theoretical", "Multiplier" внутри "productivity multiplier", "ssis" внутри
#  "ai-assisted" (1057 ложных срабатываний), "ssas" внутри португальского
#  "nossas", "java" внутри "javascript". Поэтому:
#    * формы короче 4 символов пишутся с уточнением (".net core", а не ".net");
#    * акронимы — полностью ("sql server integration services", а не "ssis");
#    * названия-омонимы получают суффикс (".js", " framework", " language").
# =============================================================================

