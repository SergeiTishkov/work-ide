# =============================================================================
#  THE TECHNOLOGY VOCABULARY — what turns up in vacancies at all
# =============================================================================
#  Used by the report, to show in one line which stack a project expects.
#  This is a GLOBAL requirement: a list of technologies is useful to any user
#  of the project whatever they are looking for, so the vocabulary is shared
#  and lives in config/ rather than in an identity.
#
#  Note: the vocabulary describes THE WORLD, not a person. It holds
#  technologies none of the users knows — and rightly so: seeing an unfamiliar
#  stack in the report is no less useful than a familiar one.
#
#  FORMAT
#    <Canonical name>: [form, form, …]
#  The canonical name reaches the report; the forms are what the technology is
#  called in vacancy text. Matching is by substring over normalised text.
#
#  A RULE BOUGHT WITH EXPERIENCE: no short generic words.
#  Already caught in this project: "LESS" inside "no less than", "eor" inside
#  "theoretical", "Multiplier" inside "productivity multiplier", "ssis" inside
#  "ai-assisted" (1057 false matches), "ssas" inside the Portuguese "nossas",
#  "java" inside "javascript". Hence:
#    * forms shorter than 4 characters take a qualifier (".net core", not ".net");
#    * acronyms in full ("sql server integration services", not "ssis");
#    * homonymous names take a suffix (".js", " framework", " language").
# =============================================================================

schema_version: 1

