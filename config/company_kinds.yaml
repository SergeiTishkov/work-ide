# Hundreds of small agencies name themselves by what they do: "Spectrum IT
# Recruitment", "Quik Hire Staffing", "Vivid Resourcing" — 400+ such names in
# the base on 2026-10-14. "Undisclosed agency (ContractorUK)" is how
# fetch_contractoruk.py labels a listing whose agency the board hides.
# "talent" is not here: it also names employers ("TALENT Software Services")
# and the measured share of agencies among them was below half.
keywords:
  agency: [recruit, staffing, resourcing, undisclosed agency, search and selection, headhunt]
