# =============================================================================
#  COMPANY KINDS — who stands between the person and the employer
# =============================================================================
#  A board's "company" field is not always the employer. Three kinds of
#  intermediary come through it under their own name (measured 2026-10-14 on
#  the shared base, 17,840 distinct company names):
#
#  marketplace  A freelance talent network: you apply to join its pool, it
#               vets you (tests, interviews), and only then matches you to a
#               client. One application per marketplace, not per vacancy —
#               Proxify listed 66 vacancies under two names ("Proxify",
#               "Proxify AB"), Alignerr 804.
#  agency       A recruitment or staffing agency filling a client's role:
#               "We are Kforce and we have a client in Austin, Texas seeking
#               an AJO Developer". The application goes to the client's
#               vacancy, through the agency.
#  reposter     A platform republishing other companies' vacancies under its
#               own name: "This position is listed on behalf of a partner
#               company, who manages all applications and next steps"
#               (Jobgether, 535 vacancies). The employer is not named.
#
#  Every other company is "other". The app's "Company" drop-down groups by
#  kind (the owner, 2026-10-14), and lists each intermediary by the `name`
#  given here, so "Proxify" and "Proxify AB" are one row.
#
#  MATCHING (tools/company_kinds.py). A company name is normalised first:
#  lower case, punctuation to spaces, legal suffixes dropped from the end
#  ("Ltd", "Limited", "AB", "Pte", "Inc", "GmbH", ...). Then:
#    - an entry matches when the normalised name equals one of its `match`
#      phrases, or starts with one followed by a space ("hays" matches
#      "Hays Specialist Recruitment Limited"); an `exact` phrase matches
#      only the whole name ("turing" is Turing, not "Turing Pharmaceuticals");
#    - otherwise a `keywords` phrase anywhere in the normalised name makes it
#      that kind, and the company is listed under its own name.
#  A `match` phrase must not start an unrelated company's name: "outlier"
#  would take "Outlier Ventures", "arc" would take "Arc IT Recruitment" —
#  hence `exact`, or two words. docs/TECH_MATCHING.md has the general rule
#  about short phrases.
#
#  EFFECT. The pipeline writes the classification into the base with every
#  selection (tools/selections.write_company_kinds); an edit here reaches the
#  app with the next run or rebuild. Nothing is filtered out by this file —
#  it only groups the drop-down.
# =============================================================================

schema_version: 1
last_reviewed: "2026-10-14"

kinds:
  marketplace:
    - {name: Proxify, match: [proxify]}
    - {name: Toptal, match: [toptal]}
    - {name: Turing, exact: [turing], match: [turing com]}
    - {name: micro1, match: [micro1]}
