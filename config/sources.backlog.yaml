# =============================================================================
#  THE SOURCE REGISTRY — what is connected, queued, rejected, and why
# =============================================================================
#  This file exists so that work on sources does not start from nothing every
#  time. Checking "can we take this board" costs one network request and
#  twenty minutes of working out the format; without recording the result, the
#  same board gets checked again a month later.
#
#  So ALL THREE outcomes are recorded here, not only the successes:
#    implemented — connected, a fetcher exists
#    pending     — usable, but not connected yet
#    rejected    — checked and unusable, with the reason and the response code
#
#  Shared by every identity: whether a source is reachable does not depend on
#  the search profile. Whether a particular identity has it ENABLED is that
#  identity's business, see <prefix>_sources.yaml.
#
#  Measurements use live requests with the project's honest User-Agent. The
#  date is mandatory: boards change endpoints more often than one would like
#  (a real case, 2026-08-04: Himalayas began returning "name" in companyName).
# =============================================================================

