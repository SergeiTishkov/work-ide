  # --- Rejected: UK sources checked 2026-09-08, so as not to check again -----

  - name: cwjobs
    status: rejected
    checked: "2026-09-08"
    reason: >
      The home page answers 200, and every page that actually holds vacancies
      drops the connection — ConnectionError and ReadTimeout on /jobs/... at
      both 30 and 60 seconds, from an IP that reaches the rest of the site.
      That is bot management (the host resolves into Akamai), and the only way
      past it is to impersonate a browser. CLAUDE.md section 5 says no.

  - name: cv_library
    status: rejected
    checked: "2026-09-08"
    reason: >
      403 from Cloudflare on every listing and every feed URL tried, while the
      home page answers 200 — protection aimed exactly at the data. Same
      answer as Indeed and Glassdoor, and for the same reason.

  - name: technojobs
    status: rejected
    checked: "2026-09-08"
    reason: >
      Unreachable, not blocked: www.technojobs.co.uk does not resolve at all
      and the apex resolves but refuses every connection, over http and https
      alike. Worth one more look in a few months — this is the failure mode of
      a site that has moved or closed, and it may come back.

  - name: itjobswatch
    status: rejected
    checked: "2026-09-08"
    reason: >
      Not a vacancy source. It answers 200 and is genuinely useful, but what it
      publishes is statistics: "summary statistics and salary benchmarking for
      jobs requiring .NET skills" over a six-month window. There is nothing to
      apply to. See the note under salary benchmarking below.

  - name: uk_recruitment_agencies
    status: rejected
    checked: "2026-09-08"
    reason: >
      Not a source but a category, and one the project already reaches two
      ways: agencies post to LinkedIn in bulk (Sanderson, Vallum Associates,
      Thomson Keene, SoCode and Goodman Masson are all in the current UK
      shortlist through it), and those with a public board are covered by
      fetch_ats. The platforms UK agencies actually run on were probed and none
      serves a public list: Bullhorn 400, JobAdder 404, Vincere 401,
      Teamtailor 406, Pinpoint 404 — all of them per-customer APIs behind
      authentication. An agency worth following individually belongs in
      <prefix>_ats_targets.yaml, one line each.

