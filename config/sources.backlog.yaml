  # --- Queued: UK sources, checked with live requests 2026-09-08 -------------
  #
  # Asked for by the owner, who wants the UK covered properly. Every one below
  # was probed with the project's honest User-Agent — no fingerprint games —
  # and the response is recorded whichever way it went.

  - name: contractoruk
    status: pending
    priority: 1
    kind: html
    endpoint: "https://www.contractoruk.com/all_contract_jobs?q=.net"
    measured: "200; 40 vacancies per page, 88 stack mentions (2026-09-08)"
    note: >
      The best of the nine and the best fit for this search: a CONTRACTOR board,
      so its postings are day-rate contracts rather than payrolled staff jobs.
      Plain GET, ordinary HTML, job links of the form /job/<id>-<slug>.
      Careful with the URL: /contract_jobs?q= silently ignores the query and
      returns building trades; /all_contract_jobs?q= is the one that filters.

  - name: reed
    status: pending
    priority: 2
    kind: html
    endpoint: "https://www.reed.co.uk/jobs/net-developer-jobs"
    measured: "200; 25 vacancies per page, titles all '.NET Developer', pagination via ?pageno= (2026-09-08)"
    note: >
      The largest of the nine. HTML only for now: the official API answers 401
      without a key, and a key — even a free one — is a dependency the project
      does not take on lightly (CLAUDE.md section 7 allows it only via an
      environment variable). The HTML carries data-id and jobId attributes, so
      the parse does not rest on visual markup alone.

  - name: jobserve
    status: pending
    priority: 3
    kind: html
    endpoint: "https://www.jobserve.com/gb/en/Job-Search/"
    measured: "200; 50 job ids per page (2026-09-08)"
    note: >
      Long-standing UK contract board. ASP.NET, so the search is stateful and
      the links are built in script rather than written as hrefs; the job ids
