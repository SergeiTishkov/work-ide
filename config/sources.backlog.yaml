# =============================================================================
#  РЕЕСТР ИСТОЧНИКОВ — что подключено, что в очереди, что отклонено и почему
# =============================================================================
#  Этот файл существует, чтобы работа над источниками не начиналась каждый раз
#  с нуля. Проверка «а можно ли взять вот этот борд» стоит запроса в сеть и
#  двадцати минут разбора формата; без записи результата тот же борд будут
#  проверять снова через месяц.
#
#  Поэтому здесь фиксируются ВСЕ три исхода, а не только успешные:
#    implemented — подключён, есть фетчер
#    pending     — годен, но ещё не подключён
#    rejected    — проверен и не годится, с причиной и кодом ответа
#
#  Общий для всех идентичностей: доступность источника от профиля поиска не
#  зависит. А вот ВКЛЮЧЁН ли источник у конкретной идентичности — это уже её
#  дело, см. <префикс>_sources.yaml.
#
#  Замеры делаются живыми запросами с честным User-Agent проекта. Дата замера
#  обязательна: борды меняют эндпоинты чаще, чем хотелось бы (реальный случай
#  2026-08-04: Himalayas стал отдавать в поле companyName строку "name").
# =============================================================================

