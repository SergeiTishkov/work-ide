    geo_coverage: [israel, uae, saudi_arabia, singapore, switzerland, germany, netherlands, eu, us]
    note: >
      The guest endpoint, served to an anonymous request as designed — the same
      one LinkedIn's own guest interface uses. This is NOT circumventing
      protection: the same request gets 403 from Indeed and 403 from Glassdoor.
      The project's main lever: one fetcher covers every country of interest at
      once, whereas the country boards (Bayt, GulfTalent, Drushim) are shut.
      THE PRICE: undocumented HTML. The parser must return 0 when the markup
      changes, not broken records.

