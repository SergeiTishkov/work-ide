# =============================================================================
#  FROZEN SETTINGS — what the upper layers cannot change
# =============================================================================
#  Layered settings work so that a more specific layer beats a more general
#  one: an identity beats the shared configuration, and a person's own file
#  beats the template. The mechanics are in tools/settings.py, the explanation
#  in docs/OVERRIDES.md.
#
#  But the specific beating the general is a rule about PREFERENCES, not about
#  boundaries. Some things exist precisely so that they cannot be lifted
#  locally: otherwise one line in a file outside git would be enough to remove
#  a prohibition quietly, and nobody else would ever know.
#
#  The keys listed here are those. An attempt to set any of them at the
#  identity or personal layer FAILS THE LOAD with an explanation — it is not
#  ignored silently. Silent ignoring would be the worst outcome: the person
#  would believe their setting worked.
#
#  The list is deliberately short. Only things whose removal is a mistake or a
#  workaround rather than a choice are worth freezing.
#
#  FORMAT
#    <dotted key>: a reason comprehensible to whoever hits the refusal
#  A key freezes everything beneath it too: "a.b" also closes "a.b.c".
# =============================================================================

schema_version: 1

frozen:

  identity.kind: >
    The marker of a test fixture. If it could be overridden locally, the
    fixture would turn into a live identity and start writing into the real
    reports/ and data/ — exactly the litter the safety net in
    tests/conftest.py exists to prevent.

  scraping.bypass_bot_protection: >
    Circumventing active anti-bot protection is forbidden by the constitution
    (§5, the boundary of what is allowed) and is not a user preference. The
    key is frozen in advance, before anybody thinks to introduce it.

  privacy.allow_personal_data_in_git: >
    Personal data does not reach the shared repository. That is not a search
    setting but a promise made to a person: the repository can be shown to
