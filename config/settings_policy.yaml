# =============================================================================
#  ЗАМОРОЖЕННЫЕ НАСТРОЙКИ — то, что верхние слои менять не могут
# =============================================================================
#  Слоистые настройки устроены так, что более частный слой перебивает более
#  общий: идентичность сильнее общей конфигурации, Малая Конституция сильнее
#  идентичности. Механика — tools/settings.py, объяснение — docs/OVERRIDES.md.
#
#  Но приоритет частного над общим — правило для ПРЕДПОЧТЕНИЙ, а не для
#  границ. Есть вещи, которые существуют именно затем, чтобы их нельзя было
#  отменить локально: иначе достаточно одной строчки в файле вне гита, чтобы
#  тихо снять запрет, о котором никто больше не узнает.
#
#  Здесь перечислены такие ключи. Попытка задать любой из них на слое
#  идентичности или Малой Конституции РОНЯЕТ загрузку с объяснением — не
#  игнорируется молча. Молчаливое игнорирование было бы хуже всего: человек
#  думал бы, что настройка работает.
#
#  Список намеренно короткий. Замораживать стоит только то, отмена чего
#  является не выбором, а ошибкой или обходом.
#
#  ФОРМАТ
#    <точечный ключ>: причина, понятная тому, кто наткнётся на отказ
#  Ключ замораживает и всё, что под ним: "a.b" закрывает и "a.b.c".
# =============================================================================

schema_version: 1

frozen:

  identity.kind: >
    Признак тестовой фикстуры. Если бы его можно было переопределить локально,
    фикстура превратилась бы в живую идентичность и начала писать в настоящие
    reports/ и data/ — ровно тот мусор, ради предотвращения которого сделана
    страховка в tests/conftest.py.

  scraping.bypass_bot_protection: >
    Обход активной антибот-защиты запрещён Большой Конституцией (§5, граница
    дозволенного) и не является предпочтением пользователя. Ключ заморожен
    заранее, до того как кому-нибудь придёт в голову его завести.

  privacy.allow_personal_data_in_git: >
    Личные данные не попадают в общий репозиторий. Это не настройка поиска, а
    обещание, данное человеку: репозиторий можно показать кому угодно.
