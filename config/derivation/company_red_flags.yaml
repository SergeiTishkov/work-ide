# =============================================================================
#  EMPLOYER RED FLAGS — the catalogue and the default weights
# =============================================================================
#  Red flags come from former employees' reviews as free text
#  ("late payments", "unpredictable work availability") — the agent gathers
#  them by hand through `tools/kb.py set-company-reputation`. Free text cannot
#  be scored with one weight for everything: "they pay late" and "the open-plan
#  office is noisy" are not the same thing to a candidate.
#
#  Here every category gets phrase recognition and a DEFAULT weight. The
#  weights are shared: they describe how bad a thing is in itself, regardless
#  of who is looking for work.
#
#  OVERRIDING. Any weight here is overridden at identity level by the
#  `company_red_flag_severity` field in the profile. And it is overridden IN
#  EITHER DIRECTION, including into a plus: for one person "unpredictable
#  workload" is the risk of having no money, for another it is exactly what
#  they want, because the workload is low. The mechanics and the boundaries of
#  overriding are in docs/OVERRIDES.md.
#
#  PHRASES. The project's general rule about short words applies: a phrase
#  shorter than four characters, or one matching an ordinary word, will produce
#  false positives. See docs/TECH_MATCHING.md.
# =============================================================================

schema_version: 1
last_reviewed: "2026-08-05"

# The weight of a flag that could not be placed in any category. Moderately
# negative: since a person thought it worth recording, there is something
# there, but we have no right to guess how serious.
unrecognised_points: -5

categories:

  late_payment:
    display_name: "Late or problematic payments"
    # For a contractor this is not a nuance of the terms but the substance of
    # the deal: the work is done and the money has not arrived. Hence the
    # heaviest weight in the catalogue.
    default_points: -14
    phrases:
      - "late payment"
      - "delayed payment"
      - "payment delay"
      - "payment issue"
      - "problems with payment"
      - "not paid on time"
      - "unpaid invoice"
      - "withheld payment"
      - "salary delay"

  unstable_workload:
    display_name: "Unpredictable or irregular workload"
    # Ambiguous by nature: for somebody living on that money it is a risk; for
    # somebody whose income does not depend on this work it is a sign of low
    # intensity. Precisely the case the weight override was built for.
    default_points: -8
    phrases:
      - "unpredictable work"
      - "irregular work"
      - "inconsistent work"
      - "unstable workload"
      - "no guaranteed hours"
      - "sporadic work"
      - "work availability"

  overwork:
    display_name: "Overtime and burnout"
    default_points: -16
    phrases:
      - "long hours"
      - "overwork"
      - "burnout"
      - "unpaid overtime"
      - "crunch"
      - "always on call"
      - "no work-life balance"
      - "poor work-life balance"

  toxic_management:
    display_name: "Toxic management"
    default_points: -14
    phrases:
      - "toxic management"
      - "toxic culture"
      - "micromanagement"
      - "micromanaging"
      - "bullying"
      - "high turnover"
      - "constant reorg"

  instability:
    display_name: "Company instability"
    default_points: -10
    phrases:
      - "layoff"
      - "mass redundancies"
      - "financial trouble"
      - "running out of runway"
      - "hiring freeze"

  process_chaos:
    display_name: "Chaotic processes"
    # For a search after calm legacy work this is noise rather than disaster —
    # but that is for the identity to decide through an override, not the
    # catalogue.
    default_points: -6
    phrases:
      - "no processes"
      - "chaotic"
      - "constantly changing priorities"
      - "unclear expectations"
      - "no onboarding"
