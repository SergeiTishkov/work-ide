# =============================================================================
#  DERIVING THE LANGUAGE FILTERS
# =============================================================================
#  As with geography, a language filter is a consequence rather than a
#  preference: ONLY the languages a person does NOT know go into the criteria.
#
#  The generation rule:
#    for each language L:
#      if the person does NOT speak L:
#        requirement_phrases -> language_requirement_signal.explicit_requirement_keywords
#      otherwise:
#        nothing is added
#
#  So a German speaker simply has no German block in their file. Copying
#  somebody else's language filter is wrong for the same reason as geography.
#
#  Separately: market_indicator_keywords is the heuristic "this vacancy is
#  written entirely in this language". It is needed because many postings
#  contain no explicit "German required" phrase while being written in German;
#  for somebody who does not speak it, that is the same stop signal.
# =============================================================================

schema_version: 1

languages:
  german:
    display_name: "German"
    requirement_phrases:
      - "fluent german"
      - "german required"
      - "german language required"
      - "advanced german"
      - "native german speaker"
      - "german speaker required"
      - "german c1"
      - "german c2"
      - "sehr gute deutschkenntnisse"
      - "gute deutschkenntnisse"
      - "deutschkenntnisse"
      - "verhandlungssicheres deutsch"
      - "muttersprache deutsch"
      - "fließend deutsch"
    # Words and markup typical of German-language postings. "m/w/d" is the
    # standard German gender qualifier in a vacancy title.
    market_indicator_keywords:
      - "m/w/d"
      - "w/m/d"
      - "wir suchen"
      - "ihre aufgaben"
      - "ihr profil"
      - "kenntnisse"
      - "bewerbung"
      - "unser unternehmen"
      - "homeoffice"
      - "vollzeit"
      - "teilzeit"
      - "arbeitszeit"
      - "mitarbeiter"
      - "unternehmen"
    market_indicator_threshold: 3

  french:
    display_name: "French"
    requirement_phrases:
      - "fluent french"
      - "french required"
      - "native french speaker"
      - "français courant"
      - "maîtrise du français"
    market_indicator_keywords:
      - "nous recherchons"
      - "vos missions"
      - "votre profil"
      - "entreprise"
      - "poste"
      - "compétences"
    market_indicator_threshold: 3

  spanish:
    display_name: "Spanish"
    requirement_phrases:
      - "fluent spanish"
      - "spanish required"
      - "native spanish speaker"
      - "español nativo"
    market_indicator_keywords:
      - "buscamos"
      - "tus funciones"
      - "tu perfil"
      - "requisitos"
      - "empresa"
    market_indicator_threshold: 3

  italian:
    display_name: "Italian"
    requirement_phrases:
      - "fluent italian"
      - "italian required"
      - "native italian speaker"
    market_indicator_keywords:
      - "cerchiamo"
      - "il tuo profilo"
      - "requisiti"
      - "azienda"
    market_indicator_threshold: 3

  dutch:
    display_name: "Dutch"
    requirement_phrases:
      - "fluent dutch"
      - "dutch required"
      - "native dutch speaker"
      - "nederlands vereist"
    market_indicator_keywords:
      - "wij zoeken"
      - "jouw profiel"
      - "functie-eisen"
      - "bedrijf"
    market_indicator_threshold: 3

  english:
    display_name: "English"
    requirement_phrases:
      - "fluent english"
      - "english required"
      - "native english speaker"
      - "english c1"
    market_indicator_keywords: []
    market_indicator_threshold: 99   # English is the default language, no heuristic

  russian:
    display_name: "Russian"
    requirement_phrases:
      - "russian required"
      - "fluent russian"
      - "native russian speaker"
    market_indicator_keywords: []
    market_indicator_threshold: 99
