# =============================================================================
#  ЯРУСЫ РЫНКОВ ТРУДА — где искать удалённую работу и где не стоит
# =============================================================================
#  Таблица общая для всех идентичностей: она описывает объективное положение
#  дел на рынке, а не предпочтения конкретного человека. Какие ярусы включены
#  и с какими исключениями — это уже выбор идентичности
#  (<префикс>_profile.yaml -> target_markets).
#
#  ГЛАВНОЕ РАЗЛИЧЕНИЕ, ради которого таблица и существует: страны-ИМПОРТЁРЫ
#  разработки против стран-ЭКСПОРТЁРОВ.
#
#    Импортёр  — разработчиков не хватает, их нанимают снаружи. Ставки выше,
#                условия лучше, к удалённому контрактору относятся как к
#                дефицитному специалисту.
#    Экспортёр — разработчиков в избытке, страна сама поставляет их наружу.
#                Локальные вакансии там конкурируют по цене вниз, и удалённая
#                работа на такой рынок означает худшие ставки при той же
#                нагрузке.
#
#  Это не оценка людей или стран, а описание направления потока работы. Для
#  человека, ищущего удалённую работу за пределами своей страны, направление
#  потока — самый сильный предиктор ставки.
#
#  Ярусы используются:
#    * фетчером LinkedIn — как список локаций для запросов;
#    * скорингом — как источник acceptable/restrictive региональных сигналов
#      (через config/derivation/regions.yaml).
# =============================================================================

schema_version: 1
last_reviewed: "2026-08-04"

tiers:

  importer_prime:
    description: >
      Выраженный дефицит разработчиков, высокие ставки, развитая практика
      найма контракторов из-за рубежа. Первый приоритет для поиска.
    countries:
      - name: "United States"
        note: "Самый большой рынок и потолок ставок. Часто требуют резидентство — фильтруется скорингом."
      - name: "Canada"
      - name: "Switzerland"
        note: "Высочайшие ставки в Европе. Для контрактора из третьей страны реалистичнее США."
      - name: "Germany"
      - name: "Netherlands"
      - name: "United Kingdom"
      - name: "Ireland"
      - name: "Sweden"
      - name: "Norway"
      - name: "Denmark"
      - name: "Finland"
      - name: "Israel"
        note: >
          Высокая плотность технологических компаний при нехватке инженеров;
          распространён найм контракторов. Многие используют Workable и
          Greenhouse — доступны напрямую через ATS.
      - name: "United Arab Emirates"
        note: "Дубай и Абу-Даби: быстро растущий технологический сектор, ноль подоходного налога."
      - name: "Saudi Arabia"
        note: "Крупные государственные программы цифровизации, спрос выше локального предложения."
      - name: "Singapore"
        note: "Хаб региона. Есть государственный портал MyCareersFuture с открытым API."
      - name: "Australia"

  importer_ok:
    description: >
      Второй приоритет: более низкий потолок ставок, языковой барьер или
      меньшая практика удалённого найма из-за рубежа. Сюда же попадают рынки,
      ценные не ставкой, а другими причинами — например, возможностью
      переезда домой.
    countries:
      - name: "Austria"
      - name: "Belgium"
      - name: "France"
        note: "Часто требуется французский — отсекается языковым фильтром."
      - name: "Spain"
      - name: "Italy"
      - name: "Japan"
        note: "Языковой барьер; англоязычные позиции есть, но их меньшинство."
      - name: "South Korea"
      - name: "New Zealand"
      - name: "Luxembourg"
      - name: "Iceland"
      - name: "Belarus"
        note: >
          Родной рынок для русскоязычного кандидата: сюда возможен переезд, а не
          только удалённая работа. Ставки ниже западных, поэтому ярус второй, а
          не первый — но исключать нельзя, вакансия отсюда может оказаться
          интересной по причинам, которых нет в цифрах.
      - name: "Russia"
        note: "Русскоязычный рынок, изредка встречаются интересные позиции."

  exporter_avoid:
    description: >
      Нетто-экспортёры разработки: страна сама поставляет инженеров наружу.
      Локальные вакансии конкурируют по цене вниз. Исключены из поиска
      осознанно — не по качеству специалистов, а по направлению потока работы
      и, как следствие, по ставкам и условиям.
    countries:
      - name: "India"
      - name: "Pakistan"
      - name: "Philippines"
      - name: "Bangladesh"
      - name: "Vietnam"
      - name: "Indonesia"

  excluded_practical:
    description: >
      Исключены по практическим причинам, не по рынку: невозможность или
      сложность получить оплату.
    countries:
      - name: "Ukraine"
        note: >
          Трансграничные платежи белорусским и российским контракторам
          затруднены, ставки в последние годы низкие.
