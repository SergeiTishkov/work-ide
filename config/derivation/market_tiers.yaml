# =============================================================================
#  LABOUR MARKET TIERS — where to look for remote work, and where not to
# =============================================================================
#  The table is shared by every identity: it describes the objective state of
#  the market rather than one person's preferences. Which tiers are enabled,
#  and with what exceptions, is the identity's choice
#  (<prefix>_profile.yaml -> target_markets).
#
#  THE CENTRAL DISTINCTION the table exists for: countries that IMPORT
#  development work versus countries that EXPORT it.
#
#    Importer — developers are scarce and are hired from outside. Rates are
#               higher, terms are better, and a remote contractor is treated as
#               a scarce specialist.
#    Exporter — developers are plentiful and the country supplies them outward.
#               Local vacancies there compete downwards on price, and remote
#               work for such a market means worse rates for the same
#               workload.
#
#  This is not a judgement of people or countries but a description of which
#  way the work flows. For somebody looking for remote work outside their own
#  country, the direction of flow is the strongest predictor of the rate.
#
#  The tiers are used (verified by grep on 2026-08-05, not from memory):
#    * by the LinkedIn fetcher, as the list of locations to query (markets.py);
#    * by scoring — a vacancy whose location falls in a target market does NOT
#      count as a geography restriction (score._target_market_of).
#
#  Until 2026-08-05 this header listed one more consumer that did not exist in
#  the code: scoring did not read the tiers at all. Of 3281 European vacancies,
#  ONE reached the shortlist, because the location gate discarded Germany and
#  Britain as "tied to a country" although the table placed them in the first
#  tier. A documented link that does not exist is the longest-lived kind of
#  bug: the tests are green and the documentation is convincing. See
#  docs/OVERRIDES.md.
# =============================================================================

schema_version: 1
last_reviewed: "2026-08-04"

tiers:

  importer_prime:
    description: >
      A pronounced shortage of developers, high rates, and an established
      practice of hiring contractors from abroad. First priority for a search.
    countries:
      - name: "United States"
        note: "The biggest market and the ceiling on rates. Residency is often required — filtered by scoring."
      - name: "Canada"
      - name: "Switzerland"
        note: "The highest rates in Europe. More realistic than the US for a contractor from a third country."
      - name: "Germany"
      - name: "Netherlands"
      - name: "United Kingdom"
      - name: "Ireland"
      - name: "Sweden"
      - name: "Norway"
      - name: "Denmark"
      - name: "Finland"
      - name: "Israel"
        note: >
          A high density of technology companies against a shortage of
          engineers; hiring contractors is widespread. Many use Workable and
          Greenhouse, reachable directly through their ATS.
      - name: "United Arab Emirates"
        note: "Dubai and Abu Dhabi: a fast-growing technology sector, zero income tax."
      - name: "Saudi Arabia"
        note: "Large state digitisation programmes; demand exceeds local supply."
      - name: "Singapore"
        note: "The region's hub. The government portal MyCareersFuture has an open API."
      - name: "Australia"

  importer_ok:
    description: >
      Second priority: a lower ceiling on rates, a language barrier, or less
      practice of remote hiring from abroad. Markets valuable for reasons other
      than the rate also land here — the possibility of moving home, for
      instance.
    countries:
      - name: "Austria"
      - name: "Belgium"
      - name: "France"
        note: "French is often required — cut by the language filter."
      - name: "Spain"
      - name: "Italy"
      - name: "Japan"
        note: "A language barrier; English-language positions exist but are a minority."
      - name: "South Korea"
      - name: "New Zealand"
      - name: "Luxembourg"
      - name: "Iceland"
      - name: "Belarus"
        note: >
          The home market for a Russian-speaking candidate: moving there is
          possible, not only remote work. Rates are below western ones, hence
          the second tier rather than the first — but it must not be excluded:
          a vacancy from here may be interesting for reasons the numbers do not
      - name: "Russia"
        note: "A Russian-speaking market; interesting positions turn up occasionally."

  exporter_avoid:
    description: >
      Net exporters of development work: the country supplies engineers
      outward. Local vacancies compete downwards on price. Excluded from the
      search deliberately — not on the quality of the specialists but on the
      direction the work flows and, in consequence, on rates and terms.
    countries:
      - name: "India"
      - name: "Pakistan"
      - name: "Philippines"
      - name: "Bangladesh"
      - name: "Vietnam"
      - name: "Indonesia"

  excluded_practical:
    description: >
      Excluded for practical rather than market reasons: getting paid is
      impossible or difficult.
    countries:
      - name: "Ukraine"
        note: >
          Cross-border payments to contractors there are difficult, and rates
          have been low in recent years.
