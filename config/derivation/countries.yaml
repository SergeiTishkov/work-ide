# The last part of "Seattle, WA" or "Austin, Texas": {code: name}. A null name
# means the code alone counts — Georgia the state shares its name with the
# country (ambiguous_places.yaml), Victoria with the capital of British
# Columbia. A code two countries use (WA, NT) belongs to the first listed.
# A code is a weaker word than a city: "Berlin, DE" is not Delaware, and
# when the two disagree no country is taken from either.
