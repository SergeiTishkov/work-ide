# =============================================================================
#  THE COUNTRIES OF THE WORLD, AND THE PLACES INSIDE THEM A JOB BOARD NAMES
# =============================================================================
#  Read by report.hiring_country: which country a vacancy's location names.
#
#  Why a table of its own (2026-10-06). The country index used to be the
#  countries of market_tiers.yaml — 35 of them, the markets somebody wanted
#  ranked. "Bucharest, Romania", "Lithuania", "Brazil only" named no country it
#  knew, and a vacancy naming no country is listed as "Worldwide — no country
#  tie". So were "New York", "Berlin" and "Seattle, WA": SHARP's worldwide list
#  held 134 devitjobs vacancies from US and Canadian offices, an office job in
#  Calgary among them.
#
#  `name` is the canonical spelling, the one market_groups.yaml and
#  market_tiers.yaml use. `aliases` are other spellings boards use. `iso2` is
#  read where a board sends a code (landing.jobs: country_code "PT"), never
#  searched for in free text: "IN", "IT", "NO" are words.
#
#  `regions` (states, provinces) and `cities` are matched only against a whole
#  comma-separated part of the location ("Seattle, WA", "Berlin"), never as a
#  substring of a longer text. A city whose name is shared by two well-known
#  places (Birmingham, Portland, Cambridge, Córdoba) is left out: unresolved,
#  it is still listed under "Rest of the world", not as worldwide.
# =============================================================================

