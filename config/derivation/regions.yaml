# =============================================================================
#  DERIVING GEOGRAPHY RULES FROM RESIDENCY
# =============================================================================
#  The project's most important table, and the most dangerous to copy-paste.
#
#  Geography disqualifiers are NOT a person's preference but a CONSEQUENCE of
#  their residency. The same phrase "US only" disqualifies a resident of a
#  third country and is a plus for a resident of the US. So copying somebody
#  else's restrictive_region_signal is wrong: it will silently throw away half
#  the market, or fill the shortlist with vacancies the person cannot take.
#
#  The generation rule:
#
#    for each region R:
#      if the person is a resident of, or has the right to work in, R:
#        residency_required_phrases -> acceptable_region_signal   (A PLUS)
#        citizenship_phrases        -> not added to the disqualifiers
#      otherwise:
#        residency_required_phrases -> restrictive_region_signal  (REJECTION)
#        citizenship_phrases        -> hard_dealbreakers          (REJECTION)
#      if R is a target market AND the person is NOT a resident:
#        company_located_phrases    -> acceptable_region_signal   (a small plus)
#
#  The distinction between the last two sets is fundamental: "the company is in
#  X" ≠ "residency in X is required". The project has already been burned on
#  this — the phrase "EU Remote" first landed among the pluses as a European
#  company, although it means EU residency is required.
#
#  The list of regions is knowingly incomplete — the world is large. Extend it
#  as needed; an unknown region simply produces no rules, and the manual check
#  in docs/VACANCY_CHECKLIST.md will catch it.
# =============================================================================

schema_version: 1

regions:
  united_states:
    display_name: "United States"
    residency_required_phrases:
      - "us only"
      - "usa only"
      - "remote (us)"
      - "remote - us"
      - "us remote only"
      - "must be located in the united states"
      - "must reside in the us"
      - "must be based in the us"
      - "us-based only"
    citizenship_phrases:
      - "us citizen required"
      - "us citizenship required"
      - "must be a us citizen"
      - "u.s. person required"
      - "united states person required"
      - "itar"              # export control: in effect requires a US person
      - "security clearance"
    company_located_phrases:
      - "united states"
      - "usa"
      - "u.s."

  canada:
    display_name: "Canada"
    residency_required_phrases:
      - "canada only"
      - "must be based in canada"
      - "must reside in canada"
      - "remote (canada)"
      - "canadian residents only"
    citizenship_phrases:
      - "canadian citizenship required"
      - "must be a canadian citizen"
    company_located_phrases:
      - "canada"
      - "toronto"
      - "vancouver"
      - "montreal"

  european_union:
    display_name: "European Union"
    residency_required_phrases:
      - "eu remote"
      - "remote (eu)"
      - "remote europe"
      - "eu only"
      - "europe only"
      - "must be based in the eu"
      - "eu residents only"
      - "eastern europe only"
      - "western europe only"
      - "nordics only"
      - "dach only"
      - "benelux only"
    citizenship_phrases:
      - "eu citizenship required"
      - "must be eu resident"
      - "eu work permit required"
      - "right to work in the eu"
    company_located_phrases:
      - "european union"
      - "europe"

  united_kingdom:
    display_name: "United Kingdom"
    residency_required_phrases:
      - "uk only"
      - "remote (uk)"
      - "must be based in the uk"
      - "must be located in the uk"
      - "uk residents only"
    citizenship_phrases:
      - "right to work in the uk"
      - "uk work permit required"
    company_located_phrases:
      - "united kingdom"
      - "london"

  latam:
    display_name: "Latin America"
    residency_required_phrases:
      - "remote latam"
      - "latam only"
      - "latin america only"
      - "mexico only"
      - "must be based in mexico"
      - "brazil only"
      - "argentina only"
    citizenship_phrases: []
    company_located_phrases:
      - "latam"
      - "latin america"

  apac:
    display_name: "Asia-Pacific"
    residency_required_phrases:
      - "remote apac"
      - "apac only"
      - "asia pacific only"
      - "australia and new zealand only"
      - "anz only"
      - "india only"
      - "must be based in india"
      - "philippines only"
    citizenship_phrases: []
    company_located_phrases:
      - "apac"
      - "asia pacific"

  israel:
    display_name: "Israel"
    residency_required_phrases:
      - "israel only"
      - "must be based in israel"
      - "israeli residents only"
    citizenship_phrases:
      - "israeli citizenship required"
    company_located_phrases:
      - "israel"
      - "tel aviv"

  uae:
    display_name: "United Arab Emirates"
    residency_required_phrases:
      - "uae only"
      - "must be based in uae"
    citizenship_phrases:
      - "uae residency required"
    company_located_phrases:
      - "uae"
      - "united arab emirates"
      - "dubai"
      - "abu dhabi"

# Phrases meaning "we hire from anywhere". They do not depend on residency and
# go into every identity's worldwide_remote.
worldwide_phrases:
  - "remote worldwide"
  - "remote - anywhere"
  - "remote anywhere"
  - "work from anywhere"
  - "hire anywhere"
  - "globally remote"
  - "international remote"
  - "remote (global)"
