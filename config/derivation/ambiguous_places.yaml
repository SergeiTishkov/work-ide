# =============================================================================
#  НЕОДНОЗНАЧНЫЕ ТОПОНИМЫ — заготовки правил
# =============================================================================
#  Одно название — два разных места на карте. В тексте вакансии это регулярно
#  приводит к неверным выводам о том, где работа.
#
#  Правило подставляется в идентичность, если её страна или город совпадает с
#  одним из значений. Механизм в score.py помечает вакансию на ручную проверку,
#  только если сработал контекст ОБОИХ значений или НИ ОДНОГО: одно ясное
#  значение — не повод дёргать человека.
#
#  Историческая справка: изначально в проекте был захардкожен единственный
#  случай — Georgia (страна vs штат США) — потому что так сложилось у первого
#  пользователя. Обобщено, когда стало ясно, что ловушка не уникальна.
# =============================================================================

