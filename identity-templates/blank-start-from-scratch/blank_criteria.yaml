compensation_signal:
  has_explicit_range_points: 8
  # Подтверждено человеком явно (2026-07-30): если ЗП не указана в самой
  # вакансии, но агент нашёл примерный рендж из стороннего источника
  # (Glassdoor и т.п.) через ручное исследование — это маленький плюс,
  # меньше, чем явно указанная в вакансии ставка. Заполняется через
  # `tools/kb.py set-salary-estimate` в vacancy.external_signals.
  external_estimate_points: 3
  no_range_points: 0
  below_target_penalty: -6
  above_target_bonus: 2
  # диапазон таргета берётся из profile.yaml goal.target_compensation

company_reputation_signal:
  # Репутация работодателя по внешним источникам (Glassdoor, Indeed reviews,
  # Trustpilot, отзывы на профильных площадках). КРИТИЧНО именно для этого
  # проекта: цель — спокойное место с хорошим work-life balance, а это ровно
  # то, чего в тексте вакансии никогда не напишут, зато честно пишут
  # бывшие сотрудники в отзывах.
  #
  # Заполняется ВРУЧНУЮ агентом через `tools/kb.py set-company-reputation`
  # (Glassdoor и подобные нельзя скрейпить автоматически — ToS; агент ищет
  # их через обычный веб-поиск, как это сделал бы человек, см.
  # docs/SOURCES.md). Хранится в companies.json → reputation и применяется
  # ко ВСЕМ вакансиям этой компании сразу.
  #
  # Шкала рейтинга предполагается 1..5 (как у Glassdoor/Indeed).
  overall_rating:
    excellent_threshold: 4.0    # >= — заметный плюс
    excellent_points: 8
    decent_threshold: 3.5       # >= — небольшой плюс
    decent_points: 4
    poor_threshold: 2.8         # <= — штраф
    poor_points: -10
    # Совсем низкий рейтинг — это не просто минус в баллах, а красный флаг:
    # вакансия помечается needs_manual_review, чтобы владелец точно прочитал
    # причину, прежде чем тратить время на отклик.
    alarming_threshold: 2.5
  work_life_balance:
    # Отдельная ось, и для ЭТОГО проекта она важнее общего рейтинга:
    # компания может быть "хорошей" по общему баллу за счёт зарплат и
    # карьерного роста, но при этом выжимать людей — а нужно ровно обратное.
    excellent_threshold: 4.0
    excellent_points: 10
    poor_threshold: 3.0
    poor_points: -12
  # Свободные пометки агента по итогам чтения отзывов. Наличие любой из них
  # — красный флаг для ручной проверки, независимо от цифр.
  red_flag_keywords:
    - "layoffs"
    - "mass layoff"
    - "unpaid overtime"
    - "does not pay"
    - "late payments"
    - "toxic"
    - "micromanagement"
    - "constant crunch"
    - "high turnover"
    - "burnout"
    - "return to office"
    - "rto mandate"
  no_data_points: 0   # нет данных — строго нейтрально, как и с зарплатой

  # Зрелость компании — собирается АВТОМАТИЧЕСКИ из Wikidata
  # (`tools/company_intel.py`), в отличие от рейтингов выше.
  # profile.yaml → ideal_company_traits упоминает "mature company (10+
  # years old)": у старой компании обычно устоявшиеся процессы, легаси-
  # системы и спокойный темп — ровно то, что нужно. До 2026-07-31 этот
  # признак был записан в профиле, но нигде не проверялся.
  company_age:
    mature_threshold_years: 10
    mature_points: 6
    established_threshold_years: 5
    established_points: 3
    very_young_threshold_years: 3
    very_young_points: -4   # компания моложе 3 лет — обычно ещё стартап-режим

contractor_friendliness:
  points_per_keyword: 5
  cap: 5
  keywords:
    - "1099"
    - "contractor"
    - "eor"
    - "deel"
    - "remote.com"
    - "oyster"
    - "papaya global"
    - "multiplier"
    - "globalization partners"
    - "velocity global"

classification_thresholds:
  # ПЕРЕСМОТРЕНО 2026-07-30 (важное изменение логики).
  #
  # Пороги 65/45/25 достались с той эпохи, когда score был ЕДИНСТВЕННЫМ
  # фильтром — тогда высокий порог защищал от мусора. Сейчас фильтрацию
  # делают жёсткие гейты (стек, локация, язык, профессия, сложность роли):
  # всё непроходное уже отсеяно в "rejected". Для того, что ГЕЙТЫ ПРОПУСТИЛИ,
  # балл должен РАНЖИРОВАТЬ, а не выбрасывать.
  #
  # Найденная проблема (реальные данные): вакансии, прошедшие все гейты
  # (worldwide remote, JS/.NET стек, английский, роль разработчика) —
  # например "Staff Software Engineer (Magic Containers)" (18 баллов),
  # "Senior Vue Developer" (15), "Senior React Full-stack Developer" (15) —
  # не попадали в отчёт вообще. Обычная нормальная remote-вакансия без слов
  # "legacy"/"part-time"/явной вилки набирает всего ~15 баллов: бонусы
  # начисляются за скуку и низкую нагрузку, а их мало кто пишет в тексте.
  # В результате из 966 вакансий владельцу показывалась 1 — при том что
  # ~50 реально прошли все проверки на пригодность.
  hot_lead: 45
  worth_a_look: 25
  long_shot: 8
  # ниже long_shot -> low_priority
  # наличие hard dealbreaker keyword -> статус "rejected" независимо от очков
