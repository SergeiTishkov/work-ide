# The blank template: for anyone none of the ready-made ones suits.
#
# It is VALID (it passes identity.py validate) but NOT READY: until the
# placeholders are replaced, the readiness check forbids searching with it.
# That is deliberate — a real case, 2026-08-04: creating an identity and
# running the pipeline on placeholders produced plausible rubbish over 1734

name: blank
version: 1
summary: >
  Empty scaffolding with every file and detailed comments, but no ready-made
  settings. Filled in per docs/ONBOARDING.md together with the agent.
suitable_for: >
  Any search that none of the ready-made templates suits.
