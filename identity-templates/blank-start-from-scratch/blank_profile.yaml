# =============================================================================
#  ШАБЛОН ПРОФИЛЯ ИДЕНТИЧНОСТИ
# =============================================================================
#  Копируется как <префикс>_profile.yaml и заполняется по ответам вопросника.
#  Человекочитаемая "истина" о том, кто ищет и что именно.
#
#  Заполнять ВМЕСТЕ С ЧЕЛОВЕКОМ (docs/ONBOARDING.md), а не догадками.
# =============================================================================

identity:
  kind: personal   # personal | shared_example | fixture
  # Одной фразой: что означает высокий score именно в ЭТОМ поиске. Строка
  # печатается в шапке каждого отчёта, поэтому пишется человеческим языком.
  # У каждой идентичности она своя: то, что здесь плюс, для другого поиска
  # может быть минусом.
  scoring_philosophy: >
    <например: чем выше score, тем больше вакансия похожа на спокойную
    легаси-поддержку с низкой конкуренцией — то, что нужно.>
  display_name: "<короткое название, видно в баннере инструментов>"
  abbreviation: "<ПРЕФИКС> = <расшифровка>"
  created_at: "<ГГГГ-ММ-ДД>"

contact:
  # Куда писать владельцу сайта, если он захочет связаться (честный
  # User-Agent — инженерное обязательство проекта).
  #   "local"        -> читать из local-constitution/personal/<p>/<p>_contact.yaml
  #   "you@mail.com" -> прямо здесь (попадёт в общий репозиторий!)
  #   null           -> без контакта (doctor выдаст предупреждение)
  user_agent_contact: ""   # ваша почта; заполняется в локальной идентичности

# ==== ЛИЧНОЕ И ОБЩЕЕ ====
#
# Значение `local` означает: настоящее значение лежит в
# local-constitution/personal/<префикс>/<префикс>_owner.yaml (вне гита) и
# подставляется при активации идентичности.
#
# Проверочный вопрос, что куда: «изменится ли это, если тем же поиском
# воспользуется другой человек?» Да -> local. Нет -> пишите значение здесь.
#
# Заготовку owner.yaml создаёт `python tools/identity.py init-local`.
owner:
  name: "<ваше имя>"
  linkedin: "<ссылка на ваш LinkedIn>"
  years_experience: 0            # ваш стаж в годах        # стаж личный; уровень — в role ниже
  role: "<должность: senior backend, lead QA…>"   # характеристика ПОИСКА
  # CV лежит в Малой Конституции под своим исходным именем (правило префиксов
  # на чужие документы не распространяется, см. docs/LOCAL_CONSTITUTION.md).
  cv_files: []           # пути к файлам резюме в documents/
  # Языки: в языковой фильтр попадут те, которых человек НЕ знает
  # (см. config/derivation/languages.yaml).
  languages: []           # языки, которыми владеете
  # Резидентство обычно личное: другой человек с тем же поиском живёт в
  # другом месте. НО если поиск привязан к стране по существу («ищу работу
  # именно в Германии»), страна — определение идентичности, и тогда её пишут
  # литерально вместо `local`:
  #     location:
  #       country: "Germany"
  #       utc_offset: 1
  # См. docs/IDENTITIES.md, «Граница: что личное, что характеристика поиска».
  location: {}           # страна, часовой пояс: из них выводятся гео-правила
  timezone_notes: ""

target_regions:
  # Различайте: "компания находится в X" ≠ "нужно резидентство в X".
  dream:            # высокий потолок оплаты, меньше шансов
    - "<регион>"
  solid_realistic:  # где реально наймут
    - "<регион>"

goal:
  purpose: >
    <зачем этот поиск, одним абзацем>
  hours_per_day_target: [0, 0]
  ai_assisted: true
  # Зарплатные ожидания зависят от обстоятельств человека, а не от типа
  # поиска — поэтому личные. Структуру заготовит `identity.py init-local`.
  # Зарплатные ожидания. Суммы личные — здесь только ФОРМА, которую ждёт
  # скоринг. Заполняется в локальной идентичности.
  #
  # Три диапазона, потому что вакансии называют деньги по-разному, и сравнивать
  # надо с сопоставимой величиной. Достаточно заполнить те, что вам осмысленны;
  # незаполненный диапазон просто не участвует в сравнении.
  #
  #   target_compensation:
  #     monthly_parttime_usd:  [5000, 8000]    # "$5-8k/month"
  #     annual_parttime_usd:   [60000, 96000]  # "$60k-96k/year"
  #     hourly_contractor_usd: [55, 130]       # "$55-130/hour"
  #
  # Единицы — доллары США: вакансии называют суммы в чём угодно, и приводить
  # их к одной валюте проще один раз здесь, чем в каждом сравнении.
  target_compensation: {}

employment_type_priority:
  high: []
  medium: []
  low_but_possible: []
  # Пункты, делающие вакансию невозможной. Если планируется совмещение с
  # другой занятостью — оставьте здесь требования эксклюзивности.
  dealbreaker_signals:
    - "must relocate"
    - "on-site required"

# Стек по ФАКТИЧЕСКОЙ частоте в резюме, а не по ощущениям.
# Влияет на гейт релевантности: без совпадения по core/strong вакансия
# отсеивается целиком.
tech_stack:
  core: []       # было в большинстве последних ролей
  strong: []     # регулярно, но не всегда
  familiar: []   # одна-две роли за карьеру
  # ОСТОРОЖНО с короткими и общими словами: ".NET" ловит "VB.NET",
  # "LESS" ловит "no less than", "EOR" ловит "theoretical".

ideal_company_traits:
  high_priority: []
  low_priority_avoid: []

# Упоминание такой платформы означает, что компания технически готова оформить
# человека вне своей страны. Список общий, менять обычно не нужно.
eor_platforms_signal:
  # Упоминание платформы найма — сильный сигнал, что компания реально готова
  # оформить подрядчика вне своей страны (это +18, самый крупный плюс рубрики).
  #
  # ОСТОРОЖНО С КОРОТКИМИ И ОБЩИМИ ФОРМАМИ. Замер 2026-08-05 на базе из 9527
  # вакансий показал 345 ложных срабатываний:
  #   * "Multiplier" (266) ловился в "productivity multiplier", "Talent
  #     Multiplier", "operating as a multiplier" — обычное английское слово;
  #   * "G-P" (79) ловился внутри немецкого "Mentorin-G-P-rogramm" и подобных.
  # Тот же класс ошибки, что "LESS" внутри "no less than" и "eor" внутри
  # "theoretical". Поэтому названия, совпадающие с обычными словами, пишутся
  # доменом: домен в тексте вакансии однозначен.
  - "Deel"                      # проверено: 17 срабатываний, все настоящие
  - "Remote.com"
  - "Oyster HR"
  - "Papaya Global"
  - "multiplier.com"            # вместо голого "Multiplier"
  - "Globalization Partners"
  - "g-p.com"                   # вместо голого "G-P"
  - "Velocity Global"
  - "Employer of Record"        # общий термин, надёжнее любого бренда
  - "EOR provider"
  - "Remofirst"
  - "Rippling EOR"
  - "Safeguard Global"
