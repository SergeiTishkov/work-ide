# =============================================================================
#  THE IDENTITY PROFILE TEMPLATE
# =============================================================================
#  Copied as <prefix>_profile.yaml and filled in from the questionnaire answers.
#  The human-readable truth about who is searching, and for what.
#
#  Fill it in TOGETHER WITH THE PERSON (docs/ONBOARDING.md), not by guesswork.
# =============================================================================

identity:
  kind: personal   # personal | shared_example | fixture
  # In one phrase: what a high score means in THIS search. The line is printed
  # at the head of every report, so it is written in plain language.
  # Every identity has its own: what is a plus here may be a minus for another
  # search.
  scoring_philosophy: >
    <for example: the higher the score, the more the vacancy looks like calm
    legacy maintenance with little competition — what is wanted.>
  display_name: "<a short name, shown in the tools' banner>"
  abbreviation: "<PREFIX> = <expansion>"
  created_at: "<YYYY-MM-DD>"

contact:
  # Where a site's owner can write if they want to get in touch (an honest
  # User-Agent is an engineering commitment of the project).
  #   "you@mail.com" -> right here (it will reach the shared repository!)
  #   null           -> no contact (doctor will warn)
  #
  user_agent_contact: ""   # your address; filled in in the local identity

# ==== PERSONAL AND SHARED ====
#
# Personal values live in your local identity, outside git; the template holds
# only what describes the SEARCH.
#
#
# The test question for what goes where: "would this change if another person
# used the same search?" Yes -> your own file. No -> write the value here.
#
#
owner:
  name: "<your name>"
  linkedin: "<a link to your LinkedIn>"
  years_experience: 0            # your years of experience; the level is in role below
  role: "<title: senior backend, lead QA…>"   # a property of the SEARCH
  # The CV lives in documents/ under its original name (the prefix rule does
  # not extend to somebody else's documents, see CLAUDE.md §5).
  cv_files: []           # paths to CV files in documents/
  # Languages: the filter gets the ones the person does NOT know
  # (see config/derivation/languages.yaml).
  languages: []           # the languages you speak
  # Residency is usually personal: another person with the same search lives
  # somewhere else. BUT if the search is tied to a country in substance ("I am
  # looking for work in Germany specifically"), the country defines the
  # identity and is written literally:
  #     location:
  #       country: "Germany"
  #       utc_offset: 1
  # See docs/IDENTITIES.md, "The boundary: what is personal, what describes the
  location: {}           # country, time zone: the geography rules derive from them
  timezone_notes: ""

target_regions:
  # Distinguish: "the company is in X" is not "residency in X is required".
  dream:            # a high pay ceiling, lower chances
    - "<region>"
  solid_realistic:  # where you will realistically be hired
    - "<region>"

goal:
  purpose: >
    <what this search is for, in one paragraph>
  hours_per_day_target: [0, 0]
  ai_assisted: true
  # Pay expectations depend on a person's circumstances rather than on the kind
  # of search — hence personal.
  # Pay expectations. The amounts are personal — only the SHAPE the scoring
  # expects is here. Filled in in the local identity.
  #
  # Three ranges, because vacancies quote money in different ways and the
  # comparison has to be against a comparable figure. Fill in the ones that
  # mean something to you; an empty range simply sits out the comparison.
  #
  #   target_compensation:
  #     monthly_parttime_usd:  [5000, 8000]    # "$5-8k/month"
  #     annual_parttime_usd:   [60000, 96000]  # "$60k-96k/year"
  #     hourly_contractor_usd: [55, 130]       # "$55-130/hour"
  #
  # The unit is US dollars: vacancies quote sums in anything at all, and
  # converting once here is simpler than in every comparison.
  target_compensation: {}

employment_type_priority:
  high: []
  medium: []
  low_but_possible: []
  # Things that make a vacancy impossible. If it is to be combined with other
  # work, leave exclusivity requirements here.
  dealbreaker_signals:
    - "must relocate"
    - "on-site required"

# The stack by ACTUAL frequency in the CV, not by impression.
# It drives the relevance gate: without a core or strong match a vacancy is
# rejected outright.
tech_stack:
  core: []       # was in most of your recent roles
  strong: []     # regularly, but not always
  familiar: []   # one or two roles across a career
  # BEWARE short and generic words: ".NET" catches "VB.NET", "LESS" catches
  # "no less than", "EOR" catches "theoretical".

ideal_company_traits:
  high_priority: []
  low_priority_avoid: []

# A mention of such a platform means the company is technically able to engage
# somebody outside its own country. The list is shared; rarely worth changing.
eor_platforms_signal:
  # A mention of an employment platform is a strong signal that a company is
  # genuinely able to engage a contractor abroad (+18, the rubric's largest plus).
  #
  # BEWARE SHORT AND GENERIC FORMS. Measured 2026-08-05 over a base of 9527
  # vacancies: 345 false matches.
  #   * "Multiplier" (266) was caught in "productivity multiplier", "Talent
  #     Multiplier", "operating as a multiplier" — an ordinary English word;
  #   * "G-P" (79) was caught inside German words like "Mentoring-Programm".
  # The same class of mistake as "LESS" inside "no less than" and "eor" inside
  # "theoretical". So names that coincide with ordinary words are written as a
  # domain: a domain in vacancy text is unambiguous.
  - "Deel"                      # verified: 17 matches, all genuine
  - "Remote.com"
  - "Oyster HR"
  - "Papaya Global"
  - "multiplier.com"            # instead of a bare "Multiplier"
  - "Globalization Partners"
  - "g-p.com"                   # instead of a bare "G-P"
  - "Velocity Global"
  - "Employer of Record"        # the generic term, safer than any brand
  - "EOR provider"
  - "Remofirst"
  - "Rippling EOR"
  - "Safeguard Global"

# ==== PREFERENCES: about the person, not about the search ====
preferences:
  # Language of the REPORT. Everything else in this repository is English so
  # that anyone can read it; the report is the one file its owner opens by
  # hand every morning, and it should speak their language.
  #
  # Default is the language the owner talks to the agent in. The agent fills
  # this in during onboarding without asking a separate question — it already
  # knows which language the conversation is happening in.
  #
  # Two-letter code: en, ru, de, … An unknown code falls back to English
  # rather than to a half-translated report.
  language: "en"
