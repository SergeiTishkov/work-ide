# =============================================================================
#  THE IDENTITY SOURCES TEMPLATE
# =============================================================================
#  Copied as <prefix>_sources.yaml.
#
#  ONLY preferences here: what is enabled, and with what parameters. Endpoints,
#  source kind and the remote_only flag live in the shared catalogue
#  config/sources.catalog.yaml and are not overridable by an identity: a stale
#  URL is a bug for everybody at once rather than somebody's setting.
#
#  Each source is described, with its strengths and weaknesses, in
#  docs/BUILDING_BLOCKS.md. Assemble the set deliberately: a source with a low
#  yield for your profile will litter the base with rubbish on every run.
# =============================================================================

schema_version: 1

sources:
  # --- Boards that publish remote vacancies only ---------------------------
  - name: weworkremotely
    enabled: true
    # Usually the best by signal-to-noise; it gives a structured region field.

  - name: remoteok
    enabled: true

  - name: remotive
    enabled: true

  - name: jobicy
    enabled: true

  - name: himalayas
    enabled: true

  # --- Vacancies straight from employers -----------------------------------
  - name: ats
    enabled: true
    # The company list is in <prefix>_ats_targets.yaml. That list determines
    # this source's yield; on its own it gives plenty, but of the wrong kind.

  # --- Niche ---------------------------------------------------------------
  - name: hn_whoishiring
    enabled: true
    params:
      # With no explicit list, the first 5 of tech_stack.core are used. Set it
      # explicitly if words outside the stack matter (e.g. "legacy").
      # Each word is one HTTP request.
      keywords: []
      hits_per_keyword: 50

  - name: arbeitnow
    enabled: false
    # DISABLED by default: by measurement this is predominantly a
    # German-language market. Enable it if you read German, or accept a low yield.

  - name: manual
    enabled: true
    # The manual channel: the agent's finds from sites that cannot be read
    # programmatically (Indeed and the like). Often the best turns up here.
