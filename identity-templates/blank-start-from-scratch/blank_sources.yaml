# =============================================================================
#  ШАБЛОН ИСТОЧНИКОВ ИДЕНТИЧНОСТИ
# =============================================================================
#  Копируется как <префикс>_sources.yaml.
#
#  Здесь ТОЛЬКО предпочтения: что включено и с какими параметрами. Эндпоинты,
#  тип источника и признак remote_only — в общем каталоге
#  config/sources.catalog.yaml и идентичностью не переопределяются: устаревший
#  URL это баг для всех сразу, а не чья-то настройка.
#
#  Описание каждого источника с его сильными и слабыми сторонами —
#  docs/BUILDING_BLOCKS.md. Собирайте набор осознанно: источник с низким
#  выходом для вашего профиля будет каждый прогон засорять базу мусором.
# =============================================================================

schema_version: 1

sources:
  # --- Площадки, публикующие только удалённые вакансии ---------------------
  - name: weworkremotely
    enabled: true
    # Обычно лучший по соотношению сигнал/шум; даёт структурное поле region.

  - name: remoteok
    enabled: true

  - name: remotive
    enabled: true

  - name: jobicy
    enabled: true

  - name: himalayas
    enabled: true

  # --- Вакансии напрямую от работодателей ----------------------------------
  - name: ats
    enabled: true
    # Список компаний — в <префикс>_ats_targets.yaml. Именно он определяет
    # выход этого источника; сам по себе источник даёт много, но нерелевантного.

  # --- Нишевые -------------------------------------------------------------
  - name: hn_whoishiring
    enabled: true
    params:
      # Без явного списка берутся первые 5 из tech_stack.core. Задавайте явно,
      # если важны слова, которых нет в стеке (например "legacy").
      # Каждое слово = один HTTP-запрос.
      keywords: []
      hits_per_keyword: 50

  - name: arbeitnow
    enabled: false
    # По умолчанию ВЫКЛЮЧЕН: по замерам это преимущественно немецкоязычный
    # рынок. Включайте, если читаете по-немецки либо готовы к низкому выходу.

  - name: manual
    enabled: true
    # Ручной канал: находки агента с площадок, которые нельзя читать
    # программно (LinkedIn, Indeed). Часто именно здесь попадается лучшее.
