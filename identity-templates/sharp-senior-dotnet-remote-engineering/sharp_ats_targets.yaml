# Company careers pages, through their ATS (hiring systems).
#
# Read by tools/fetch_ats.py. These are first-hand vacancies, straight from the
# employer: no third party's application funnel (unlike WWR), no paid
# subscriptions, no intermediary. Every endpoint is an official public JSON API
# of these ATS, the ones the vacancy widgets on the companies' own sites run
# off: an ordinary GET, no authorisation and no anti-bot protection.
#
# provider: greenhouse | lever | ashby | recruitee
# token:    the company's board identifier in that ATS. Usually visible right
#           in the careers page URL, for example:
#             boards.greenhouse.io/<token>
#             jobs.lever.co/<token>
#             jobs.ashbyhq.com/<token>
#             <token>.recruitee.com
#
# HOW TO EXTEND IT (the main lever on the quality of the shortlist):
# add companies here that really do hire for .NET/C# remotely and engage
# people abroad. Take candidates from data/knowledge/companies.json, or find
# them by web search. A token can be checked with one command:
#
#   curl https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#
# The starting list below is of verified working boards (measured 2026-07-31).
# It is deliberately small and made up of technology companies that certainly
# hire remotely; it needs building out to suit the person — with employers
# and staffing vendors that sign contracts with engineers abroad.

targets:
  - company: "Stripe"
    provider: greenhouse
    token: stripe
    enabled: true

  - company: "Cloudflare"
    provider: greenhouse
    token: cloudflare
    enabled: true

  - company: "GitLab"
    provider: greenhouse
    token: gitlab
    enabled: true
    notes: "An all-remote company, hiring worldwide."

  - company: "Airtable"
    provider: greenhouse
    token: airtable
    enabled: true

  - company: "Notion"
    provider: ashby
    token: notion
    enabled: true

  - company: "Ramp"
    provider: ashby
    token: ramp
    enabled: true

  - company: "Linear"
    provider: ashby
    token: linear
    enabled: true

  - company: "Tether"
    provider: recruitee
    token: tether
    enabled: true
    notes: "Found through WWR: the description led to tether.recruitee.com."

  # --- Forward deployed engineering (2026-10-22, task 0077) ---------------
  # Companies that hire forward deployed engineers, deployment strategists
  # and applied AI engineers: the owner's FDE research of 2026-10-22. Each
  # board was checked that day; the numbers are its postings and the titles
  # among them that read as forward deployed, applied AI or deployment
  # roles. Most such roles are on-site or tied to one country, and the
  # location rules refuse those; titles go to the screening model as
  # stretch roles (criteria `stretch_roles`). Left out: Mistral (its Lever
