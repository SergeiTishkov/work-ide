# The template's questionnaire: WHY the settings are what they are.
#
# The answers here are at the level of the KIND of search — the same for
# everybody who chose this template. Answers about a particular person (where
# they live, what they want to earn, which languages they speak, which
# countries they have experience with) do not reach the template: their place
# is in the local identity, and that is where the agent writes them during
# onboarding.
#
# The full list of questions and the order to ask them: docs/QUESTIONNAIRE.md.

schema_version: 1
identity_prefix: sharp
kind: template

answers:

  - question: "What exactly are you looking for?"
    answer: >
      Remote senior .NET/C# engineering. First, the employer can hire me
      remotely from my country and I fit the role; then pay. Technology
      decides only between otherwise equal vacancies (2026-10-05).

  - question: "Does legacy or new technology matter?"
    answer: >
      No. Legacy work can be hard and new work can be relaxed; neither is a
      plus or a minus. A top-paying role on new technology is welcome.

  - question: "Which roles are cut entirely, and why?"
    answer: >
      Management, sales, pre-sales, DevRel, analytics, QA, mobile development,
      infrastructure/DevOps and AI-training crowdwork. Every one was added
      singly, after a real finding in the shortlist: an applied developer's
      chance at such a vacancy is zero, and a points penalty does not express
      a zero chance.

  - question: "How is reachability judged when nobody writes about it?"
    answer: >
      From the employer's own words about hiring abroad (contractors from any
      country, an EOR, the person's own company), from the board's location
      field, and from what rules it out: a US or Canadian payroll benefit,
      "must live in", "<place> only".

  # --- QUESTIONS WHOSE ANSWERS ARE PERSONAL --------------------------------
  # The template lists them but does not answer: the answer depends on the
  # person and lives in their local identity.

  - question: "Where do you live, and what is your residency?"
    answer: null
    note: >
      The geography rules are DERIVED from residency: the same phrase "US only"
      is a plus for a US resident and a disqualification for everybody else.
      The derivation table is config/derivation/regions.yaml.

  - question: "Which languages do you know?"
    answer: null
    note: "The language filter is derived from this: which vacancies to reject."

  - question: "What money are you expecting?"
    answer: null

  - question: "Are there countries where hiring is especially likely for you?"
    answer: null
    note: >
      Usually because of existing experience with companies there, or contacts.
      It goes into the local identity's acceptable_region_signal.

  - question: "Are there place names that are ambiguous for you personally?"
    answer: null
    note: >
      For residents of the country of that name, "Georgia": in vacancies it
      almost always means the US state. Starting points for the frequent traps
      config/derivation/ambiguous_places.yaml.
