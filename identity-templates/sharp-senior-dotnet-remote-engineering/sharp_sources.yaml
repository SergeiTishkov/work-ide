# Sources for the SHARP identity.
#
# ONLY preferences here: which sources are enabled, and with what parameters.
# Endpoints, source kind, the remote_only flag and the documentation for each
# source live in the shared catalogue config/sources.catalog.yaml.
#
# A catalogue of the available blocks, with each one's strengths and
# docs/BUILDING_BLOCKS.md.

schema_version: 1

sources:
  # --- Primary: remote-only boards, English-language -----------------------
  - name: weworkremotely
    enabled: true
    # The best source by signal-to-noise: ~242 vacancies per run, a structured
    # region field, in English.

  - name: remoteok
    enabled: true

  - name: remotive
    enabled: true

  - name: jobicy
    enabled: true

  - name: himalayas
    enabled: true

  # --- Vacancies straight from employers -----------------------------------
  - name: ats
    enabled: true
    # The company list is in sharp_ats_targets.yaml. That is the main lever on
    # quality: the source itself works well, but its yield is determined
    # entirely by which companies are on the list.

  # --- Niche ---------------------------------------------------------------
  - name: hn_whoishiring
    enabled: true
    params:
      # Set explicitly rather than taken from tech_stack.core: "SQL Server" is
      # not a language, but it is half of the work this stack does.
      # "forward deployed" and "LLM": the applied AI roles (2026-10-20, see
      # linkedin below). "applied AI" and "deployed engineer" (2026-10-22,
      # task 0077): 9 and 12 threads the first two did not find; "deployment
      # strategist" found none and is not here.
      keywords: [".NET", "C#", "ASP.NET", "SQL Server", "forward deployed", "LLM",
                 "applied AI", "deployed engineer"]
      hits_per_keyword: 50

  - name: arbeitnow
    enabled: true
    # Deliberately left enabled despite the low yield: measured 2026-07-30 it
    # gave 68% of the base at about 6% useful (a German-language market, cut by
    # the language filter). It occasionally brings English-language remote
    # vacancies from European companies. If it starts getting in the way, set
    # enabled: false; no code needs touching.

  - name: linkedin
    enabled: true
    params:
      # Each word is multiplied by each country from the market tiers, so the
      # list is deliberately short: 6 words x 28 countries is 168 queries
      # before any is split. Start from the core of the stack.
      # The basis is the stack: it finds what the person can actually do.
      # "contract C# developer" because a contract is what an employer abroad
      # can most easily sign; "senior .NET engineer" and ".NET architect"
      # because they are where the pay is (2026-10-05, replacing two queries
      # for part-time work). LinkedIn's f_JT=P/C filter will not do for a
      # contract search — verified, the guest endpoint ignores it.
      #
      # 2026-10-20, the owner: "remote outranks the technology" — applied AI
      # and forward deployed roles are wanted when the CV can be stretched to
      # them (criteria `stretch_roles`, the screening model's cv_fit).
      # Titles in the base that day (55 268 since August, every board): "AI
      # engineer" in 1 035, "forward deployed" in 363, "forward engineer" in
      # 2 (one is the Cloud9 role the owner applied to). LinkedIn matches the
      # words, not the phrase, so "forward engineer" may also bring "forward
      # deployed" ones; the per-query statistics
      # (data/identities/<p>/runs/linkedin_queries_*.json) show which earns
      # its 28 pairs.
      #
      # 2026-10-22 (task 0077): the other names of the forward deployed role
      # from the owner's FDE research. "AI engineer" may already bring some
      # of them, but it reaches the 100-card ceiling, and a narrower query
      # reads deeper. Three words are 84 more pairs; the per-query statistics
      # after a run say which to keep. "Solutions engineer" is not here: the
      # criteria refuse it as a pre-sales title.
      #
      # 2026-10-28 (task 0050): "deployment strategist" out. In five runs with
      # `found_by` (tools/linkedin_yield.py) its two forms served 17 166
      # vacancies, none of them shortlisted, and took 84 queries a run.
      # 2026-10-28 (task 0077), the owner: "applied AI engineer" and "AI
      # deployment engineer" out too. Their shortlisted vacancies (2 and 3)
      # were all found by other searches as well; 56 queries a run.
      keywords: [".NET developer", "C# developer", "ASP.NET",
                 "senior .NET engineer", "contract C# developer",
                 ".NET architect", "forward deployed engineer",
                 "forward engineer", "AI engineer"]
      # Every page of every (word x country) pair, postings of the last week
      # (measured 2026-10-03: ten cards a page and at most 100 per query to an
      # anonymous request; a query that reaches that ceiling is split by the
      # fetcher into "remote ..." and regional queries). A full walk takes an
      # hour or more, and it reports its progress in the run log.
      posted_within_days: 7
      # Descriptions are read after scoring (tools/enrich_descriptions.py),
      # only for vacancies whose verdict depends on the text. Reading here
      # took the first N cards by title, before anything was known about them.
      enrich_limit: 0
    # Locations are not set: they come from profile.target_markets (the market
    # tiers). That way the country list lives in one place and does not drift.
    # skip_locations: [<country>, ...] leaves countries of the tiers out of
    # the LinkedIn walk only; they stay markets for the scoring (task 0050).

  - name: devitjobs
    enabled: true
    params:
      # uk closed 2026-10-04: devitjobs.uk redirects to a JobCopilot signup.
      boards: [us]

  - name: jobs_ch
    enabled: true
    params:
      queries: ["software engineer", "backend developer", ".NET", "C#"]
      pages: 5

  - name: mycareersfuture
    # Off since 2026-10-04: applying needs a Singpass login, which is for
    # Singapore residents. Its vacancies are rejected through closed_sources
    # in sharp_criteria.yaml.
    enabled: false
    params:
      queries: ["software engineer", "backend developer", ".NET developer"]

  - name: landing_jobs
    enabled: true

  - name: dataart
    # DataArt's own vacancies, by the countries each hires from (task 0043).
    # Off here: the country is the person's residency. An identity turns it
    # on in its own sources file with params: {countries: ["<country>"]}.
    enabled: false

  - name: arcdev
    # Arc's own remote requests (2026-10-21). Off here: country_code is the
    # person's residency. An identity turns it on in its own sources file
    # with params: {country_code: "<ISO code>"}.
    enabled: false

  - name: workatastartup
    # Y Combinator startups' remote postings, by keyword (2026-10-21). Off
    # here: which single-country postings stay depends on the residency. An
    # identity turns it on with params: {countries: ["<ISO code>"]}.
    enabled: false

  - name: justjoinit
    # justjoin.it's remote B2B .NET offers (2026-10-22, task 0047). Off
    # here: a Polish board, and 35 of the 118 offers of 2026-10-22 list
    # Polish. An identity turns it on; the module's filters are the default.
    enabled: false

  - name: freelancermap
    # freelancermap.de's fully remote contract projects (2026-10-22, task
    # 0047). Off here: 14 of 22 read on 2026-10-22 were written in German.
    # An identity turns it on; the module's queries are the default.
    enabled: false

  - name: djinni
    # djinni.co's remote .NET postings (2026-10-22, task 0047). Off here:
    # which country lists stay depends on the residency. An identity turns
    # it on with params: {country: "<ISO alpha-3>"}.
    enabled: false

  - name: workingnomads
    enabled: true

  - name: rss_boards
    enabled: true

  - name: 4dayweek
    enabled: true
    params:
      categories: [engineering]
      pages: 6

  - name: manual
    enabled: true
    # The manual channel: the agent's finds from Indeed and careers pages,
    # entered through tools/ingest_manual.py. It matters especially for this
    # identity: the public boards cover the combination "worldwide remote + a
    # high rate" poorly.

  # --- The UK, added 2026-09-08 ---------------------------------------------
  #
  # Three of these four are CONTRACT boards. That is the point: a contract with
  # a day rate and an outside-IR35 determination is work somebody invoicing
  # from another country can actually take, where a payrolled UK job is not.

  - name: contractoruk
    enabled: true
    params:
      # The board matches loosely — ".net" also returns "Biodiversity Net Gain
      # Officer" — so the queries are broad and our own gates do the filtering.
      # "c#" is absent because it returns zero results there, however encoded.
      queries: [".net", ".net developer", "sql server", "software developer"]
      max_pages: 3

  - name: reed
    enabled: true
    params:
      keywords: ["net-developer", "c-net-developer", "software-developer",
                 "sql-server-developer"]
      max_pages: 3

  - name: jobserve
    enabled: true
    params:
      queries: [".net developer", "c# developer", "asp.net", "sql server developer"]

  - name: outside_ir35
    enabled: true
    params:
      # The whole board is fifty contracts, so one unfiltered request takes it.
      queries: [""]
