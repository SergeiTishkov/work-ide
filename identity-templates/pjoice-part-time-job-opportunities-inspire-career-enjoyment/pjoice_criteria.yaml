# The vacancy scoring rubric for PJOICE. Read by tools/score.py.
# The final score is 0..100, plus a separate list of dealbreaker flags and
# needs_manual_review. Every component is explained in score_breakdown.
#
# The philosophy: side work beside a main job. Built from the KISEL template
# and turned round on almost every axis KISEL scores:
#
#   * money is THE priority — graded by the hourly rate, not merely "a salary is
#     stated" (compensation_signal.hourly_equivalent_tiers);
#   * part-time, freelance or fractional hours are REQUIRED — a full-time role
#     cannot be done beside a full-time job (engagement_fit);
#   * dull work is neutral, not a plus (legacy_enterprise_signal weighs 0);
#   * interesting work — crypto, AI, distributed systems — is a small plus
#     (extra_signals.interesting_work), and crypto is no longer a dealbreaker;
#   * but only work THIS CV will be considered for: research, machine learning,
#     data engineering and smart contracts are cut however interesting they are
#     (role_complexity_signal, repurposed — see there).
#
# What is unchanged from KISEL: geography, stack, language and profession
# gates. They follow from the CV and the residency, which are the same person's.

# HOW A COMPONENT'S WEIGHT WORKS
#
# There is no `weights` block (the KISEL template explains why). A component's
# real weight is its cap or its range:
#
#   compensation_signal          -8..+34   the hourly rate, graded
#   stack_fit.cap                     25   the fit to the CV
#   company_reputation_signal        ~24   reviews
#   extra_signals.interesting_work    +8   crypto, AI, distributed systems
#   extra_signals.fits_beside_a_job -12..+6 async and flexible against on-call
#   extra_signals.ai_training_gig     -6   paid, but not a product team
#   remote_location_fit.worldwide      6
#   contractor_friendliness.cap        5
#   legacy_enterprise_signal           0   dull work is neutral here
#   low_intensity_signal               0   replaced by fits_beside_a_job

remote_location_fit:
  # Can a contractor sitting where this person sits actually take the work?
  # See _residency_eligibility in tools/score.py — a separate axis from the
  # score, because a vacancy that pays well and cannot be taken is worth less
  # than one that pays adequately and can.
  #
  # These phrases decide the strongest verdict, CONFIRMED: the employer naming
  # this person's country as somewhere they hire. The country name on its own
  # is not enough and for this identity it is actively misleading — "Georgia"
  # is a US state as well as a country, and "Atlanta, Georgia" is not an offer
  # to hire in Tbilisi. So the name has to appear NEAR one of these.
  residency_eligibility:
    context_window_chars: 120
    hiring_context_phrases:
      - "we hire"
      - "we can hire"
      - "hiring in"
      - "we employ"
      - "accepted countries"
      - "eligible countries"
      - "supported countries"
      - "countries we hire"
      - "where we hire"
      - "contractors in"
      - "contractors located in"
      - "contractors based in"
      - "candidates in"
      - "candidates located in"
      - "candidates based in"
      - "open to candidates"
      - "residents of"
      - "based anywhere in"
      - "team members in"
      - "employees in"
      - "payroll in"
      - "entities in"

  # The board's own structured location field — see
  # _check_location_field_arrangement in tools/score.py for the measurement.
  # Short and functional, so a word here is never about technology.
  location_field_arrangement:
    not_remote:
      - "hybrid"
      - "on-site"
      - "onsite"
      - "on site"
      - "in-office"
      - "in office"
    # …unless the same field also offers remote. Three real values in the base
    # do: "Hybrid or Remote", "Dallas, TX (Remote US or Hybrid)",
    # "Distributed; Hybrid".
    unless_also:
      - "remote"
      - "distributed"
      - "anywhere"

  # What to do with a vacancy nobody ever called remote — not the employer,
  # not the board. Until 2026-08-11 this was a flat rejection, which was right
  # while a source's remote flag could be trusted. It cannot: LinkedIn's guest
  # search ignores its own f_WT filter entirely (the same job comes back under
  # "on-site", "remote" and "hybrid" alike), so silence became the normal case
  # rather than the suspicious one — 109 vacancies with a full description that
  # simply never mentions the arrangement.
  #
  # A rejection on silence is a refusal by guesswork, which CLAUDE.md §5
  # forbids. So: its own class, its own section of the report, the score left
  # untouched, and the person decides. What the employer DOES say — "hybrid",
  # "on-site" — still disqualifies through hard_dealbreakers above.
  #
  # manual_check — own class and section (the owner's choice, 2026-08-11)
  # reject       — the behaviour before that date
  # accept       — for an identity that does not mind commuting
  unconfirmed_remote_policy: manual_check

  worldwide_remote:
    points: 6
    # The main signal for a contractor from a third country: the company is
    # willing to hire from anywhere. Measured 2026-08-05: the old list caught
    # only 75 vacancies of 9527 — not because there are few, but because there
    # are many ways to say it and the list held ten.
    #
    # Every phrase is at least two words: short forms like "global" produce
    # false matches on "global leader", "global team" and other marketing.
    keywords:
      - "remote worldwide"
      - "worldwide remote"
      - "remote - anywhere"
      - "remote anywhere"
      - "work from anywhere"
      - "hire anywhere"
      - "globally remote"
      - "international remote"
      - "remote (global)"
      - "anywhere in the world"
      - "anywhere in the globe"
      - "from any country"
      - "in any country"
      - "any location in the world"
      - "no location requirement"
      - "no geographic restriction"
      - "no geographical restriction"
      - "location independent"
      - "location agnostic"
      - "we hire globally"
      - "hiring globally"
      - "hire from anywhere"
      - "work from any location"
      - "fully distributed team"
      - "globally distributed team"
      - "distributed worldwide"
      - "team across the globe"
      - "any time zone"
      - "any timezone"
      - "timezone agnostic"
      - "regardless of location"
      - "wherever you are"
      - "wherever you live"
      - "live anywhere"
      - "100% remote worldwide"
      # REMOVED 2026-08-12: "remote-first company", "remote first company".
      # They describe how a company organises itself, not who it can engage.
      # A remote-first company can hire in one country only, and this list is
      # supposed to mean "geography is not in the way" — it decides both the
      # score and the eligibility verdict (score._residency_eligibility).
      # Measured before removing: 16 vacancies in the base rested on the weak
      # phrases alone, every one of them Canonical and already rejected.
  eor_or_contractor_international:
    points: 8
    keywords: []  # filled from profile.yaml eor_platforms_signal plus contractor/1099/freelance
  acceptable_region_signal:
    # Regions THIS PARTICULAR person considers especially likely — usually
    # because of existing experience with companies there, or of contacts.
    # That is personal knowledge, so the template sets no list: it is filled
    # in the local identity.
    #
    # IMPORTANT, and the project has been burned on it: what goes here is "the
    # company IS IN region X", not "residency in X is required". Wordings like
    # "EU Remote" mean a residency requirement and belong in
    # restrictive_region_signal below, not here.
    #
    # The main mechanism for target markets is not this list but target_markets
    # in the profile, on top of config/derivation/market_tiers.yaml.
    # 0 POINTS. The owner, 2026-08-05: "the target region — who cares, what
    # does a region give me?" The component is kept so as not to break the
    # structure, and so that an identity for which geography DOES matter (a
    # search specifically in Germany, say) can use it.
    points: 0
    keywords: []
  restrictive_region_signal:
    # A HARD requirement of residency or presence in a particular region that
    # does not match the person's own residency is TOTAL REJECTION rather than
    # merely "lower priority" (confirmed by the owner explicitly twice,
    # 2026-07-30: first over "remote LATAM", then over "(EU Remote)" in a real
    # vacancy found — both physically unreachable from a third country). The
    # list is knowingly not exhaustive (there are endlessly many regions) —
    # needs_manual_review and the agent reading the text itself remain the last
    # line of defence for whatever the list did not catch. If a worldwide or
    # EOR signal is present AT THE SAME TIME, it is not counted as a
    # dealbreaker (the company is probably more flexible than the wording of
    # requisition).
    keywords:
      - "remote (us)"
      - "remote - us"
      - "us remote only"
      - "us only"
      - "must be located in the united states"
      - "must reside in the us"
      - "must be based in the us"
      - "remote latam"
      - "latam only"
      - "latin america only"
      - "based in latin america"
      - "candidates based in latin america"
      - "remote based in latin america"
      - "must be based in latin america"
      - "based in the united states"
      - "candidates based in the us"
      - "based in europe"
      - "candidates based in europe"
      - "remote apac"
      - "apac only"
      - "asia pacific only"
      - "remote (uk)"
      - "uk only"
      - "must be based in the uk"
      - "must be located in the uk"
      - "canada only"
      - "must be based in canada"
      - "must reside in canada"
      - "india only"
      - "must be based in india"
      - "philippines only"
      - "eastern europe only"
      - "western europe only"
      - "nordics only"
      - "dach only"
      - "benelux only"
      - "australia and new zealand only"
      - "anz only"
      - "mexico only"
      - "must be based in mexico"
      - "eu remote"
      - "remote (eu)"
      - "remote europe"
      - "eu only"
      - "europe only"
      - "must be based in the eu"
      - "must be based in israel"
      - "israel only"
      - "must be based in uae"
      - "uae only"
    # Wordings that are NOT overridden by a marketing "worldwide".
    #
    # A real finding, 2026-08-05 (manual checklist): an Azumo vacancy arrived
    # from WeWorkRemotely with region "Anywhere in the World", while the text
    # "The position is fully remote based in Latin America. We will only be
    # considering candidates based in Latin America". The old logic lifted the
    # restriction if the word worldwide appeared anywhere in the text — and the
    # board's sweeping label overrode the employer's own words.
    #
    # The same principle as with the Headquarters heading: when an employer
    # states a requirement outright, the board's label does not matter.
    absolute_residency_phrases:
      - "only be considering candidates based in"
      - "only considering candidates based in"
      - "only accept candidates based in"
      - "candidates must be based in"
      - "must be based in"
      - "must reside in"
      - "must be a resident of"
      - "you must live in"
      - "applicants must be based in"
      - "we can only hire in"
      - "we can only employ"
      # "eligible to work in", "authorized to work in", "residency in" moved
      # to work_authorization on 2026-10-01: read in their sentence, with its
      # negations ("nor will we require ... residency in the U.S.").

    # Written as a pattern because a region tie has too many spellings to
    # list. Measured 2026-08-12: the keywords held "remote latam" and missed
    # "100% remote in LATAM" — one preposition away — which was leading the
    # worldwide shortlist at 76. 57 postings in the base use the "in" form.
    #
    # These sit with the KEYWORDS rather than in hard_dealbreakers on
    # purpose: a few lines further down in score.py an explicit worldwide or
    # contractor signal still outranks them, so a posting that says
    # "worldwide, and we already have people in LATAM" survives.
    patterns:
      - name: "tied to one region"
        pattern: "\\b(remote|work|working|hiring|hire|based|candidates?|employees?|contractors?)\\s+(with)?in\\s+(the\\s+)?(latam|latin america|emea|apac|asia[- ]pacific|north america|south america|middle east)\\b"
      - name: "residency in one region required"
        pattern: "(must|need to|required to)\\s+(be\\s+)?(located|based|residing|living)\\s+in\\s+(the\\s+)?(latam|latin america|emea|apac|asia[- ]pacific|north america|south america|middle east|european union)\\b"
  net_exporter_penalty:
    # The one place where geography affects the score.
    #
    # The owner, 2026-08-05: "there is such a thing as a NON-target region —
    # India, Pakistan, the Philippines, minus for them. Even in India you could
    # find something, it is just that most there will not be my style."
    #
    # Hence a penalty rather than rejection: a vacancy from there has to be
    # better on the merits to rise. The country list is shared, from the
    # exporter_avoid and excluded_practical tiers of market_tiers.yaml: the
    # direction the work flows describes the market, not a person.
    points: -12
  # Who the employer can engage at all: passport, permit, clearance, payroll.
  # Read by score._check_work_authorization, ONE SENTENCE AT A TIME.
  #
  # Rewritten 2026-10-01 from a full read of every vacancy in this identity's
  # base that mentions citizenship, a green card, work authorization, a
  # clearance, sponsorship or W-2 (11714 vacancies with a description). The old
  # rules were phrases matched anywhere in the text, and they failed both ways:
  #
  #   missed   "We require U.S. citizenship" (hot_lead, 56), "USC OR GC ONLY",
  #            "Visa: H1B, GC, USC", "Singapore Citizen (mandatory)", "legally
  #            entitled to work in Canada", "$100-$120 per hour on W-2"
  #            (worth_a_look) — W-2 had no rule at all
  #   refused  "nor will [we] require ... lawful permanent residency in the
  #            U.S." (nine vacancies, one at 69, on "residency in");
  #            "security clearance is preferred"; "some positions require the
  #            ability to obtain a security clearance"; "we do not provide visa
  #            assistance" from a company working with developers in 75+
  #            countries — a remote contractor never needs a visa
  #
  # The history of the patterns these replace (measured 2026-08-11 and
  # 2026-08-12) is in the CHANGELOG: TCS "must be a U.S. Citizen" at 69,
  # Thermo Fisher "Must have authorization to work in the UK" at 64, Motorola
  # "Legal authorization to work in the U.S. indefinitely is required".
  #
  # A rule refuses when its `pattern` is found in a sentence that nothing
  # below cancels. Patterns are regexes over lowercased text; see
  # score._check_work_authorization for the optional keys.
  work_authorization:
    # Cancels any rule in the sentence it is found in.
    unless_in_sentence:
      # A negation of the requirement: "nor will we require", "clearance is
      # not required", "does not require".
      - '\b(nor|never)\b|\b(not|n[’'']t|no longer) (be )?(require[sd]?|needed|necessary|mandatory)\b(?!.{0,40}\b(sponsor|visa))|\b(do|does|did|will|would)(n[’'']t| not) (require|need)\b(?!.{0,40}\b(sponsor|visa))|\bno (citizenship|clearance|security clearance|sponsorship|work permit|visa) (is )?(required|needed|necessary)\b'
      # A company-wide caveat rather than this role: "some positions require",
      # "many of our roles may require".
      - '\b(some|certain|many|most|several) (of (our|the) )?(positions|roles|jobs|projects)\b|\bmay (require|be required|need)\b|\bif (required|applicable|needed)\b|\bwhere (required|applicable)\b'
      # The person's own country, whichever it is: "eligible to work in the
      # country where you live".
      - '\b(your|their) (country|home country|location|region)\b|\bcountry (of|where|in which) (your|you)\b|\bcountry of residence\b|\bwhere you (live|reside|are based|are located)\b|\bin which you (live|reside)\b|\bany country\b|\bwherever you\b'
      # Help with a visa is an offer, not a demand — unless the same sentence
      # refuses it ("we cannot support visa sponsorship").
      - '\bwe (can|will|do|are able to|are happy to|may|offer to) (sponsor|support|help|assist)\b'
      # ... but "no visa sponsorship available" is a refusal: measured, it
      # cancelled three real ones (SumUp, a Columbus fintech, a UK robotics firm).
      - '^(?!.*\bno (visa |work permit |employment )?sponsorship\b)(?!.*\bnot\b).*\b(sponsorship|visa support|visa assistance|immigration support) (is )?(available|provided|offered)\b'
      - '^(?!.*\b(not|no|cannot|unable)\b)(?!.*n[’'']t\b).*\b(assist|help|support)\w*\W.{0,70}\b(visa|green card|h-?1b|immigration|work permit)'
      - '^(?!.*\b(not|no|cannot|unable)\b)(?!.*n[’'']t\b).*\b(visa|green card|h-?1b|immigration|work permit)\b.{0,30}\b(filing|assistance|support)\b'
      # Products for citizens, and documents that show who you are.
      - '\bcitizen[- ](facing|centric|services?|experience|engagement|data|portal|app)\b|\b(for|to|serve|serving|of) (the )?citizens\b|\bcitizens (and|&) (businesses|residents|visitors|governments?)\b|\bidentification\b|\bcopy of\b'

    # Evidence the employer engages people abroad. Lifts the rules marked
    # `lifted_by_international`, and makes residency eligibility "likely" —
    # where the bare words "contractor", "freelance" and "1099" used to, and
    # meant a London IR35 contract or a Denver staffing role 36 times out of 36
    # in selection #5. A named employer-of-record platform counts as well.
    international_hiring_patterns:
      - '\b(work|working|partner|collaborate)s? with (developers|engineers|people|talent|contractors|specialists|experts|freelancers) (from|in|across) (over )?\d+\+? countries\b'
      - '\b(hire|hiring|recruit\w*|open to|accept\w*|engag\w*) .{0,30}\b(worldwide|globally|from anywhere|from any country|internationally|across the globe|around the world|in any country)\b'
      - '\b(international|global|worldwide|overseas|offshore) (contractors?|freelancers?)\b'
      - '\b(contractors?|freelancers?) (from|in|across|around) (any|all|many|other|different|over \d+|\d+\+?) (countries|country)\b'

    # Guards that qualify ONE TERM rather than the sentence (unless_near on
    # a rule): an equal-opportunity list before "citizenship", a preference
    # right after the term. Found by the before/after measurement: "must be an
    # Australian citizen ... an active NV1 clearance is preferred" — the
    # preference belongs to the clearance, and the citizenship still stands;
    # "US citizens/GC holders encouraged to apply we do not offer
    # sponsorship" — the encouragement belongs to the citizens, and the
    # refusal still stands.
    term_guards: &term_guards
      # An equal-opportunity list: "without regard to race, ... citizenship".
      - pattern: '\b(without regard|regardless of|irrespective of|discriminat\w*|protected (status|class|characteristics?|veterans?)|equal (employment )?opportunit\w*)\b'
        before: 250
      - pattern: '\be-?verify\b|citizenship and immigration services'
        before: 150
        after: 60
      # A preference is not a requirement: "Singapore Citizens and PRs
      # preferred", "public trust or security clearance is preferred".
      - &preference
        pattern: '\b(preferred|priorit\w*|is a plus|are a plus|a big plus|an advantage|advantageous|desirable|nice to have|would be a bonus|is a bonus|encouraged to apply)\b'
        before: 60
        after: 45
    preference_guard: &preference_guard
      - *preference

    rules:
      # "Must be a U.S. citizen", "We require U.S. citizenship", "Singapore
      # Citizen (mandatory)", "open to candidates who are Singapore Citizens",
      # "You are a US citizen or hold a valid Green Card", and a requirements
      # bullet that says only "U.S. citizenship".
      - name: "citizenship required"
        unless_near: *term_guards
        trigger: 'citizen|\bnationals\b|\bnationality\b'
        pattern: '\b(must|shall|need to|needs to|required to|have to|has to) (be|hold|have|possess|obtain)\b.{0,40}\b(citizens?|citizenship|nationals|nationality)\b|\b(citizens?|citizenship|nationals|nationality)\b.{0,25}\b(required|mandatory|is a must|needed|essential|only)\b|\b(require[sd]?|requirement|need)\b.{0,35}\bcitizenship\b|\b(open|available|limited|restricted|offered) (only )?to\b.{0,40}\bcitizens\b|\b(candidates?|applicants?|you)( that| who| which)? (has|have|hold|holds|are|is|must be)\b.{0,30}\bcitizen(s|ship)?\b|^(u\.s\.|us|usa|united states|american|uk|british|eu|european|canadian|australian|singapore|singaporean|new zealand|swiss|norwegian|israeli|irish|german|french|dutch|indian|japanese|emirati|saudi|qatari|danish|swedish|finnish|polish|austrian|belgian) (citizen|citizenship|citizens)( only| required)?$'
      # "U.S. citizen or permanent resident", "USC OR GC ONLY", "GC holders only".
      - name: "green card or permanent residency required"
        unless_near: *term_guards
        trigger: 'green[- ]card|permanent resident|\bgc\b'
        pattern: '\b(must|required|require[sd]?|requirement|need|needs|only|mandatory)\b.{0,45}\b(green[- ]card|permanent resident\w*)\b|\b(green[- ]card|permanent resident\w*)( holders?| status)?\b.{0,25}\b(only|required|mandatory)\b|\b(usc|citizens?)\b.{0,20}\bgc\b|\bgc\b.{0,20}\b(usc|citizens?)\b|\b(usc|gc)( holders?| candidates?)? only\b'
      # "Visa: H1B, GC, USC", "Work Authorization: GC, USC, H1B", lists of US
      # visa categories (H-1B, H4-EAD, L2-EAD...).
      - name: "US work status listed"
        unless_near: *term_guards
        trigger: '\b(usc|gc|h-?1b|ead|opt)\b'
        pattern: '\b(visa|visa status|work authori[sz]ation|work status|authori[sz]ation|eligibility|status)\s*:\s*.{0,80}\b(usc|gc|green[- ]card|u\.?s\.? citizens?|h-?1b|ead)\b|\b(h-?1b|opt-ead|gc-ead|h4-ead|l2-ead)\s*(,|/|or|and|&)\s*(h-?1b|[a-z0-9]+-ead|ead|usc|gc|green card|u\.?s\.? citizens?|opt|cpt|tn|l2|h4)\b'
      # ITAR / export control: "Must meet Export Control requirements as a
      # U.S. Person", "ITAR: must be a U.S. person".
      - name: "US person (export control) required"
        unless_near: *term_guards
        trigger: 'u\.?s\.? person|\bitar\b|export control'
        pattern: '\b(must|required|requires?|need|needs|be|as a|qualify as|only)\b.{0,40}\bu\.?s\.? persons?\b|\bu\.?s\.? persons?\b.{0,30}\b(only|required|status|as defined)\b|\b(itar|export control\w*)\b.{0,80}\b(u\.?s\.? persons?|citizen\w*)\b|\b(must|required to|need to) (meet|satisfy|comply with|pass)\b.{0,20}\b(itar|export control)'
      # The right to work somewhere: "must be authorized to work in the U.S.",
      # "legally entitled to work in Canada", "Eligibility to work in the UK",
      # "EU work authorisation", "authorized to work ... without sponsorship".
      # "Able to work in a team" and "the right to work from home" are not.
      - name: "work authorization in another country required"
        unless_near: *preference_guard
        trigger: 'to work\b|work authori|work(ing)? rights?|work permit|work visa|sponsorship'
        pattern: '\b(legally |lawfully )?(authori[sz]ed|eligible|entitled|permitted) to (live and )?work (in|for|within)\b|\blegally able to work\b|\b(authori[sz]ed|eligible|entitled|permitted) to work\b.{0,40}\bin (the )?(location|country|uk|us|u\.s\.|usa|united states|united kingdom|canada|australia|eu|europe|[a-z]+ (state|province))\b|\beligibility to work\b|\b(authori[sz]ation|right|rights|permission|permit) to work (in|for|within)\b|\b(unrestricted|legal|valid|existing|full|current) right to work\b|^(the )?right to work( status| documentation)?$|\bwork(ing)? rights? (in|for)\b|\b(eu|european|uk|british|us|u\.s\.|american|canadian|australian|swiss|singapore|new zealand|irish|danish|german|dutch) work(ing)? (authori[sz]ation|permit|rights?|visa)\b|\b(eu|uk|us|u\.s\.|australian|canadian|swiss|irish|singapore) right to work\b|\bwork authori[sz]ation (in|for|to)\b|\b(hold|have|possess\w*|valid|existing|current)\b.{0,20}\bwork (permit|visa)\b|\bwithout (the need for |requiring |needing |any )?(current or future |visa |employer |company |work )?sponsorship\b'
      # A refusal to sponsor. Lifted for an employer who plainly engages people
      # abroad: a remote contractor never needs a visa.
      - name: "visa sponsorship refused"
        # "TikTok will be prioritizing applicants who ... do not require TikTok
        # sponsorship" ranks, it does not refuse. Narrower than the preference
        # guard on purpose: "US citizens/GC holders encouraged to apply we do
        # not offer sponsorship" still refuses.
        unless_near:
          - pattern: '\bpriorit\w*'
            before: 80
        trigger: 'sponsor|visa'
        lifted_by_international: true
        pattern: '\bno (visa |work permit |employment |h-?1b |immigration )?sponsorship\b|\bsponsorship\b.{0,30}\b(not available|unavailable|not offered|not provided|not possible|cannot be (provided|offered))\b|\b(cannot|can not|can[’'']t|unable to|not able to|will not|won[’'']t|do not|don[’'']t|does not|doesn[’'']t|are not|is not)\b.{0,25}\b(sponsor|provide (visa|sponsorship)|offer (visa|sponsorship)|transfer (visa|h-?1b)|support (visa|sponsorship))|\b(cannot|can not|can[’'']t|unable to|not able to|will not|won[’'']t)\b (consider|accept|hire|employ)\b.{0,80}\b(require|need)\w*\b.{0,30}\bsponsor|\bonly\b.{0,50}\b(do not|don[’'']t|does not|doesn[’'']t|will not|won[’'']t|never) (require|need)\b.{0,30}\bsponsor'
        unless: '\b(outside of|other than|not guaranteed|except|for roles outside)\b'
      # Clearances go only to citizens or long-term residents: "active NV1",
      # "SC Cleared", "DoD Secret clearance", "TS/SCI with polygraph",
      # "eligible to obtain eDV clearance".
      - name: "security clearance required"
        unless_near: *preference_guard
        trigger: 'clearance|cleared|vetting|polygraph|\bnv ?[12]\b|\bbpss\b|public trust|ts/sci'
        pattern: '\bsecurity clearance\b|\b(sc|dv|edv|ctc|tssci|ts/sci|ts|top secret|secret|baseline|nato secret|dod secret|government|federal|active|current) (security )?(clearance|cleared)\b|\bclearance (level|required|is required|eligibility)\b|\b(security|negative|positive) vetting\b|\bnv ?[12]\b|\bbpss\b|\bts/sci\b|\bpolygraph\b|\b(obtain|maintain|hold|have|active|current|eligible for|eligibility for)\b.{0,20}\bpublic trust\b'
      # "This role requires residency in Colorado", "US tax residency
      # required", "must be a resident of", "UAE residency required".
      - name: "residency required"
        unless_near: *preference_guard
        trigger: 'residen'
        pattern: '\b(require[sd]?|requires|requiring|must (have|maintain|hold|establish|keep)|need|needs|mandatory)\b.{0,30}\bresiden(cy|ce|t)\b.{0,10}\b(in|within|of)\b|\b(tax |legal |permanent )?residen(cy|ce) (in|within) .{0,40}\b(required|mandatory|is a must|needed)\b|\b[a-z.]+ (tax )?residency (is )?required\b|\bmust be (a |an )?(legal |permanent |tax )?residents? (of|in)\b|\bmust be (a |an )?[a-z.]{2,15} residents?\b|\b(only|exclusively) (open to |for |accepting )?residents (of|in)\b|\bresidents (of|in) .{0,30} only\b|\b(only|exclusively)\b.{0,25}\b(hire|employ|engage|consider|accept)\b.{0,30}\bresidents?\b|\bresidents only\b'
        unless: '\b(salary|pay range|base pay|compensation|privacy|notice)\b'
      # W-2 is a US payroll form: an employer paying "on W-2" can only put on
      # it somebody with a US social security number and the right to work
      # there. Not a refusal when C2C, corp-to-corp or 1099 is offered as well
      # ("W-2, 1099, C2C") — unless that is refused too ("No C2C, ONLY W2") —
      # nor where W-2 is a document ("paystubs, W-2s, bank statements").
      - name: "US payroll only (W-2)"
        trigger: '\bw-?2\b'
        lifted_by_international: true
        unless_anywhere: '\b(c2c|corp[- ]to[- ]corp|1099|independent contractors?|international contractors?)\b'
        negated: '\b(no|not|non|without|excluding|unable to accommodate|not accepting|cannot accept|can[’'']t accept|does not accept|not open to)\b[^.;]{0,30}\b(c2c|corp[- ]to[- ]corp|1099)\b(\s*(or|and|/|,)\s*(c2c|corp[- ]to[- ]corp|1099|third[- ]party))*'
        pattern: '\b(on|in) (a |the )?(competitive )?w-?2\b|(\d|/|per |an? )\s?(hour|hr|h)\.? ?w-?2\b|\bw-?2[- ](only|role|position|contract|contractors?|employment|employees?|consultants?|basis|arrangement|candidates?|benefits|pay|hourly|rate|salary|opportunity|tax|engagement|employer|long[- ]term|terms|status|payroll)\b|\b(direct|full[- ]time|part[- ]time|contract|only|strictly|exclusively|hourly) \(?w-?2\b|\bw-?2\)|\bemployment type\s*:\s*w-?2\b'

  hard_dealbreakers:
    points: -1000  # in effect removes the vacancy from the "hot" categories
    # Work-authorization requirements (citizenship, permits, clearance,
    # sponsorship, W-2) live in work_authorization, read sentence by sentence.
    patterns:
    # "Hybrid" as an arrangement, never as a technology. The distinction is the
    # whole difficulty, and it was measured rather than assumed on 2026-08-11:
    # across the base, 58 vacancies use "hybrid cloud", "hybrid architecture",
    # "hybrid deployment"; among the 21 in the shortlist that mention hybrid at
    # all, 20 mean commuting. So the word alone cannot be a keyword — every
    # pattern below requires a neighbouring word that only makes sense about a
    # place of work.
    #
    # The real forms they take, quoted from the postings themselves:
    #   "Senior C#/.NET Engineer  Location: London (Hybrid)"
    #   "Work Arrangement: Hybrid (3 Days/week)"
    #   "Hybrid working - 3 days per week, London"
    #   "you can work both from home and from the office (hybrid)"
    #   "we've adopted a hybrid approach, with teams in the office four days a week"
      - name: "hybrid work arrangement"
        pattern: "hybrid (work|working|workplace|schedule|arrangement|setup|policy|office|onsite|on-site)"
      # all wanted the verb — "must be authorized to work" — and every real
      # posting found on 2026-08-12 used the other form:
      #
      #   "Must have authorization to work in the UK without sponsorship"
      #        Thermo Fisher, sitting in hot_lead at 64
      #   "Legal authorization to work in the U.S. indefinitely is required.
      #    Employer work permit sponsorship is not available."
      #        Motorola Solutions, at 42
      #   "Authorization to work in the United States. We are not able to
      #    sponsor or transfer work visas at this time."
      #        Edfinity, labelled "Anywhere in the World"
      #
      # 43 postings in the base use it. Requiring the demand ("must have",
      # "is required") keeps an OFFER of sponsorship — which is a plus rather
      # than a refusal — out of the match.
      # ("U.S."), never over a full stop. Without that the Motorola posting
      # — "Legal authorization to work in the U.S. indefinitely is required"
      # — slips through; with a plain "any character" window instead, the
      # pattern would happily span two sentences and reject "authorization to
      # work in Germany. A driving licence is required."
      # "Remote within the United States" and its family. 31 in the base; not
      # one of them reached the shortlist, because something else caught each
      # — but relying on that is luck rather than a rule.
      - name: "remote within one country"
        pattern: "remote (with)?in (the )?(us|usa|united states|uk|united kingdom|canada|europe|eu|india|australia|germany|france|spain|netherlands|poland|brazil|mexico|singapore)\\b"
      # Hybrid inside brackets with something else in there too. The narrow
      # "(hybrid)" rule missed a real title in the shortlist:
      #   "Backend Developer (C# - SSIS) - (hybrid, 36-40k)"  scored 38
      # Two negative guards, both measured. Technology words, because
      # "(hybrid cloud)" is not a commute; and "remote", because one real
      # posting says "(hybrid and options for remote work)" — which offers
      # remote rather than refusing it. 61 matches across the base, every one
      # about a place of work.
      - name: "hybrid named in brackets"
        pattern: "\\((?![^)]*\\b(cloud|architecture|deployment|app|apps|mobile|encryption|search|model|integration|remote)\\b)[^)]{0,40}\\bhybrid\\b[^)]{0,40}\\)"
      - name: "listed as hybrid"
        pattern: "\\((\\s*hybrid\\s*|\\s*on-?site\\s*)\\)"
      # "Brussels | 50% remote" — the rest of the week is somewhere else. Added
      # to both templates 2026-09-13; "100% remote" cannot match.
      - name: "partly remote, by percentage"
        pattern: '\b(?:up to\s+)?[1-9]\d?\s?%\s?(?:remote|telework|home[- ]?office|work(?:ing)? from home)\b'
      - name: "work arrangement stated as hybrid"
        pattern: "(work (arrangement|setting|model|policy|type)|location|job type|setup)\\s*[:\\-]\\s*hybrid"
      - name: "hybrid with days named"
        pattern: "hybrid[^.]{0,40}\\b(\\d+|one|two|three|four|five)\\s*(\\+)?\\s*days?"
      - name: "days per week in the office"
        pattern: "\\b(\\d+|one|two|three|four|five)\\s*(\\+)?\\s*days?[^.]{0,25}\\b(in|at|from)\\s+(the\\s+)?office"
      - name: "office days per week"
        pattern: "\\b(in|at|from)\\s+(the\\s+)?office[^.]{0,25}\\b(\\d+|one|two|three|four|five)\\s*(\\+)?\\s*days?"
    keywords:
      - "must relocate"
      - "on-site required"
      - "in-office"
      - "hybrid required"
      # Work at the CLIENT's premises. Found 2026-08-11 by the manual checklist:
      # "GIS Full Stack .Net Developer" @ Master Works arrived through LinkedIn's
      # remote filter, scored 62 and led the shortlist — and its own text ended
      # with "Job Location: Client Site." The board's label lost to the
      # employer's own words, the same principle as the Headquarters heading.
      # Measured across the base: 20 vacancies, 1 of them in the head.
      - "client site"
      - "at client end"
      - "at the client end"
      - "client premises"
      # A driving licence is only ever required of somebody who commutes.
      # Found the same day: "Backend Developer" @ Altkamul, Sharjah — "UAE
      # Experience is a must with driving license". Measured: 9 vacancies.
      - "driving license"
      - "driving licence"
      # An interview that has to happen in person means presence in that
      # country. "Dotnet Developer" @ Natsoft opened with "Client interview: In
      # person in Wilmington, DE" and scored 41. Measured: 13 vacancies.
      - "in person in"
      - "in-person interview"
      - "onsite interview"
      - "on-site interview"
      # Hybrid and office work. Found 2026-08-05 by reading the shortlist:
      # eight vacancies saying "Hybrid Position", "hybrid working model" and
      # "(WFO)" — Work From Office. The old list held "hybrid required", which
      # almost nobody writes.
      - "hybrid position"
      - "hybrid role"
      - "hybrid working model"
      - "hybrid work model"
      - "hybrid setup"
      - "hybrid model"
      - "work from office"
      - "(wfo)"
      - "office-based role"
      - "days in the office"
      - "days from the office"
      # A real bug found (2026-07-30): the Rangeview vacancy literally said
      # "ONSITE" (without "required") and "ITAR: must be a U.S. person" —
      # neither of which the old list caught.
      - "onsite"
      - "on-site"
      - "on site"
      - "in office"
      - "in-person"
      - "must work from our office"
      - "office-based"
      - "office based"
      - "no remote work"
      - "not a remote"
      - "itar"
      - "must be a u.s. person"
      - "u.s. person required"
      - "united states person required"
  structured_location_gate:
    # Wordings that make a location field mean "and only here".
    # They override the target-market rule: "United States only" contains
    # "United States", a target market, and without this check the vacancy
    # would pass (a real finding, 2026-08-05).
    exclusivity_markers:
      - " only"
      - "only)"
      - "-only"
      - "residents only"
      - "citizens only"
    # CRITICAL (a real bug found, 2026-07-30): many sources return the
    # geography restriction as a STRUCTURED field (WWR region, Remotive
    # candidate_required_location, Jobicy jobGeo, Himalayas
    # locationRestrictions) rather than as a phrase in the text. Only the text
    # used to be checked, so vacancies with location_raw = "USA" / "Canada
    # only" / "Brazil" / "Costa Rica" / "Texas" sailed through — about 20 of
    # 32 candidates turned out to be geographically unreachable.
    #
    # The logic: if the location field is filled in and contains NO explicit
    # "whole world" marker, that is a geography restriction and so a
    # dealbreaker (unless a worldwide or EOR signal in the text outweighs it at
    # the same time).
    worldwide_markers:
      - "anywhere"
      - "worldwide"
      - "world wide"
      - "global"
      - "globally"
      - "remote (global)"
      - "no restriction"
      - "any location"
      - "any country"
    # A list of continents (Remotive: "Americas, Europe, Asia, Africa,
    # Oceania") is in effect "the whole world", though the word "worldwide" is
    # absent. If the location field mentions >= continent_threshold continents,
    # we treat that as no restriction.
    continent_names:
      - "americas"
      - "north america"
      - "south america"
      - "europe"
      - "asia"
      - "africa"
      - "oceania"
      - "emea"
      - "apac"
      - "latam"
    continent_threshold: 3
    # Location values that simply mean "remote", WITHOUT naming a country, are
    # not a geography restriction. A real bug found (2026-07-31, after the ATS
    # sources were connected): Greenhouse and Ashby write "Remote job" (209
    # vacancies), GitLab writes "Distributed" (39, their term for an all-remote
    # company), and all of it was cut as "the source restricts hiring".
    # If nothing remains of the value once these words are struck out, there is
    # no restriction, and the ordinary logic takes over (an unknown location ->
    # needs_manual_review, not a refusal).
    remote_without_country_tokens:
      - "remote"
      - "job"
      - "jobs"
      - "distributed"
      - "telecommute"
      - "work from home"
      - "wfh"
      - "flexible"
      - "n/a"
      - "na"
      - "-"

  header_scope_gate:
    # A real bug found 2026-07-31 (manual checklist, two candidates from the
    # top of the shortlist): Stripe and Airtable arrived from WWR with region
    # "Anywhere in the World", while the first line of the description said
    # "Headquarters: US Remote" and "Headquarters: … ; Remote - US"
    # respectively. Both US residents only, both in hot_lead.
    #
    # The reason for the discrepancy: WWR feeds are by category ("Programming")
    # and their region is filled in sweepingly; the Headquarters line is
    # written by the employer. So in a conflict we believe the employer.
    #
    # ONLY heading lines are examined: the phrase "our US remote team" in the
    # body is a description of the company, not a requirement of the candidate.
    scan_first_lines: 6
    header_line_patterns:
      - "^headquarters\\s*:"
      - "^location\\s*:"
      - "^hiring in\\s*:"
    # A restriction is only the pairing "remote + country/region". A bare
    # "Headquarters: Saudi Arabia" is NOT a restriction: that is the company's
    # address, not a statement about where it hires.
    # Derived from config/derivation/regions.yaml (the
    # residency_required_phrases of regions the person is not resident in).
    restriction_patterns:
      - "remote\\s*[-–—/(,]*\\s*(us|usa|u\\.s\\.|united states|america)\\b"
      - "\\b(us|usa|u\\.s\\.|united states)\\s*[-–—/(,]*\\s*remote\\b"
      - "remote\\s*[-–—/(,]*\\s*(eu|europe|european union)\\b"
      - "\\b(eu|europe|european union)\\s*[-–—/(,]*\\s*remote\\b"
      - "remote\\s*[-–—/(,]*\\s*(uk|united kingdom|canada|latam|apac|india)\\b"
      - "\\b(uk|united kingdom|canada|latam|apac|india)\\s*[-–—/(,]*\\s*remote\\b"

  timezone_gate:
    # A time-zone requirement is an axis of its own, apart from country, and
    # nothing used to check it. A real case, 2026-07-31: five Proxify vacancies
    # say "Located in CET timezone (+/- 3 hours), we are unable to consider
    # applications from candidates in other time zones". The person's time zone
    # did fall inside that window, but we learned it by reading with our eyes
    # rather than by a check.
    #
    # Only the explicit form "<TZ> +/- N hours" is parsed. Free-form wordings
    # ("significant overlap with PST") produce needs_manual_review rather than
    # a refusal: hiding a real vacancy is worse than showing a doubtful one.
    exclusive_phrases:
      - "unable to consider applications from candidates in other time zones"
      - "candidates in other time zones"
      - "must be located in"
      - "must be based in the"
      - "only considering candidates in"
      - "required to work in the"
    zone_offsets:
      utc: 0
      gmt: 0
      wet: 0
      cet: 1
      cest: 2
      eet: 2
      eest: 3
      msk: 3
      gst: 4
      ist: 5
      sgt: 8
      jst: 9
      aest: 10
      est: -5
      edt: -4
      cst: -6
      cdt: -5
      mst: -7
      mdt: -6
      pst: -8
      pdt: -7
      pacific: -8
      eastern: -5
      central: -6
      mountain: -7

  # Confirmed by the owner explicitly (2026-07-30): "I need ONLY REMOTE
  # positions". By default a vacancy must be CONFIRMED as remote, or it is a
  # dealbreaker rather than "unknown, but let it through". The absence of a
  # location signal used to give only a soft needs_manual_review; now it leads
  # to rejection if there is NEITHER an explicit worldwide/EOR/region signal,
  # NOR even a hint of remote in the text, NOR a remote=true flag from the
  # source.
  remote_synonym_keywords:
    - "remote"
    - "work from home"
    - "distributed team"
    - "distributed workforce"
    - "remote-first"
    - "wfh"
    - "home-based"
    - "telecommute"
    - "telework"
    - "work remotely"
  # What confirms remote for a board that hides the work arrangement from
  # anonymous visitors (workplace_hidden in config/sources.catalog.yaml —
  # LinkedIn). The synonyms above minus the ones its postings use for
  # something else: "WFH 3 days per week" is hybrid, "an allowance when you
  # work from home" is a perk, "a distributed team" is the team.
  # Measured on the base 2026-10-04 (the owner: everything from LinkedIn
  # where remote is not stated goes to "remote not confirmed").
  explicit_remote_keywords:
    - "remote"
    - "telecommute"
    - "telework"
  # ==== IDENTITY TUNING ====
  # Ambiguous place names: one name, two different places. It does not affect
  # the score but sets needs_manual_review so a person checks with their eyes.
  #
  # Flagged only if the context of BOTH meanings fired, or NEITHER.
  # One clear meaning is no reason to bother a person.
  #
  # For this identity there is exactly one rule and it matters: the person
  # Starting points for other frequent traps: config/derivation/ambiguous_places.yaml.
  # The list is derived from RESIDENCY and so is empty in the template: the
  # "Georgia" trap (the country versus the US state) exists for somebody living
  # in the country of that name and not for anybody else. Starting points are
  # in config/derivation/ambiguous_places.yaml; the ones relevant to a person
  # are carried across into their local identity.
  ambiguous_place_names: []

stack_fit:
  # ==== IDENTITY TUNING ====
  # How to name this identity's stack in refusal messages. It appears in the
  # dealbreakers field, which a person reads, so it is written in plain words.
  stack_label: ".NET/JS"

  # The weights deliberately reflect the REAL frequency of technologies in the
  # person's CV (see profile.yaml -> tech_stack) rather than a general "this is
  # .NET-compatible too". core appears in nearly every role over 7+ years;
  # strong regularly but not always; familiar was in 1-2 roles. Confirmed by
  # the owner explicitly (2026-07-30): technologies actually worked with more
  # often should weigh more than ones only brushed against.
  points_per_core_keyword: 3
  points_per_strong_keyword: 2
  points_per_familiar_keyword: 1
  cap: 25
  # The cap for the case where no CORE technology is named. Measured
  # 2026-08-05: a vacancy in pure C#/ASP.NET scored 7 for its stack, while an
  # agency posting listing TypeScript, JavaScript, React, HTML and CSS scored
  # 14. A point per match rewards the length of the list rather than the fit to
  # the stack, and keeps raising those who list technologies wholesale. The
  # matching stack must beat the broad one.
  cap_when_no_core: 8

  # "Stack spam": blocks listing every technology in the world in order to hit
  # any search. A real case found 2026-07-31: Lemon.io ends EVERY posting with
  # a "NOT YOUR TECH STACK?" paragraph listing some 60 technologies, including
  # ".NET & C#" and Angular. Because of it their "Senior Graphic Designer" got
  # core_hits ["C#", "Angular"], the full 15 points for stack, and passed the
  # relevance gate. The text is cut at the marker ONLY for stack scoring —
  # geography and language still read the whole description (that same block
  # is where Lemon.io lists the countries it hires in).
  noise_section_markers:
    - "NOT YOUR TECH STACK?"
    - "We have a variety of projects, so if you have"
    - "we would be happy to connect with you and match you with a project"
  # the stack keywords come from profile.yaml tech_stack.core/.strong/.familiar
  #
  # The relevance gate (see score.py -> score_vacancy): a vacancy goes further
  # only if there is at least one core OR strong match — one familiar match is
  # not enough (otherwise a chance match of "LESS" with the ordinary English
  # word "less" in a finance vacancy passes the filter — a real bug found,
  # 2026-07-30).
  #
  # AN EXCEPTION (confirmed by the owner explicitly, 2026-07-30): Java and
  # Scala on their own are NOT counted as relevant (Java web development is not
  # something the person can expect), BUT Java/Scala IN THE CONTEXT of data
  # pipelines (Spark/Databricks/ETL — real experience, from a previous job) is
  # an acceptable, wanted variant. So Java/Scala plus at least one word from
  # data_pipeline_context_keywords also passes the relevance gate.
  # The primary-language gate (confirmed by the owner explicitly, 2026-07-30:
  # "not .NET/JS ... throw it out"). Generic infrastructure technologies
  # (Docker, Azure, HTML, CSS, microservices) appear in practically every
  # vacancy and are NO proof that a role suits a .NET/JS developer. A real
  # finding: two Canonical vacancies (embedded/Linux systems engineering)
  # passed the gate on the word "Docker" alone.
  #
  # The requirement: the text must contain at least one REAL language or
  # framework from the person's stack, not only an infrastructure word.
  primary_language_keywords:
    - ".NET"
    - "VB.NET"        # a .NET-family role; NOT among the core skills (not in the CV)
    - ".NET Core"
    - ".NET Framework"
    - "C#"
    - "ASP.NET"
    - "ASP.NET MVC"
    - "ASP.NET Core"
    - "ASP.NET Web API"
    - "Entity Framework"
    - "EF Core"
    - "EF6"
    - "JavaScript"
    - "TypeScript"
    - "Angular"
    - "AngularJS"
    - "React"
    - "Node.js"
    - "jQuery"
  data_pipeline_language_keywords:
    - "java"
    - "scala"
  data_pipeline_context_keywords:
    - "apache spark"
    - "spark"
    - "databricks"
    - "delta lake"
    - "data pipeline"
    - "data engineer"
    - "etl"
    - "big data"

role_complexity_signal:
  # Since V2: a vacancy this gate rules out is not parked for a person either
  # (score.py, the classification). The first run showed a "Principal Data
  # Engineer" at 55 in "hours not confirmed" — confirming its hours could not
  # have made it a candidate.
  applies_to_unconfirmed: true
  # REPURPOSED. In KISEL this gate means "not simple work", and interesting,
  # complex work is exactly what it keeps out. Here that work is WANTED, so the
  # gate means something narrower: "this CV will not be considered".
  #
  # The owner, 2026-09-13: "a data engineer, a model-training developer — with
  # my CV they will not take me, no chance, no point trying. Although the work
  # would be interesting."
  #
  # The mechanism is unchanged: one title hit, one strong single hit, or
  # threshold_hits description hits, and the vacancy cannot rise above
  # low_priority. What the patterns name is different.
  #
  # NOT here, deliberately: "AI engineer", "LLM engineer", "agentic". An
  # application developer building on a model API is reachable from this CV,
  # and those words are among the interesting ones (extra_signals).
  title_red_flag_patterns:
    - 'research scientist'
    - 'applied scientist'
    - '\bscientist\b'
    - 'machine learning'
    - '\bml engineer\b'
    - '\bmlops\b'
    - '\bml platform\b'
    - 'data scientist'
    - 'data engineer'
    - 'analytics engineer'
    - 'research engineer'
    - '\bresearcher\b'
    - 'computer vision'
    - '\bnlp\b'
    - 'deep learning'
    - 'inference engineer'
    - 'model training'
    # Smart contracts moved to side_specialisms below in V5; protocol,
    # zero-knowledge and cryptography work stays here — a separate profession
    # rather than something beside a .NET role.
    - 'protocol engineer'
    - '\bzk\b'
    - 'zero[- ]knowledge'
    - 'cryptograph'
    - '\bquant\b'
    - 'quantitative'
    - 'firmware'
    - 'embedded (?:software|systems|engineer|developer)'
  # Needs threshold_hits of them: an application role may mention one or two
  # in passing ("integrate with PyTorch models"), a research role names many.
  description_red_flag_keywords:
    - "pytorch"
    - "tensorflow"
    - "cuda"
    - "hugging face"
    - "scikit-learn"
    - "model training"
    - "training models"
    - "fine-tuning models"
    - "reinforcement learning"
    - "published research"
    - "phd"
  threshold_hits: 3
  description_red_flag_keywords_strong_single_hit:
    - "phd required"
    - "phd is required"
  # A specialism that rules a vacancy out only when it IS the role
  # (score._side_specialism). The owner, 2026-09-14: "if smart contracts are
  # not the main thing, if the base is .NET and the vacancy reads as .NET with
  # smart contracts rather than smart contracts with .NET, they must not
  # exclude it."
  #
  #   title names only the specialism    -> ruled out
  #   title names only the core stack    -> kept
  #   title names both                   -> whichever comes FIRST: ".NET
  #                                         Developer (Smart Contracts)" is
  #                                         kept, "Solidity / C# Developer" not
  #   title names neither                -> ruled out only if the posting
  #                                         mentions the specialism MORE often
  #                                         than the core stack; a tie keeps it
  #
  # Measured over this search's base on the day: 18 vacancies mention smart
  # contracts, Solidity or EVM, most of them once, inside an agency's list of
  # every technology beside five to seven mentions of .NET. None was ruled out
  # by the old title rule, so nothing in the shortlist moves; the change closes
  # the refusal the owner described before it happens.
  side_specialisms:
    - name: "smart contracts"
      title_patterns:
        - 'smart[- ]contracts?'
        - '\bsolidity\b'
        - '\bevm\b'
        - '\bvyper\b'
      text_patterns:
        - 'smart[- ]contracts?'
        - '\bsolidity\b'
        - '\bevm\b'
        - '\bvyper\b'
        - '\bhardhat\b'
        - '\bethers\.js\b'
        - '\bweb3\.js\b'
      core_patterns:
        - '\.net\b'
        - '\bdotnet\b'
        - '\bc#'
        - '\basp\.net\b'
        - '\bblazor\b'
        - '\bentity framework\b'

# The gate for "the title names somebody else's stack".
#
# A real finding, 2026-08-04, spotted by a person in the finished shortlist:
# "Senior Ruby on Rails Developer", "Senior Fullstack Developer (Python)" and
# "Senior Vue Developer" passed the stack filter. The leak: the relevance gate
# looked for a familiar language ACROSS THE WHOLE text, and a Rails vacancy
# lists HTML/CSS/JavaScript in passing as adjacent skills. Formally there is a
# match; in fact the role is about something else entirely.
#
# The rule: the TITLE defines the role. If it names a technology that is not in
# core or strong (familiar is not enough — that means "touched twice in a
# career"), the vacancy is cut regardless of what the body mentions.
title_stack_gate:
  # Technologies that DEFINE a role when they are in the title. The list is not
  # about what the person knows but about which words in a title set the stack
  # at all — so it is the same for every identity.
  role_defining_technologies:
