language_requirement_signal:
  # The scripts the person reads. Everything else is total rejection: a posting
  # in Hebrew or Chinese is unreadable, and listing its frequent words is
  # pointless — the alphabet is visible at once.
  #
  # Found 2026-08-05 by reading the shortlist: a vacancy in Hebrew stood 13th.
  # The word lists existed for five European languages and could not catch
  # another script in principle.
  #
  # The threshold is proportional: a couple of Hebrew words occur even in an
  # English-language vacancy from an Israeli company (a name, an address),
  # whereas a posting written entirely in it gives tens of per cent.
  readable_scripts: ["latin", "cyrillic"]
  unreadable_script_threshold: 0.15
  # Language demands a word list cannot hold (score._score_language_fit), added
  # to both templates on 2026-09-13 — see the KISEL template for the
  # measurement. The languages named are the ones this search's person does
  # NOT speak.
  explicit_requirement_patterns:
    - name: "fluent in a language this person does not speak"
      pattern: '\b(?:fluen\w*|command of|proficien\w*|communicate fluently)\b[^.;]{0,20}\b(?:dutch|french|german|flemish)\b(?![^.;]{0,40}\b(?:desirable|optional\w*|a plus|plus|nice to have|advantage|asset|bonus|preferred|beneficial)\b)'
    - name: "a language, then the demand"
      pattern: '\b(?:dutch|french|german|flemish)\b[^.;]{0,20}:\s*(?:fluent|native|required|mandatory|must)'
  # TOTAL REJECTION (a dealbreaker). Confirmed by the owner explicitly
  # (2026-07-30): the person speaks only Russian and English (see profile.yaml
  # -> owner.languages). An explicit requirement for another language — German,
  # for instance ("Web-Administration / Webmaster TYPO3" demanded sehr gute
  # Deutschkenntnisse) — disqualifies the vacancy entirely.
  explicit_requirement_keywords:
    - "fluent german"
    - "german required"
    - "german language required"
    - "advanced german"
    - "sehr gute deutschkenntnisse"
    - "gute deutschkenntnisse"
    - "verhandlungssicheres deutsch"
    - "muttersprache deutsch"
    - "native german speaker"
    - "german speaker required"
    - "fließend deutsch"
    - "deutschkenntnisse"
    - "german c1"
    - "german c2"
    - "fluent french"
    - "french required"
    - "native french speaker"
    - "fluent spanish"
    - "spanish required"
    - "native spanish speaker"
    - "fluent italian"
    - "italian required"
    - "fluent dutch"
    - "dutch required"
    - "native dutch speaker"
    # Added 2026-08-11 from config/derivation/languages.yaml, where these five
    # languages were missing entirely — so a requirement for any of them
    # produced no rule for anybody. Found by the manual checklist: ".NET
    # Developer / Team Lead" @ Talents Sea asked for "Good communication in
    # Arabic & English" and sat in worth_a_look; "C# .NET System Developer" @
    # Skapa asked for Swedish and was a hot_lead at 51.
    - "fluent arabic"
    - "arabic required"
    - "arabic language required"
    - "native arabic"
    - "arabic speaker"
    - "arabic and english"
    - "communication in arabic"
    - "good command of arabic"
    - "fluent hebrew"
    - "hebrew required"
    - "native hebrew"
    - "hebrew speaker"
    - "hebrew and english"
    - "fluent swedish"
    - "swedish required"
    - "swedish language required"
    - "native swedish"
    - "swedish speaker"
    - "flytande svenska"
    - "goda kunskaper i svenska"
    - "fluent turkish"
    - "turkish required"
    - "native turkish"
    - "turkish speaker"
    - "fluent portuguese"
    - "portuguese required"
    - "native portuguese"
    - "portuguese speaker"
  # Many vacancies from German job boards (arbeitnow in particular) are written
  # entirely in German, with no explicit English "German required" phrase — the
  # very fact that the description is in German already means the working
  # language is neither English nor Russian. threshold_hits items from this
  # list is the heuristic "this is a German-language vacancy" (it uses the
  # "m/w/d"/"w/m/d" markup standard in German postings, and frequent words).
  german_market_indicator_keywords:
    - "m/w/d"
    - "w/m/d"
    # A real finding, 2026-07-31: two Hygraph vacancies, "Senior
    # Fullstack Engineer (f/m/d) - Berlin I Germany, EMEA I Remote"
    # — the same German gender marker, just a different letter.
    - "(f/m/d)"
    - "(d/f/m)"
    - "(m/f/d)"
    - "(m/w/x)"
    - "wir suchen"
    - "ihre aufgaben"
    - "ihr profil"
    - "kenntnisse"
    - "bewerbung"
    - "unser unternehmen"
    - "homeoffice"
    - "vollzeit"
    - "teilzeit"
    - "arbeitszeit"
    - "mitarbeiter"
    - "unternehmen"
  german_market_indicator_threshold: 3

  # Unambiguous markers of a German-language posting: one is enough.
  german_market_strong_single_markers:
    - "m/w/d"
    - "w/m/d"
    - "(f/m/d)"
    - "(d/f/m)"
    - "(m/f/d)"
    - "(m/w/x)"
    - "deutschkenntnisse"

  # The same device as for German, but for the other languages. Real findings,
  # 2026-07-31 (manual checklist): "Website Builder / WordPress Specialist" at
  # Work and Study Travel — a posting entirely in Spanish (paying 16,000
  # MXN/month), and "Full-Stack Developer (React + AWS)" at Base.com —
  # entirely in Polish. Both passed the filter only because the heuristic
  # existed for exactly one language.
  #
  # The markers are chosen so as not to occur in English text: they are the
  # functional words of job postings rather than general vocabulary.
  foreign_language_posting_indicators:
    - language: dutch
      threshold: 4
      markers: ["wil jij", "jouw ", "onze ", "wij zoeken", "vacature",
                "werkzaamheden", "functie-eisen", "ervaring met", "bij ons",
                "wat wij bieden", "sollicitatie", "medewerker", "bedrijf",
                "opdrachtgevers", "dienstverband",
                # Functional words: weak singly, unambiguous together.
                # Measured 2026-08-05 across the whole base: they fire without
                # a single explicit Dutch word on exactly one vacancy — and
                # that one really is Dutch. Zero false positives.
                # (Corrected 2026-09-13: the edge spaces were being stripped,
                # so German postings matched as Dutch — see the KISEL
                # template's V14.)
                " je ", " het ", " van de ", " in de ", " voor de ",
                " met een ", " zijn ", " worden ", " ontwikkelaar "]
    - language: spanish
      threshold: 3
      markers: ["buscamos", "responsabilidades", "conocimientos", "ofrecemos",
                "experiencia en", "nuestro equipo", "empresa", "puesto",
                "requisitos", "trabajo remoto"]
    - language: polish
      threshold: 3
      markers: ["szukamy", "twoje zadania", "oferujemy", "doswiadczenie",
                "doświadczenie", "zespol", "zespół", "wymagania", "praca",
                "firma", "naszą misją"]
    # Widened 2026-09-13. The seven markers below missed LinkedIn's French
    # postings, which say "je recherche" rather than "nous recherchons" and
    # "Télétravail : hybride". Functional words were added, and the threshold
    # rose from 3 to 4, both measured over KISEL's base: 60 detections became
    # 86, not one earlier detection was lost, and every shown vacancy newly
    # caught had a French title. (Corrected the same day: at 3 the English
    # false matches were " des " inside "design" and " les " inside "sales" —
    # the matcher stripped edge spaces until score.keyword_needle stopped it.)
    - language: french
      threshold: 4
      markers: ["nous recherchons", "vos missions", "votre profil",
                "compétences", "entreprise", "poste", "expérience",
                " vous ", " nous ", " avec ", " dans le ", " dans un ",
                " pour le ", " pour la ", "au sein", "télétravail",
                "développeur", "recherche un", "profil recherché",
                "démarrage", " notre ", " votre ", " des ", " les "]
    - language: portuguese
      threshold: 3
      markers: ["estamos à procura", "responsabilidades", "experiência",
                "equipe", "vaga", "requisitos"]
    - language: italian
      threshold: 3
      markers: ["cerchiamo", "requisiti", "esperienza", "azienda",
                "competenze", "il candidato"]


# The industry gate: not "lower priority" but total rejection.
#
# A real finding, 2026-08-04: a Parity vacancy (Polkadot/Kusama, blockchain
# infrastructure) scored 20 and reached the shortlist although the profile
# lists crypto and web3 outright among what the person avoids. The words
# "web3" and "blockchain" gave only -8 in low_intensity_signal, and that minus
# drowned in the pluses for worldwide remote and stack.
#
# The owner's rule, confirmed three times: a zero-chance case must be a gate
# rather than a penalty. The two-match threshold exists so that a vacancy
# mentioning crypto in passing among its clients is not cut.
industry_dealbreaker_gate:
  # EMPTY ON PURPOSE. KISEL refuses crypto and web3 here; for this search they
  # are among the interesting domains the owner named first (2026-09-13), and
  # they are a plus in extra_signals.interesting_work.
  threshold_hits: 2
  keywords: []

legacy_enterprise_signal:
  # NEUTRAL. The owner, 2026-09-13: "boring work is not a plus now, it is
  # neutral". The block stays so the scoring's shape is the same across
  # identities; it simply weighs nothing.
  points_per_keyword: 0
  cap: 0
  keywords: []

low_intensity_signal:
  # NEUTRAL. What matters here is not intensity but whether the work fits
  # beside a main job — a different axis with different words, declared in
  # extra_signals.fits_beside_a_job. Several of KISEL's words ("startup",
  # "crypto", "fast-paced") are not minuses for this search at all.
  positive_points_per_keyword: 0
  negative_points_per_keyword: 0
  cap: 0
  floor: 0
  positive_keywords: []
  negative_keywords: []

compensation_signal:
  # MONEY IS THE PRIORITY, so it is graded rather than merely noted. Every
  # stated amount becomes US dollars an hour (see score._hourly_equivalent): an
  # hourly rate as it is, an annual salary over 2080 hours — part-time postings
  # quote the full-time equivalent — and a range as its middle.
  #
  # The tiers describe the remote contract market for a senior developer, not
  # one person's expectation; a local override can move them.
  has_explicit_range_points: 2
  external_estimate_points: 1
  no_range_points: 0          # no data is not bad pay (CLAUDE.md §5)
  below_target_penalty: -6    # unused while tiers are set
  above_target_bonus: 2       # unused while tiers are set
  hours_per_year: 2080
  hourly_equivalent_tiers:
    - {at_least: 150, points: 32}
    - {at_least: 120, points: 26}
    - {at_least: 100, points: 20}
    - {at_least: 80, points: 14}
    - {at_least: 60, points: 8}
    - {at_least: 45, points: 2}
    - {at_least: 30, points: -4}
    - {at_least: 0, points: -10}

company_reputation_signal:
  # The cost of a red flag in points, not only a "check by hand" mark.
  # A real case, 2026-08-05: a platform whose reviews say "late payments" and
  # "unpredictable work availability" collected +14 for a 3.5 rating and 4.0
  # work-life balance and came first in the shortlist. For a contractor, late
  # payment is not a nuance but the substance of the deal.
  red_flag_points: -8
  red_flag_penalty_cap: -20   # the penalty does not go below this
  # Employer reputation from external sources (Glassdoor, Indeed reviews,
  # Trustpilot, reviews on specialist sites). CRITICAL for this project in
  # particular: the goal is a calm place with good work-life balance, and that
  # is exactly what a vacancy text never says, while former employees write
  # about it honestly in reviews.
  #
  # Filled in BY HAND by the agent through `tools/kb.py set-company-reputation`
  # (Glassdoor and the like cannot be scraped automatically — they answer 403;
  # the agent looks them up by ordinary web search, as a person would, see
  # docs/SOURCES.md). Stored in companies.json -> reputation and applied to ALL
  # of that company's vacancies at once.
  #
  # The rating scale is assumed to be 1..5 (as on Glassdoor and Indeed).
  overall_rating:
    excellent_threshold: 4.0    # >= — a noticeable plus
    excellent_points: 8
    decent_threshold: 3.5       # >= — a small plus
    decent_points: 4
    poor_threshold: 2.8         # <= — a penalty
    poor_points: -10
    # A really low rating is not merely a minus in points but a red flag: the
    # vacancy is marked needs_manual_review so that the person definitely reads
    # the reason before spending time on an application.
    alarming_threshold: 2.5
  work_life_balance:
    # An axis of its own, and for THIS project it matters more than the overall
    # rating: a company can be "good" overall on pay and career growth while
    # squeezing its people dry — and the opposite is what is wanted.
    excellent_threshold: 4.0
    excellent_points: 10
    poor_threshold: 3.0
    poor_points: -12
  # The agent's free-text notes from reading reviews. The presence of any of
  # them is a red flag for manual review, whatever the numbers say.
  red_flag_keywords:
    - "layoffs"
    - "mass layoff"
    - "unpaid overtime"
    - "does not pay"
    - "late payments"
    - "toxic"
    - "micromanagement"
    - "constant crunch"
    - "high turnover"
    - "burnout"
    - "return to office"
    - "rto mandate"
  no_data_points: 0   # no data is strictly neutral, as with salary

  # Company maturity — gathered AUTOMATICALLY from Wikidata
  # (`tools/company_intel.py`), unlike the ratings above.
  # profile.yaml -> ideal_company_traits mentions "mature company (10+ years
  # old)": an older company usually has settled processes, legacy systems and a
  # calm pace — exactly what is wanted. Until 2026-07-31 that trait was
  # recorded in the profile and checked nowhere.
  company_age:
    # Not KISEL's "mature is calm". For side work the question is whether an
    # invoice gets paid: a very young company is a small risk, an old one is
    # not a plus in itself.
    mature_threshold_years: 10
    mature_points: 1
    established_threshold_years: 5
    established_points: 1
    very_young_threshold_years: 3
    very_young_points: -3

contractor_friendliness:
  points_per_keyword: 5
  cap: 5
  keywords:
    - "1099"
    - "contractor"
    - "eor"
    - "deel"
    - "remote.com"
    - "oyster"
    - "papaya global"
    - "multiplier"
    - "globalization partners"
    - "velocity global"

classification_thresholds:
  # Starting values, to be recalibrated by measurement over the first run's
  # base — the same way KISEL's were (see the KISEL template). The scale is
  # different: a stated $100/hour alone is worth 22 points here.
  hot_lead: 40
  worth_a_look: 28
  long_shot: 12

talent_pipeline_gate:
  # An advertisement with no vacancy behind it. The employer is collecting CVs
  # for roles that may open later: "we are always looking to connect with
  # talented Senior .NET Developers who are interested in future opportunities…
  # By joining our talent pipeline, you'll be considered for upcoming roles as
  # new opportunities arise."
  #
  # Found 2026-08-11 by the manual checklist: "Senior .NET Developer" @ Mariner
  # Innovations scored 50 and led the shortlist. Everything about it matched —
  # stack, remote, legacy enterprise — because everything about it was written
  # to match. There was simply nothing to apply to.
  #
  # A gate rather than a penalty, on the same reasoning as the crowdwork gate:
  # the chance of this becoming a job on a known date is not low, it is
  # undefined. Points cannot express that.
  #
  # Measured across 13605 vacancies: 51 postings, 1 of them in the head of the
  # shortlist. The phrases are long on purpose — "opportunities" or "pipeline"
  # alone appear in perfectly ordinary vacancies ("our data pipeline").
  keywords:
    - "talent pipeline"
    - "talent pool"
    - "talent community"
    - "future opportunities"
    - "upcoming roles"
    - "as new opportunities arise"
    - "always looking to connect"
    - "join our talent"
    - "no specific opening"
    - "speculative application"

ai_training_crowdwork_gate:
  # EMPTY ON PURPOSE. KISEL gates AI-training piecework because a steady
  # position is what it wants. Side work paid by the hour is a legitimate
  # trade, and some of it pays $130 an hour — so the markers moved to
  # extra_signals.ai_training_gig, where they cost points and carry a label a
  # person reads, instead of hiding the vacancy. An assumption recorded
  # 2026-09-13, not the owner's words: revisit if the owner says otherwise.
  keywords: []

mobile_role_gate:
  # Mobile development behind a neutral title. A real finding, 2026-08-05:
  # 2026-08-05: "Lead Full-stack Developer (Full-Time Remote Contractor)" @
  # at Khibraty — by its description an existing React Native and Expo
  # application, with all the work inside it. The title gate does not see that,
  # just as it did not see DevOps behind a neutral title before
  #
  # A threshold of two: an ordinary web vacancy may mention a mobile app among
  # the company's products. Agency marketing blocks are cut by the same
  # mechanism as in stack scoring — otherwise a list of "React Native, Flutter,
  # ..." would reject everything from Lemon.io outright.
  #
  # The words are long: "expo" is deliberately dropped, being a substring of
  # "exposure" and "export" (the same class of mistake as "java" in "javascript").
  threshold_hits: 2
  keywords:
    - "react native"
    - "app store"
    - "google play"
    - "flutter"
    - "swiftui"
    - "xcode"
    - "testflight"
    - "ios and android"
    - "android and ios"
    - "mobile application"
    - "native app"
    - "mobile app"

engagement_fit:
  # A full-time role cannot be done beside a full-time job. The gate has the
  # same two halves as the remote gate (see score._check_engagement):
  #
  #   * the employer's or the board's statement decides — a confirmation
  #     anywhere beats a refusal anywhere, because "full-time or part-time" is
  #     an offer of part-time;
  #   * silence goes to a person with the score untouched, because full-time
  #     is the default most postings never write down.
  #
  # "contract" is in neither list: a UK day-rate contract is five days a week.
  #
  # "freelance" is in neither list either, since V2. The first run showed why:
  # in European IT contracting a "freelance .NET developer" is a contractor on
  # a full-time assignment at a client — "Freelance Fullstack .NET Developer –
  # Brussels, long-term assignment until 31/12/2026, 50% remote", "mission
  # freelance" in Paris. It says who invoices whom, like "contract".
  confirming_types: [part-time]
  contradicting_types: [full-time, internship]
  confirming_patterns:
    - name: "part-time"
      pattern: '\bpart[- ]?time\b'
    - name: "fractional"
      pattern: '\bfractional\b'
    # Twenty-five, not thirty, and never after "minimum" or "at least": the
    # first run confirmed "independent contractor status, minimum 30 hours a
    # week (normal schedule)" as part-time. A floor is not a ceiling.
    - name: "twenty-five hours a week or fewer"
      pattern: '(?<!minimum )(?<!min\. )(?<!at least )\b(?:[5-9]|1\d|2[0-5])\s*\+?\s*(?:(?:-|to|–)\s*\d{1,2}\s*)?(?:hours|hrs|h)\s*(?:per|a|/|each)\s*week'
    - name: "three days a week or fewer"
      pattern: '\b(?:[123]|one|two|three)\s*(?:(?:-|to|–)\s*(?:[23]|two|three)\s*)?days?\s*(?:per|a|/)\s*week'
    - name: "hours you set yourself"
      pattern: '\b(?:set your own hours|choose your own hours|no minimum hours|as many or as few hours)\b'
    - name: "beside a main job"
      pattern: '\b(?:side project|moonlighting|alongside (?:your|a) (?:full[- ]time|day) job|evenings and weekends)\b'
  contradicting_patterns:
    - name: "a full-time position"
      pattern: '\bfull[- ]?time (?:position|role|job|employment|opportunity|contract|engagement|commitment|hours|basis)\b'
    - name: "employment type: full-time"
      pattern: '\b(?:employment|job|contract|position|work) type\s*:?\s*full[- ]?time\b'
    - name: "(full-time)"
      pattern: '\(\s*full[- ]?time'
    - name: "forty hours a week"
      pattern: '\b(?:3[5-9]|4\d)\s*\+?\s*(?:hours|hrs|h)\s*(?:per|a|/)\s*week'
    # Added in V4, from reading the second run's "hours not confirmed" by hand:
    #   "Work Conditions Type: Full-time & Long-term contract work"
    #   "ability to work full-time remotely with no supervision"
    #   "a contract to hire opportunity in Chicago"
    # None names "employment type", all three say full-time. Contract-to-hire
    # ends in a permanent full-time job by design.
    - name: "type: full-time"
      pattern: '\btype\s*:\s*full[- ]?time\b'
    - name: "full-time contract work"
      pattern: '\bfull[- ]?time\s*(?:&|and|/|\+)\s*(?:long[- ]term\s*)?contract'
    - name: "to work full-time"
      pattern: '\b(?:work|working|available|availability)\s+full[- ]?time\b'
    - name: "contract to hire"
      pattern: '\bcontract[- ]to[- ](?:hire|perm)'
  unconfirmed_policy: manual_check

extra_signals:
  # Axes this search needs and the shared rubric does not have
  # (score._score_extra_signals). Substring matching: no short words.

  - name: interesting_work
    label: "interesting work"
    # A small plus, capped low on purpose: interest must never lift a badly
    # paid vacancy over a well paid one. The owner, 2026-09-13: crypto, AI,
    # microservices and complex technology first.
    points_per_keyword: 2
    cap: 8
    keywords:
      - "blockchain"
      - "web3"
      - "crypto"
      # Never a bare "defi": it is inside "defining", "definitely" and
      # "deficit". Seen on the first run, where G2i collected "interesting
      # work: defi" for "defining engineering standards". The same trap as
      # "LESS" in "no less than" (docs/TECH_MATCHING.md).
      - " defi "
      - " defi,"
      - "(defi"
      - "decentralized finance"
      - "ethereum"
      - "solana"
      - "bitcoin"
      - "stablecoin"
      - "on-chain"
      - "onchain"
      - "tokenization"
      - "large language model"
      # Not a bare "llm", which is inside "enrollment".
      - " llm "
      - " llms"
      - " llm-"
      - "(llm"
      - "generative ai"
      - "genai"
      - "agentic"
      - "ai agents"
      - "retrieval-augmented"
      - "openai"
      # Not a bare "anthropic", which is inside "philanthropic".
      - "anthropic api"
      - "claude code"
      - "semantic kernel"
      - "langchain"
      - "vector database"
      - "microservices"
      - "event sourcing"
      - "cqrs"
      - "event-driven"
      - "distributed systems"
      - "kafka"
      - "kubernetes"
      - "high-load"
      - "low latency"
      - "low-latency"
      - "real-time"
      - "grpc"
      - "domain-driven design"

  - name: fits_beside_a_job
    label: "fits beside a main job"
    points_per_keyword: 2
    negative_points_per_keyword: -4
    cap: 6
    floor: -12
    keywords:
      - "asynchronous"
      - "async-first"
      - "async first"
      - "flexible hours"
      - "flexible schedule"
      - "any time zone"
      - "project-based"
      - "milestone-based"
      - "few meetings"
      - "no meetings"
    negative_keywords:
      - "on-call"
      - "on call rotation"
      - "24/7"
      - "must be available during"
      - "core hours"
      - "daily standup"
      - "9am-5pm"
      - "9am to 5pm"
      - "immediate availability"
      - "exclusive commitment"

  - name: ai_training_gig
    label: "AI-training gig, not a product team"
    points_per_keyword: -6
    cap: 0
    floor: -6
    keywords:
      - "not a traditional software engineering role"
      - "project-based ai opportunities"
      - "agent evaluation"
      - "evaluating and improving ai"
      - "improving ai systems"
      - "ai training data"
      - "reinforcement learning environments"
      - "ai training project"
      - "ai trainer"
      - "ai tutor"
      - "help train and improve"
      - "training data for ai"
      - "improve ai models"
      - "no minimum time or task commitments"
      - "connects specialists with ai projects"
      - "rate ai responses"
      - "evaluate model responses"
      - "annotate training data"
      - "codebase q&a"
      # Added in V2 from the first run, where three G2i postings led the
      # shortlist — "This is not a traditional engineering role. You won't be
      # writing production code. You'll be evaluating ... coding agents" — and
      # 24-MAG and Anyone AI posted "developer" roles that grade benchmarks for
      # AI labs. The rate is real ($100-200 an hour), so this stays a visible
      # minus rather than a gate; the markers just have to recognise the genre.
      - "not a traditional engineering role"
      - "won't be writing production code"
      - "will not be writing production code"
      - "interaction evaluator"
      - "coding agent evaluator"
      - "ai code reviewer"
      - "evaluate the quality of interactions"
      - "project-based evaluations"
      - "evaluations with a leading ai lab"
      - "repository-level benchmarks"
      - "grading integrity"
      # V4: micro1's "Backend C#/.NET Developer" — "apply your expertise to
      # help train" an AI model.
      - "expertise to help train"

# Boards the person cannot apply through, whatever the vacancy: source name ->
# the reason, shown as the vacancy's dealbreaker. Every vacancy from such a
# board is rejected, including those already in the base; turning the board
# off in the sources file only stops new ones.
closed_sources:
  # 2026-10-04, the owner's feedback: applying needs a Singpass login, and
  # Singpass is for Singapore residents.
  mycareersfuture: "applying needs a Singpass login (Singapore residents only)"
