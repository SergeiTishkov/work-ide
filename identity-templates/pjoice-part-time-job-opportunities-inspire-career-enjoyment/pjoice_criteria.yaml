# A soft penalty for roles the person could do but is less likely to get. Not
# a gate: a question of probability rather than possibility.
title_role_penalty:
  rules:
    # Confirmed by the owner explicitly (2026-08-05): "a pure Frontend
    # Developer role I could do, but my experience is mostly full-stack and
    # they are unlikely to hire me." Removing such vacancies would be wrong —
    - pattern: "front[ -]?end"
      label: "pure frontend against full-stack experience"
      points: -8
      unless:
        - "full[ -]?stack"
        - "back[ -]?end"
        - '\.net'
        - 'c#'

role_relevance_signal:
  # TOTAL REJECTION (a dealbreaker), not merely a minus in points. Confirmed
  # by the owner explicitly (2026-07-30) on real findings: "CFO Controller"
  # and "Product Manager, Mapping and Weather Visualization" are NOT software
  # developer roles; a .NET/JS developer's chance at such a vacancy is 0%,
  # regardless of the legacy or enterprise words that may appear in the company
  # description. It fires on the vacancy TITLE: if the title matches a
  # profession from wrong_profession_title_patterns and matches NONE of the
  # developer_role_override_patterns, it is a dealbreaker.
  # tech_agnostic_override_keywords: if a company says outright "any stack is
  # fine" anywhere in the text, the stack, language and profession gates do not
  # apply (we trust the company's explicit statement).
  wrong_profession_title_patterns:
    - "\\bcfo\\b"
    - "chief financial officer"
    - "\\bcontroller\\b"
    - "\\baccountant\\b"
    - "bookkeeper"
    - "product manager"
    - "product owner"
    # Professions that until now were rejected BY ACCIDENT — for being onsite
    # or for geography rather than for what the role is. A real complaint from
    # the owner, 2026-08-05: "Sales Manager, Business Partner Analyst" in the
    # shortlist. Checking showed all of them rejected, but on location: make
    # such a vacancy remote and it would pass.
    #
    # Analytics and account management are not software development, whatever
    # the working arrangement. The wordings are precise rather than a generic
    # "analyst": "Analytics Engineer" is data engineering, which the person can
    # do (Spark and Databricks in the CV), and must not be cut.
    - "business analyst"
    - "business partner"
    - "compliance analyst"
    - "financial analyst"
    - "risk analyst"
    - "operations analyst"
    - "onboarding manager"
    - "onboarding specialist"
    - "outreach specialist"
    - "implementation specialist"
    - "data entry"
    - "data annotation"
    - "annotator"
    - "video generalist"
    - "content specialist"
    - "community specialist"
    - "success manager"
    - "partnerships manager"
    - "office administrator"
    - "project manager"
    - "delivery manager"
    - "scrum master"
    - "program manager"
    - "account executive"
    - "account manager"
    # A real finding, 2026-07-31: "Technical Account Manager 2 - South Africa"
    # at Datadog — a client-facing role, not development. The title has neither
    # "engineer" nor "developer", so the soft list is enough.
    - "technical account manager"
    - "sales executive"
    - "sales manager"
    - "business development"
    - "customer support"
    - "customer service"
    - "support consultant"
    - "\\brecruiter\\b"
    - "talent acquisition"
    - "hr generalist"
    - "human resources"
    - "marketing manager"
    - "content writer"
    - "copywriter"
    - "office manager"
    - "administrative assistant"
    - "executive assistant"
    - "\\bwebmaster\\b"
    - "web administration"
    - "web administrator"
    - "network administrator"
    - "database administrator"
    - "country manager"
    - "commercial manager"
    - "solution sales"
    - "operations manager"
    # A real case found (2026-07-30, via the manual checklist): "Web Publisher
    # Half time US Timezone" — CMS, Figma and content work rather than
    # programming, which passed the filter only because HTML/CSS were mentioned
    # (too generic and weak a stack signal on its own).
    - "web publisher"
    - "content editor"
    - "content management"
    - "cms administrator"
    - "\\bpublisher\\b"
  # The HARD level: these patterns are NOT lifted by developer_role_override
  # (unlike the list above). The reason is real findings, 2026-07-30 (the
  # manual checklist after new sources were connected): "GTM Operations
  # Process Architect" @ Stripe, "Partner Solutions Architect" @ Nebius,
  # Process Architect" and "Senior Manager, DevOps" at Modivcare. All of them
  # contain "architect", "engineer" or "devops" in the title, so the ordinary
  # override lifted the gate — although these are plainly not ordinary
  # developer roles (go-to-market operations, pre-sales architecture,
  # A DIFFERENT BRANCH OF ENGINEERING, not a different stack.
  #
  # Unlike hard_wrong_profession_title_patterns, these are cancelled when
  # the vacancy names the core stack: ".NET AppSec Engineer" is a .NET job
  # with an unusual title, and so is "Senior Software Engineer (WPF,
  # Firmware & Systems)". Measured 2026-08-12 — a blanket rule would have
  # thrown away five real ones to remove fifteen wrong ones.
  #
  # Found by the owner reading his own UK shortlist: "Senior Security
  # Engineer, Security Incident Response Team (SIRT)" @ GitLab. The soft
  # tier could not touch it because the bare word "engineer" counts as a
  # developer override.
  wrong_discipline_title_patterns:
    # security
    - "security engineer"
    - "security (analyst|operations|specialist|architect)"
    - "\\bsirt\\b|incident response"
    - "\\bappsec\\b|application security|penetration test"
    # data and analytics
    - "data engineer"
    - "analytics engineer"
    - "data scientist|data analyst"
    - "business intelligence|\\bbi developer\\b"
    # machine learning as a profession, not as a buzzword in a stack list
    - "\\b(ml|ai|machine learning)\\s+engineer\\b"
    - "research (scientist|engineer)"
    # hardware-adjacent
    - "embedded (software )?engineer|\\bfirmware\\b|\\bfpga\\b|\\blabview\\b"
    # customer-facing engineering
    - "forward deployed"
    - "(implementation|technical support|field) engineer"
  hard_wrong_profession_title_patterns:
    # Not a professional engagement at all. A board's "part-time" label covers
    # internships, working-student posts and teaching, and the first PJOICE run
    # put "Software Engineering Intern", "Werkstudent", a "Co-op" and an
    # "Online Visiting Professor" in the shortlist on the strength of it.
    - '\bintern\b'
    - '\binternship\b'
    - 'working student'
    - 'werkstudent'
    - '\bco-?op\b'
    - '\bapprentice'
    - '\btrainee\b'
    - '\bprofessor\b'
    - '\bfaculty\b'
    - '\blecturer\b'
    - '\binstructor\b'
    - '\bteaching assistant\b'
    # QA and testing are a separate profession. The word "engineer" in a title
    # lifted the soft gate, so they are here in the hard list. A real complaint
    # from the owner, 2026-08-05: "Senior QA Engineer @ Cortes 23 — rubbish".
    # The CV holds seven years of development and no testing role at all.
    - '\bqa\b'
    - "quality assurance"
    - "test engineer"
    - '\bsdet\b'
    - "engineer in test"
    - '\btester\b'
    - "test automation"
    # Mobile development is another profession too. React Native looks like
    # React, but there is not a day's experience of it, and competition for
    # remote mobile roles is high: the same zero chance.
    - "react native"
    - '\bios\b'
    - '\bandroid\b'
    - "mobile engineer"
    - "mobile developer"
    - "mobile application"
    - '\bflutter\b'
    - "\\bgtm\\b"
    - "go[- ]to[- ]market"
    - "operations process"
    - "process architect"
    - "solutions architect"
    - "solution architect"
    - "presales"
    - "pre-sales"
    - "sales engineer"
    # A real finding, 2026-07-31: "Principal Partner Solutions Engineer, SAARC
    # (Based in Bangalore)" at Cloudflare — pre-sales, while the list held only
    # "solutions architect".
    - "solutions engineer"
    - "solution engineer"
    - "customer engineer"
    - "customer success"
    - "\\bmanager,"
    - "senior manager"
    - "engineering manager"
    - "engineering leader"
    - "engineering leadership"
    - "leadership team"
    - "tech lead"
    - "\\bdirector\\b"
    - "\\bvp\\b"
    - "\\bhead of\\b"
    - "chief .* officer"
    # DevRel: "Developer Advocate" and "Developer Relations" mean public
    # speaking, articles and community work rather than software development.
    # A real finding, 2026-07-30: "Senior Developer Advocate - Data
    # Observability" at Datadog passed the gate on the word "Developer".
    - "developer advocate"
    - "developer relations"
    - "devrel"
    - "technical evangelist"
    - "community manager"
    # DevOps, SRE and infrastructure — confirmed by the owner explicitly
    # (2026-07-30): "throw out the devops, it is not my kind of vacancy". The
    # person is an applied .NET/JS developer, not an operations engineer. The
    # word "engineer" in a title used to lift the gate, so the patterns are
    # here in the hard list.
    - "devops"
    - "dev ops"
    - "\\bsre\\b"
    - "site reliability"
    - "infrastructure engineer"
    - "platform engineer"
    - "sysadmin"
    - "system administrator"
    - "systems administrator"
    - "cloud engineer"
    - "cloud infrastructure"
    - "cloud operations"
    - "release engineer"
    - "build engineer"
    # Design is not programming. A real finding, 2026-07-31: "Senior Graphic
    # Designer" at Lemon.io reached worth_a_look with score 27 (the stack was
    # counted from a marketing block, see stack_fit.noise_section_markers).
    # In the hard list because titles like "Design Engineer" are not an applied
    # developer role either.
    - "\\bdesigner\\b"
    - "graphic design"
    - "\\bux\\b"
    - "\\bui/ux\\b"
    - "product design"
    - "brand design"
    - "motion design"
    - "\\billustrator\\b"
  # The gate for "DevOps behind a neutral title". The lists above check the
  # TITLE; a real finding, 2026-07-31: "Software Engineer, Compute (8+ YOE)" at
  # Airtable — a neutral title, with the body entirely about a Kubernetes
  # platform (~70 clusters, a CNI plugin migration, operators, Terraform,
  # ArgoCD, SLOs). Score 45, second in the shortlist.
  #
  # A threshold is mandatory: one or two mentions of Kubernetes, Docker or
  # CI/CD are in almost every applied developer vacancy. Only a dense
  # concentration, meaning the role really is about operations, is cut.
    # Added 2026-08-12: the list had "\\bvp\\b" but "Vice President, Data
    # & Insights" spells it out, and "Sales Enablement | SDR" reached
    # long_shot at 22. Neither is an individual contributor role at any
    # stack.
    - "vice president"
    - "\\bsdr\\b|sales enablement|sales development|account executive"
    # "Solutions Consultant, Enterprise" @ Ramp reached long_shot at 21.
    # Deliberately NOT "technical consultant": ".Net Technical Consultant"
    # @ alfanar is a real .NET role, and the measurement found it before
    # this line was written.
    - "solutions? consultant|sales consultant"
  infrastructure_role_gate:
    threshold_hits: 4
    description_keywords:
