classification_thresholds:
  # ПЕРЕСМОТРЕНО 2026-07-30 (важное изменение логики).
  #
  # Пороги 65/45/25 достались с той эпохи, когда score был ЕДИНСТВЕННЫМ
  # фильтром — тогда высокий порог защищал от мусора. Сейчас фильтрацию
  # делают жёсткие гейты (стек, локация, язык, профессия, сложность роли):
  # всё непроходное уже отсеяно в "rejected". Для того, что ГЕЙТЫ ПРОПУСТИЛИ,
  # балл должен РАНЖИРОВАТЬ, а не выбрасывать.
  #
  # Найденная проблема (реальные данные): вакансии, прошедшие все гейты
  # (worldwide remote, JS/.NET стек, английский, роль разработчика) —
  # например "Staff Software Engineer (Magic Containers)" (18 баллов),
  # "Senior Vue Developer" (15), "Senior React Full-stack Developer" (15) —
  # не попадали в отчёт вообще. Обычная нормальная remote-вакансия без слов
  # "legacy"/"part-time"/явной вилки набирает всего ~15 баллов: бонусы
  # начисляются за скуку и низкую нагрузку, а их мало кто пишет в тексте.
  # В результате из 966 вакансий человеку показывалась 1 — при том что
  # ~50 реально прошли все проверки на пригодность.
  # ПЕРЕКАЛИБРОВАНО 2026-08-05 вместе с весами.
  #
  # Прежние 45/25/8 описывали другую шкалу: remote_location_fit весил 25 и
  # начислялся почти всем, кто прошёл гейты, то есть работал как постоянное
  # слагаемое и поднимал весь график. Когда география перестала весить, тот же
  # порог 45 стал отсекать всё: hot_lead осталось пять штук на 11 414 вакансий.
  #
  # Новые значения подобраны замером по реальной базе, а не на глаз:
  #   38 -> 21 кандидат в голове (0.18% базы) — столько человек прочитает;
  #   28 -> ещё 51;
  #   20 -> хвост 132 вместо 261: отсечены вакансии, у которых нет ни одного
  #         внятного признака кроме того, что они прошли гейты.
  # Подобрано замером по 572 вакансиям, прошедшим все гейты (2026-08-05,
  # после того как география перестала весить и шкала сжалась):
  #
  #   38 -> 24 кандидата в голове. Столько человек прочитает за кофе.
  #   28 -> ещё 38.
  #   10 -> хвост. Обычная вакансия, прошедшая ВСЕ гейты, но не сказавшая о
  #         себе ничего (нет стека в ядре, нет легаси, нет слов про нагрузку,
  #         нет вилки), набирает ровно 10. Она обязана быть видимой: гейты уже
  #         подтвердили, что откликнуться можно, а балл здесь ранжирует, а не
  #         фильтрует — решение 2026-07-30, и оно остаётся в силе.
  #
  # Длинный хвост ничего не стоит: разделы отчёта печатают по 15 записей и
  # сообщают, сколько осталось.
  hot_lead: 38
  worth_a_look: 28
  long_shot: 10
  # ниже long_shot -> low_priority
  # наличие hard dealbreaker keyword -> статус "rejected" независимо от очков

ai_training_crowdwork_gate:
  # Жанр, появившийся на бордах в 2024-2026: площадка нанимает разработчиков
  # не строить софт, а производить обучающие данные для моделей — писать
  # эталонные решения, размечать, оценивать ответы, собирать RL-окружения.
  # Заголовок при этом обычный: "Senior Software Engineer".
  #
  # Почему это гейт, а не штраф: сдельная работа без проекта, команды и
  # продукта — не то, ради чего человек ищет постоянное место. Замер
  # 2026-08-05: такие объявления заняли четыре из девяти верхних позиций,
  # включая первую, потому что перечисляют все языки сразу, пишут "no set
  # schedules" (читается как низкая нагрузка) и указывают почасовую ставку.
  #
  # Маркеры длинные и однозначные: одного достаточно для отсева, поэтому
  # каждый обязан быть таким, который добросовестная продуктовая компания о
  # себе не напишет. Короткие ("ai", "training") поймали бы половину рынка.
  keywords:
    - "not a traditional software engineering role"
    # Формулировки того же жанра, найденные 2026-08-05: та же площадка
    # вернулась под названием "Freelance Agent Evaluation Engineer" и с
    # переписанным текстом. Гейт, ловящий одну редакцию текста, ловит
    # редакцию, а не жанр.
    - "project-based ai opportunities"
    - "agent evaluation"
    - "evaluating and improving ai"
    - "testing, evaluating, and improving ai"
    - "improving ai systems"
    - "ai training data"
    - "reinforcement learning environments"
    - "ai training project"
    - "ai trainer"
    - "ai tutor"
    - "help train and improve"
    - "train and improve next-generation"
    - "training data for ai"
    - "improve ai models"
    - "ai model's ability"
    - "no minimum time or task commitments"
    - "no minimum time commitment"
    - "connects specialists with ai projects"
    - "rate ai responses"
    - "evaluate model responses"
    - "rate model responses"
    - "annotate training data"
    - "data labeling project"

mobile_role_gate:
  # Мобильная разработка за нейтральным заголовком. Реальная находка
  # 2026-08-05: "Lead Full-stack Developer (Full-Time Remote Contractor)" @
  # Khibraty — по описанию это существующее приложение на React Native и
  # Expo, вся работа внутри него. Гейт заголовка такое не видит, как не
  # видел DevOps за нейтральным заголовком до infrastructure_role_gate.
  #
  # Порог два: обычная веб-вакансия может упомянуть мобильное приложение
  # среди продуктов компании. Рекламные блоки кадровых агентств срезаются
  # тем же механизмом, что и в оценке стека — иначе перечень "React Native,
  # Flutter, ..." отправлял бы в отсев вообще всё от Lemon.io.
  #
  # Слова длинные: "expo" отброшено намеренно, оно является подстрокой
  # "exposure" и "export" (тот же класс ошибки, что "java" в "javascript").
  threshold_hits: 2
  keywords:
    - "react native"
    - "app store"
    - "google play"
    - "flutter"
    - "swiftui"
    - "xcode"
    - "testflight"
    - "ios and android"
    - "android and ios"
    - "mobile application"
    - "native app"
    - "mobile app"
