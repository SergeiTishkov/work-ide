# Рубрика скоринга вакансий. Читается tools/score.py.
# Итоговый score — 0..100, плюс отдельный список dealbreaker-флагов и
# needs_manual_review. Каждый компонент объясняется в score_breakdown.
#
# Философия: обычная система поиска работы штрафует за "legacy", "boring",
# "bureaucracy" — здесь всё наоборот. Мы намеренно ищем то, что отпугивает
# большинство кандидатов, потому что там ниже конкуренция и выше готовность
# платить за скучную стабильность.

# КАК УСТРОЕН ВЕС КОМПОНЕНТА
#
# Отдельного блока `weights` в этом файле НЕТ, и это осознанно. Он здесь был и
# не читался ни одной строкой кода: баллы всегда приходили из настроек самих
# компонентов, а `weights` был декларацией о намерениях, с которой реальность
# могла расходиться сколько угодно. Она и разошлась.
#
# Настоящий вес компонента — его ПОТОЛОК. Актуальные значения, от большего:
#
#   legacy_enterprise_signal.cap        25   устаревшие технологии = спокойствие
#   stack_fit.cap                       25   попадание в стек
#   low_intensity_signal.cap            25   прямые признаки низкой нагрузки
#   company_reputation_signal          ~24   отзывы, work-life balance
#   compensation_signal                ~15   деньги
#   remote_location_fit.worldwide       6    «могу ли я вообще откликнуться»
#   contractor_friendliness.cap         5
#
# ПЕРЕСМОТРЕНО 2026-08-05 по прямому указанию владельца: «стек, зарплата,
# признаки лёгкой работы — вот ключевые признаки. Целевые регионы — да всё
# равно вообще. Что мне даст регион? Важна не география, а сама работа».
#
# До этого remote_location_fit.worldwide_remote давал 25 — больше, чем стек
# (15) и деньги (10) вместе. Выдачу ранжировало то, ГДЕ вакансия, а не КАКАЯ.
#
# ВАЖНО и не менять: low_intensity_signal весит больше compensation_signal, и
# разброс у него шире. Это подтверждено человеком явно: «гарантированно
# скучную и лёгкую работу за меньшие деньги возьму, чем стрессовую за большие».

remote_location_fit:
  worldwide_remote:
    points: 6
    # Главный признак для подрядчика из третьей страны: компания готова
    # нанимать откуда угодно. Замер 2026-08-05: прежний список ловил всего 75
    # вакансий из 9527 — не потому, что таких мало, а потому что формулировок
    # у этой мысли много, а в списке было десять.
    #
    # Все фразы длиной от двух слов: короткие формы вроде "global" дают ложные
    # срабатывания на "global leader", "global team" и прочем маркетинге.
    keywords:
      - "remote worldwide"
      - "worldwide remote"
      - "remote - anywhere"
      - "remote anywhere"
      - "work from anywhere"
      - "hire anywhere"
      - "globally remote"
      - "international remote"
      - "remote (global)"
      - "anywhere in the world"
      - "anywhere in the globe"
      - "from any country"
      - "in any country"
      - "any location in the world"
      - "no location requirement"
      - "no geographic restriction"
      - "no geographical restriction"
      - "location independent"
      - "location agnostic"
      - "we hire globally"
      - "hiring globally"
      - "hire from anywhere"
      - "work from any location"
      - "fully distributed team"
      - "globally distributed team"
      - "distributed worldwide"
      - "team across the globe"
      - "any time zone"
      - "any timezone"
      - "timezone agnostic"
      - "regardless of location"
      - "wherever you are"
      - "wherever you live"
      - "live anywhere"
      - "100% remote worldwide"
      - "remote first company"
      - "remote-first company"
  eor_or_contractor_international:
    points: 8
    keywords: []  # заполняется из profile.yaml eor_platforms_signal + слова contractor/1099/freelance
  acceptable_region_signal:
    # Регионы, которые ИМЕННО ЭТОТ человек считает особенно вероятными —
    # обычно из-за уже имеющегося опыта работы с компаниями оттуда или связей.
    # Это личное знание, поэтому шаблон список не задаёт: заполняется в
    # локальной идентичности.
    #
    # ВАЖНО, и на этом проект уже обжигался: сюда идёт "компания НАХОДИТСЯ в
    # регионе X", а не "нужно резидентство в X". Формулировки вида
    # "EU Remote" означают требование резидентства и место им в
    # restrictive_region_signal ниже, а не здесь.
    #
    # Основной механизм целевых рынков — не этот список, а target_markets в
    # профиле поверх config/derivation/market_tiers.yaml.
    # 0 БАЛЛОВ. Владелец 2026-08-05: "целевой регион — да пофиг, что мне
    # даст регион?". Компонент оставлен, чтобы не ломать структуру и чтобы
    # идентичность, которой география ВАЖНА (например, поиск именно в
    # Германии), могла им воспользоваться.
    points: 0
    keywords: []
  restrictive_region_signal:
    # ЖЁСТКОЕ требование резидентства/присутствия в конкретном регионе,
    # который не совпадает с резидентством человека — это ПОЛНЫЙ ОТСЕВ, а не
    # просто "ниже приоритет" (подтверждено человеком явно дважды,
    # 2026-07-30: сначала на примере "remote LATAM", затем на примере
    # "(EU Remote)" в реальной найденной вакансии — обе физически
    # недоступны из третьей страны). Список заведомо не исчерпывающий
    # (регионов бесконечно много) — needs_manual_review и собственное
    # чтение агентом остаются последней линией защиты для того, что список
    # не поймал. Если ОДНОВРЕМЕННО есть worldwide/EOR-сигнал — не считаем
    # dealbreaker (скорее всего, компания гибче, чем формулировка одного
    # requisition).
    keywords:
      - "remote (us)"
      - "remote - us"
      - "us remote only"
      - "us only"
      - "must be located in the united states"
      - "must reside in the us"
      - "must be based in the us"
      - "remote latam"
      - "latam only"
      - "latin america only"
      - "based in latin america"
      - "candidates based in latin america"
      - "remote based in latin america"
      - "must be based in latin america"
      - "based in the united states"
      - "candidates based in the us"
      - "based in europe"
      - "candidates based in europe"
      - "remote apac"
      - "apac only"
      - "asia pacific only"
      - "remote (uk)"
      - "uk only"
      - "must be based in the uk"
      - "must be located in the uk"
      - "canada only"
      - "must be based in canada"
      - "must reside in canada"
      - "india only"
      - "must be based in india"
      - "philippines only"
      - "eastern europe only"
      - "western europe only"
      - "nordics only"
      - "dach only"
      - "benelux only"
      - "australia and new zealand only"
      - "anz only"
      - "mexico only"
      - "must be based in mexico"
      - "eu remote"
      - "remote (eu)"
      - "remote europe"
      - "eu only"
      - "europe only"
      - "must be based in the eu"
      - "must be based in israel"
      - "israel only"
      - "must be based in uae"
      - "uae only"
    # Формулировки, которые НЕ перебиваются маркетинговым "worldwide".
    #
    # Реальная находка 2026-08-05 (ручной чек-лист): вакансия Azumo пришла с
    # WeWorkRemotely с полем region "Anywhere in the World", а в тексте стояло
    # "The position is fully remote based in Latin America. We will only be
    # considering candidates based in Latin America". Прежняя логика снимала
    # ограничение, если где-то в тексте нашлось слово про worldwide — и
    # обобщённая подпись площадки перебила прямое слово работодателя.
    #
    # Тот же принцип, что с заголовком Headquarters: когда работодатель прямо
    # называет требование, площадочная подпись значения не имеет.
    absolute_residency_phrases:
      - "only be considering candidates based in"
      - "only considering candidates based in"
      - "only accept candidates based in"
      - "candidates must be based in"
      - "must be based in"
      - "must reside in"
      - "must be a resident of"
      - "residency in"
      - "you must live in"
      - "applicants must be based in"
      - "we can only hire in"
      - "we can only employ"
      - "eligible to work in"
      - "authorized to work in"
      - "authorised to work in"
      - "work authorization in"

  net_exporter_penalty:
    # Единственное место, где география влияет на балл.
    #
    # Владелец 2026-08-05: "есть понятие НЕцелевого региона — Индия, Пакистан,
    # Филиппины, им минус. Даже в Индии можно что-нибудь было бы найти, просто
    # там большинство вакансий будет не в моём стиле".
    #
    # Поэтому штраф, а не отсев: вакансия оттуда должна быть лучше по существу,
    # чтобы попасть наверх. Список стран — общий, из ярусов exporter_avoid и
    # excluded_practical в config/derivation/market_tiers.yaml: направление
    # потока работы описывает рынок, а не человека.
    points: -12
  hard_dealbreakers:
    points: -1000  # эффективно исключает вакансию из "hot" категорий
    keywords:
      - "must relocate"
      - "on-site required"
      - "in-office"
      - "hybrid required"
      # Гибрид и работа из офиса. Найдено 2026-08-05 чтением выдачи: восемь
      # вакансий с "Hybrid Position", "hybrid working model" и "(WFO)" —
      # Work From Office. Прежний список содержал "hybrid required", а так
      # почти никто не пишет.
      - "hybrid position"
      - "hybrid role"
      - "hybrid working model"
      - "hybrid work model"
      - "hybrid setup"
      - "hybrid model"
      - "work from office"
      - "(wfo)"
      - "office-based role"
      - "days in the office"
      - "days from the office"
      - "security clearance"
      - "us citizen required"
      - "us citizenship required"
      - "must be a us citizen"
      - "eu citizenship required"
      - "must be eu resident"
      - "eu work permit required"
      - "israeli citizenship required"
      - "uae residency required"
      # Реальный найденный баг (2026-07-30): вакансия Rangeview буквально
      # писала "ONSITE" (без "required") и "ITAR: must be a U.S. person" -
      # ни то, ни другое не ловилось прежним списком.
      - "onsite"
      - "on-site"
      - "on site"
      - "in office"
      - "in-person"
      - "must work from our office"
      - "office-based"
      - "office based"
      - "no remote work"
      - "not a remote"
      - "itar"
      - "must be a u.s. person"
      - "u.s. person required"
      - "united states person required"
  structured_location_gate:
    # Формулировки, при которых поле локации означает "и только здесь".
    # Перебивают правило целевого рынка: "United States only" содержит
    # "United States", то есть целевой рынок, и без этой проверки вакансия
    # проходила бы (реальная находка 2026-08-05).
    exclusivity_markers:
      - " only"
      - "only)"
      - "-only"
      - "residents only"
      - "citizens only"
    # КРИТИЧНО (реальный найденный баг, 2026-07-30): многие источники отдают
    # гео-ограничение СТРУКТУРНЫМ полем (WWR region, Remotive
    # candidate_required_location, Jobicy jobGeo, Himalayas
    # locationRestrictions), а не фразой в тексте. Раньше проверялся только
    # текст, поэтому вакансии с location_raw = "USA" / "Canada only" /
    # "Brazil" / "Costa Rica" / "Texas" спокойно проходили фильтр — ~20 из
    # 32 кандидатов оказались недоступны человеку по гео.
    #
    # Логика: если поле локации заполнено и НЕ содержит явного маркера
    # "весь мир" — это гео-ограничение, то есть dealbreaker (кроме случая,
    # когда одновременно есть worldwide/EOR-сигнал в тексте, который это
    # перевешивает).
    worldwide_markers:
      - "anywhere"
      - "worldwide"
      - "world wide"
      - "global"
      - "globally"
      - "remote (global)"
      - "no restriction"
      - "any location"
      - "any country"
    # Перечисление континентов (Remotive: "Americas, Europe, Asia, Africa,
    # Oceania") — фактически "весь мир", хотя слова "worldwide" там нет.
    # Если в поле локации упомянуто >= continent_threshold континентов,
    # считаем это отсутствием ограничения.
    continent_names:
      - "americas"
      - "north america"
      - "south america"
      - "europe"
      - "asia"
      - "africa"
      - "oceania"
      - "emea"
      - "apac"
      - "latam"
    continent_threshold: 3
    # Значения локации, которые означают просто "удалённо", БЕЗ указания
    # страны — это не гео-ограничение. Реальный найденный баг (2026-07-31,
    # после подключения ATS): Greenhouse/Ashby пишут "Remote job" (209
    # вакансий), GitLab — "Distributed" (39, так они обозначают all-remote
    # компанию), и всё это резалось как "источник ограничивает найм".
    # Если после вычёркивания этих слов от значения ничего не остаётся —
    # ограничения нет, дальше работает обычная логика (неизвестная
    # локация -> needs_manual_review, а не отказ).
    remote_without_country_tokens:
      - "remote"
      - "job"
      - "jobs"
      - "distributed"
      - "telecommute"
      - "work from home"
      - "wfh"
      - "flexible"
      - "n/a"
      - "na"
      - "-"

  header_scope_gate:
    # Реальный найденный баг 2026-07-31 (ручной чек-лист, два кандидата из
    # топа выдачи): Stripe и Airtable пришли с WWR с region-полем "Anywhere
    # in the World", а в первой строке описания стояло "Headquarters: US
    # Remote" и "Headquarters: … ; Remote - US" соответственно. Обе — только
    # для резидентов США, обе были в hot_lead.
    #
    # Причина расхождения: WWR-фиды категорийные ("Programming"), их region
    # заполняется размашисто; строку Headquarters пишет сам работодатель.
    # Поэтому при конфликте верим заголовку работодателя.
    #
    # Смотрим ТОЛЬКО заголовочные строки: фраза "our US remote team" в теле
    # описания — рассказ о компании, а не требование к кандидату.
    scan_first_lines: 6
    header_line_patterns:
      - "^headquarters\\s*:"
      - "^location\\s*:"
      - "^hiring in\\s*:"
    # Ограничение — только связка "remote + страна/регион". Просто
    # "Headquarters: Saudi Arabia" ограничением НЕ является: это адрес
    # компании, а не заявление о том, где она нанимает.
    # Выводится из config/derivation/regions.yaml (residency_required_phrases
    # тех регионов, где человек не резидент).
    restriction_patterns:
      - "remote\\s*[-–—/(,]*\\s*(us|usa|u\\.s\\.|united states|america)\\b"
      - "\\b(us|usa|u\\.s\\.|united states)\\s*[-–—/(,]*\\s*remote\\b"
      - "remote\\s*[-–—/(,]*\\s*(eu|europe|european union)\\b"
      - "\\b(eu|europe|european union)\\s*[-–—/(,]*\\s*remote\\b"
      - "remote\\s*[-–—/(,]*\\s*(uk|united kingdom|canada|latam|apac|india)\\b"
      - "\\b(uk|united kingdom|canada|latam|apac|india)\\s*[-–—/(,]*\\s*remote\\b"

  timezone_gate:
    # Требование к часовому поясу — отдельная ось от страны, и раньше не
    # проверялась ничем. Реальный случай 2026-07-31: пять вакансий Proxify
    # содержат "Located in CET timezone (+/- 3 hours), we are unable to
    # consider applications from candidates in other time zones". Человек
    # часовой пояс кандидата в это окно попадал, но узнали мы это чтением
    # глазами, а не проверкой.
    #
    # Разбирается только явная форма "<TZ> +/- N часов". Вольные
    # формулировки ("significant overlap with PST") дают needs_manual_review,
    # а не отказ: скрыть настоящую вакансию хуже, чем показать сомнительную.
    exclusive_phrases:
      - "unable to consider applications from candidates in other time zones"
      - "candidates in other time zones"
      - "must be located in"
      - "must be based in the"
      - "only considering candidates in"
      - "required to work in the"
    zone_offsets:
      utc: 0
      gmt: 0
      wet: 0
      cet: 1
      cest: 2
      eet: 2
      eest: 3
      msk: 3
      gst: 4
      ist: 5
      sgt: 8
      jst: 9
      aest: 10
      est: -5
      edt: -4
      cst: -6
      cdt: -5
      mst: -7
      mdt: -6
      pst: -8
      pdt: -7
      pacific: -8
      eastern: -5
      central: -6
      mountain: -7

  # Подтверждено человеком явно (2026-07-30): "мне нужны ТОЛЬКО РЕМОУТ
  # позиции" - по умолчанию вакансия должна быть ПОДТВЕРЖДЕНА как remote,
  # иначе это dealbreaker, а не просто "неизвестно, но пусть будет". Раньше
  # отсутствие сигнала о локации давало лишь мягкое needs_manual_review;
  # теперь оно ведёт к отклонению, если нет НИ явного worldwide/EOR/region
  # сигнала, НИ хотя бы намёка на remote в тексте, НИ флага remote=true от
  # источника.
  remote_synonym_keywords:
    - "remote"
    - "work from home"
    - "distributed team"
    - "distributed workforce"
    - "remote-first"
    - "wfh"
    - "home-based"
    - "telecommute"
    - "telework"
    - "work remotely"
  # ==== IDENTITY TUNING ====
  # Неоднозначные топонимы: одно название — два разных места. На очки не
  # влияет, но выставляет needs_manual_review, чтобы человек проверил глазами.
  #
  # Помечается, только если сработал контекст ОБОИХ значений или НИ ОДНОГО.
  # Одно ясное значение — не повод дёргать человека.
  #
  # Для этой идентичности правило ровно одно и оно критично: человек живёт в
  # Заготовки для других частых ловушек — в config/derivation/ambiguous_places.yaml.
  # Список выводится из РЕЗИДЕНТСТВА и потому пуст в шаблоне: ловушка
  # "Georgia" (страна против штата США) существует для того, кто живёт в
  # одноимённой стране, и не существует для всех остальных. Заготовки —
  # config/derivation/ambiguous_places.yaml; в локальную идентичность
  # переносятся те, что относятся к её человеку.
  ambiguous_place_names: []

stack_fit:
  # ==== IDENTITY TUNING ====
  # Как называть стек этой идентичности в сообщениях об отказе. Появляется в
  # поле dealbreakers, которое читает человек, поэтому пишется по-человечески.
  stack_label: ".NET/JS"

  # Веса намеренно отражают РЕАЛЬНУЮ частоту технологий в CV человека (см.
  # profile.yaml → tech_stack), а не общее "это тоже .NET-совместимо".
  # core — встречается почти в каждой роли за 7+ лет; strong — регулярно, но
  # не всегда; familiar — было в 1-2 ролях. Подтверждено человеком явно
  # (2026-07-30): технологии, с которыми реально работал чаще, должны
  # весить больше тех, с которыми пересекался мало.
  points_per_core_keyword: 3
  points_per_strong_keyword: 2
  points_per_familiar_keyword: 1
  cap: 25
  # Потолок для случая, когда ни одна технология ЯДРА не названа. Замер
  # 2026-08-05: вакансия на чистом C#/ASP.NET получала за стек 7 баллов, а
  # объявление агентства, перечислившее TypeScript, JavaScript, React, HTML и
  # CSS, — 14. Балл за каждое совпадение вознаграждает длину перечня, а не
  # попадание в стек, и раз за разом поднимает наверх тех, кто перечисляет
  # технологии списком. Профильный стек обязан выигрывать у широкого.
  cap_when_no_core: 8

  # "Стековый спам": блоки, перечисляющие все технологии мира ради попадания
  # в любой поиск. Реальный найденный случай 2026-07-31: у Lemon.io в конце
  # КАЖДОГО объявления идёт абзац "NOT YOUR TECH STACK?" со списком ~60
  # технологий, включая ".NET & C#" и Angular. Из-за него их "Senior Graphic
  # Designer" получал core_hits ["C#", "Angular"], максимальные 15 баллов за
  # стек и проходил гейт релевантности. Текст отрезается по маркеру ТОЛЬКО
  # для оценки стека — гео и язык по-прежнему читают описание целиком
  # (в этом же блоке у Lemon.io перечислены страны найма).
  noise_section_markers:
    - "NOT YOUR TECH STACK?"
    - "We have a variety of projects, so if you have"
    - "we would be happy to connect with you and match you with a project"
  # ключевые слова стека берутся из profile.yaml tech_stack.core/.strong/.familiar
  #
  # Гейт релевантности (см. score.py → score_vacancy): вакансия допускается
  # дальше только если есть хотя бы одно core ИЛИ strong совпадение — одного
  # familiar-совпадения недостаточно (иначе, например, случайное совпадение
  # "LESS" с обычным английским словом "less" в финансовой вакансии проходит
  # фильтр — реальный найденный баг, 2026-07-30).
  #
  # ИСКЛЮЧЕНИЕ (подтверждено человеком явно, 2026-07-30): Java/Scala сами
  # по себе НЕ считаются релевантными (Java web-разработка — не то, на что
  # человек может рассчитывать), НО Java/Scala В КОНТЕКСТЕ дата-пайплайнов
  # (Spark/Databricks/ETL — реальный опыт, предыдущего места работы) —
  # приемлемый, желанный вариант. Поэтому: Java/Scala + хотя бы одно слово
  # из data_pipeline_context_keywords тоже проходит гейт релевантности.
  # Гейт основного языка (подтверждено человеком явно, 2026-07-30: "не
  # дотнет/js ... — выкинуть"). Общие инфраструктурные технологии (Docker,
  # Azure, HTML, CSS, микросервисы) встречаются практически в любой
  # вакансии и НЕ являются доказательством, что роль подходит .NET/JS
  # разработчику. Реальная находка: две вакансии Canonical (embedded/Linux
  # systems engineering) прошли гейт только по слову "Docker".
  #
  # Требование: в тексте должен встретиться хотя бы один НАСТОЯЩИЙ язык/
  # фреймворк из стека человека, а не только инфраструктурное слово.
  primary_language_keywords:
    - ".NET"
    - "VB.NET"        # роль .NET-семейства; в ЯДРО НАВЫКОВ не входит (нет в CV)
    - ".NET Core"
    - ".NET Framework"
    - "C#"
    - "ASP.NET"
    - "ASP.NET MVC"
    - "ASP.NET Core"
    - "ASP.NET Web API"
    - "Entity Framework"
    - "EF Core"
    - "EF6"
    - "JavaScript"
    - "TypeScript"
    - "Angular"
    - "AngularJS"
    - "React"
    - "Node.js"
    - "jQuery"
  data_pipeline_language_keywords:
    - "java"
    - "scala"
  data_pipeline_context_keywords:
    - "apache spark"
    - "spark"
    - "databricks"
    - "delta lake"
    - "data pipeline"
    - "data engineer"
    - "etl"
    - "big data"

role_complexity_signal:
  # Подтверждено человеком явно (2026-07-30) на реальных находках:
  # "Principal Machine Learning Scientist", "Staff Software Engineer,
  # Agentic Platform" — это НЕ простая работа на 2-4ч/день, даже если в
  # описании компании мелькают "enterprise"/"banking" как рынок сбыта.
  # Это отдельная ось от legacy_enterprise_signal: одно дело — легаси
  # поддержка в банке, совсем другое — R&D/новая архитектура с нуля в
  # той же компании. При срабатывании гейта классификация не может
  # подняться выше low_priority, независимо от остальных компонентов
  # (тот же механизм, что stack_fit gate в score.py).
  #
  # Совпадение в TITLE вакансии — гейтит сразу (1 попадание достаточно).
  title_red_flag_patterns:
    - "principal.*scientist"
    - "staff.*scientist"
    - "principal.*research"
    - "staff.*research"
    - "research scientist"
    - "applied scientist"
    - "machine learning scientist"
    - "machine learning engineer"
    - "\\bml engineer\\b"
    - "data scientist"
    - "founding engineer"
    - "head of ai"
    - "director of ai"
    - "chief ai officer"
    - "agentic"
    - "llm engineer"
    - "ai engineer"
    - "artificial intelligence engineer"
    - "genai engineer"
  # Совпадения в описании — нужно минимум threshold_hits штук (одно случайное
  # модное словечко в бойлерплейте не должно гейтить нормальную легаси-роль).
  description_red_flag_keywords:
    - "build from scratch"
    - "greenfield"
    - "0 to 1"
    - "0->1"
    - "own the technical vision"
    - "own the entire architecture"
    - "cutting-edge"
    - "cutting edge"
    - "state-of-the-art"
    - "state of the art"
    - "novel algorithms"
    - "publish papers"
    - "phd preferred"
    - "phd required"
    - "research new methods"
    - "large-scale distributed systems"
    - "hyperscale"
  threshold_hits: 2
  # Реальный найденный случай (2026-07-30, через ручной чек-лист —
  # docs/VACANCY_CHECKLIST.md): "Staff/Senior Software Engineer (AI CICD)"
  # @ Chainguard — venture-backed стартап, строящий "agentic AI" продукты
  # с нуля ("Extend Chainguard's agentic AI foundation..."). "Agentic"/
  # "LLM systems"/"GenAI" — однозначные, недвусмысленные сигналы
  # AI/R&D-фокуса; одного упоминания достаточно, порог threshold_hits для
  # них не нужен (в отличие от более расплывчатых "cutting-edge" и т.п.,
  # которые могут быть маркетинговым бойлерплейтом).
  description_red_flag_keywords_strong_single_hit:
    - "agentic"
    - "agentic ai"
    - "llm systems"
    - "genai"

# Гейт «заголовок называет чужой стек».
#
# Реальная находка 2026-08-04, замеченная человеком прямо в готовой выдаче:
# "Senior Ruby on Rails Developer", "Senior Fullstack Developer (Python)" и
# "Senior Vue Developer" прошли фильтр стека. Механизм протечки: гейт
# релевантности искал знакомый язык ПО ВСЕМУ тексту, а в Rails-вакансии
# мимоходом перечислены HTML/CSS/JavaScript как смежные навыки. Формально
# совпадение есть — фактически роль совсем про другое.
#
# Правило: роль определяет ЗАГОЛОВОК. Если он называет технологию, которой
# нет в core/strong (familiar недостаточно — это «трогал пару раз за карьеру»),
# вакансия отсекается независимо от того, что упомянуто в теле.
title_stack_gate:
  # Технологии, которые в заголовке ОПРЕДЕЛЯЮТ роль. Список не про то, что
  # человек знает, а про то, какие слова в заголовке вообще задают стек —
  # поэтому он одинаков для всех идентичностей.
  role_defining_technologies:
    - ruby on rails
    - ruby
    - rails
    - vue
    - nuxt
    - svelte
    - python
    - django
    - flask
    - fastapi
    - php
    - laravel
    - symfony
    - golang
    - rust
    - elixir
    - phoenix
    - scala
    - java
    - golang
    - c++
    - spring boot
    - kotlin
    - swift
    - objective-c
    - flutter
    - dart
    - unity
    - unreal
    - wordpress
    - drupal
    - shopify
    - salesforce
    - servicenow
    - workday
    - sap
    - abap
    - cobol
    - delphi
    - perl
    - haskell
    - clojure
    - magento
    - umbraco
    - sitecore

# Мягкий штраф за роли, которые человек закрыть может, но шансы получить
# меньше. Не гейт: вопрос вероятности, а не возможности.
title_role_penalty:
  rules:
    # Подтверждено человеком явно (2026-08-05): «чистый Frontend Developer я
    # закрою, но опыт в основном фуллстек, там меня вряд ли наймут». Удалять
    # такие вакансии неправильно — понижаем.
    - pattern: "front[ -]?end"
      label: "чистый фронтенд при фуллстек-опыте"
      points: -8
      unless:
        - "full[ -]?stack"
        - "back[ -]?end"
        - '\.net'
        - 'c#'

role_relevance_signal:
  # ПОЛНЫЙ ОТСЕВ (dealbreaker), не просто минус в баллах. Подтверждено
  # человеком явно (2026-07-30) на реальных находках: "CFO Controller",
  # "Product Manager, Mapping and Weather Visualization" — это НЕ роли
  # разработчика ПО, шанс попасть на такую вакансию для .NET/JS-разработчика
  # 0%, независимо от того, что в описании компании могут мелькать
  # legacy/enterprise-слова. Срабатывает по НАЗВАНИЮ вакансии: если
  # заголовок matches профессию из wrong_profession_title_patterns и НЕ
  # matches ни одного developer_role_override_patterns — dealbreaker.
  # tech_agnostic_override_keywords — если компания явно говорит "любой
  # стек ОК" где-то в тексте, гейт стека/языка/профессии не применяется
  # (доверяем явному заявлению компании).
  wrong_profession_title_patterns:
    - "\\bcfo\\b"
    - "chief financial officer"
    - "\\bcontroller\\b"
    - "\\baccountant\\b"
    - "bookkeeper"
    - "product manager"
    - "product owner"
    # Профессии, которые до сих пор отсеивались СЛУЧАЙНО — за офис или гео, а
    # не за суть роли. Реальная жалоба человека 2026-08-05: «Sales Manager,
    # Business Partner Analyst» в выдаче. Проверка показала, что все они
    # действительно отклонены, но по location: сделай такую вакансию удалённой
    # — и она бы прошла.
    #
    # Аналитика и сопровождение клиентов — не разработка ПО, независимо от
    # формата работы. Формулировки точные, а не общее слово "analyst":
    # "Analytics Engineer" — это дата-инженерия, которую человек как раз умеет
    # (Spark/Databricks в CV), и отсекать её нельзя.
    - "business analyst"
    - "business partner"
    - "compliance analyst"
    - "financial analyst"
    - "risk analyst"
    - "operations analyst"
    - "onboarding manager"
    - "onboarding specialist"
    - "outreach specialist"
    - "implementation specialist"
    - "data entry"
    - "data annotation"
    - "annotator"
    - "video generalist"
    - "content specialist"
    - "community specialist"
    - "success manager"
    - "partnerships manager"
    - "office administrator"
    - "project manager"
    - "delivery manager"
    - "scrum master"
    - "program manager"
    - "account executive"
    - "account manager"
    # Реальная находка 2026-07-31: "Technical Account Manager 2 - South
    # Africa" @ Datadog — клиентская роль, не разработка. В заголовке нет
    # ни "engineer", ни "developer", поэтому мягкого списка достаточно.
    - "technical account manager"
    - "sales executive"
    - "sales manager"
    - "business development"
    - "customer support"
    - "customer service"
    - "support consultant"
    - "\\brecruiter\\b"
    - "talent acquisition"
    - "hr generalist"
    - "human resources"
    - "marketing manager"
    - "content writer"
    - "copywriter"
    - "office manager"
    - "administrative assistant"
    - "executive assistant"
    - "\\bwebmaster\\b"
    - "web administration"
    - "web administrator"
    - "network administrator"
    - "database administrator"
    - "country manager"
    - "commercial manager"
    - "solution sales"
    - "operations manager"
    # Реальный найденный случай (2026-07-30, найдено ручным чек-листом):
    # "Web Publisher Half time US Timezone" - работа с CMS/Figma/контентом
    # (не программирование), прошла фильтр только из-за упоминания
    # HTML/CSS (слишком общий, слабый сигнал стека сам по себе).
    - "web publisher"
    - "content editor"
    - "content management"
    - "cms administrator"
    - "\\bpublisher\\b"
  # ЖЁСТКИЙ уровень: эти паттерны НЕ снимаются developer_role_override
  # (в отличие от списка выше). Причина — реальные находки 2026-07-30
  # (ручной чек-лист после подключения новых источников): "GTM Operations
  # Process Architect" @ Stripe, "Partner Solutions Architect" @ Nebius,
  # "Senior Manager, DevOps" @ Modivcare. Все они содержат
  # "architect"/"engineer"/"devops" в заголовке, из-за чего обычный
  # override снимал гейт — хотя это заведомо не роли рядового разработчика
  # (go-to-market операции, пресейл-архитектура, менеджмент людей).
  hard_wrong_profession_title_patterns:
    # QA и тестирование — отдельная профессия. Слово "engineer" в заголовке
    # снимало мягкий гейт, поэтому здесь, в жёстком списке. Реальная жалоба
    # человека 2026-08-05: "Senior QA Engineer @ Cortes 23 - мусор". В CV
    # семь лет разработки и ни одной роли в тестировании.
    - '\bqa\b'
    - "quality assurance"
    - "test engineer"
    - '\bsdet\b'
    - "engineer in test"
    - '\btester\b'
    - "test automation"
    # Мобильная разработка — тоже другая профессия. React Native выглядит
    # похоже на React, но опыта нет ни одного дня, а конкуренция на удалённые
    # мобильные роли высокая: шанс тот же нулевой.
    - "react native"
    - '\bios\b'
    - '\bandroid\b'
    - "mobile engineer"
    - "mobile developer"
    - "mobile application"
    - '\bflutter\b'
    - "\\bgtm\\b"
    - "go[- ]to[- ]market"
    - "operations process"
    - "process architect"
    - "solutions architect"
    - "solution architect"
    - "presales"
    - "pre-sales"
    - "sales engineer"
    # Реальная находка 2026-07-31: "Principal Partner Solutions
    # Engineer, SAARC (Based in Bangalore)" @ Cloudflare — пресейл,
    # в списке был только "solutions architect".
    - "solutions engineer"
    - "solution engineer"
    - "customer engineer"
    - "customer success"
    - "\\bmanager,"
    - "senior manager"
    - "engineering manager"
    - "engineering leader"
    - "engineering leadership"
    - "leadership team"
    - "tech lead"
    - "\\bdirector\\b"
    - "\\bvp\\b"
    - "\\bhead of\\b"
    - "chief .* officer"
    # DevRel: "Developer Advocate"/"Developer Relations" — публичные
    # выступления, статьи, работа с сообществом, а не разработка ПО.
    # Реальная находка 2026-07-30: "Senior Developer Advocate - Data
    # Observability" @ Datadog прошла гейт из-за слова "Developer".
    - "developer advocate"
    - "developer relations"
    - "devrel"
    - "technical evangelist"
    - "community manager"
    # DevOps/SRE/инфраструктура — подтверждено человеком явно
    # (2026-07-30): "выкинь девопсов, это не моя вакансия". Человек —
    # прикладной .NET/JS разработчик, а не инженер эксплуатации. Слово
    # "engineer" в заголовке раньше снимало гейт, поэтому паттерны здесь,
    # в жёстком списке.
    - "devops"
    - "dev ops"
    - "\\bsre\\b"
    - "site reliability"
    - "infrastructure engineer"
    - "platform engineer"
    - "sysadmin"
    - "system administrator"
    - "systems administrator"
    - "cloud engineer"
    - "cloud infrastructure"
    - "cloud operations"
    - "release engineer"
    - "build engineer"
    # Дизайн — не программирование. Реальная находка 2026-07-31: "Senior
    # Graphic Designer" @ Lemon.io попала в worth_a_look со score 27 (стек
    # засчитался из рекламного блока, см. stack_fit.noise_section_markers).
    # В жёстком списке, потому что заголовки вида "Design Engineer" тоже не
    # являются ролью прикладного разработчика.
    - "\\bdesigner\\b"
    - "graphic design"
    - "\\bux\\b"
    - "\\bui/ux\\b"
    - "product design"
    - "brand design"
    - "motion design"
    - "\\billustrator\\b"
  # Гейт "DevOps под нейтральным заголовком". Списки выше проверяют ЗАГОЛОВОК;
  # реальная находка 2026-07-31 — "Software Engineer, Compute (8+ YOE)" @
  # Airtable: заголовок нейтральный, тело целиком про Kubernetes-платформу
  # (~70 кластеров, миграция CNI-плагина, операторы, Terraform, ArgoCD, SLO).
  # Score 45, второе место в выдаче.
  #
  # Порог обязателен: одно-два упоминания Kubernetes/Docker/CI-CD есть почти
  # в любой вакансии прикладного разработчика. Отсекаем только плотную
  # концентрацию, означающую, что роль ИМЕННО про эксплуатацию.
  infrastructure_role_gate:
    threshold_hits: 4
    description_keywords:
      - "kubernetes"
      - "terraform"
      - "opentofu"
      - "pulumi"
      - "cloudformation"
      - "argocd"
      - "spinnaker"
      - "helm chart"
      - "cni plugin"
      - "service mesh"
      - "istio"
      - "infrastructure as code"
      - "cluster architecture"
      - "kubernetes operator"
      - "control plane"
      - "internal platform"
      - "platform maturity"
      - "developer experience"
      - "on-call rotation"
      - "incident response"
      - "observability"
      - "prometheus"
      - "grafana"
      - "slo"
      - "eks"
      - "gke"
    # Заголовки, при которых гейт не применяется: если человека прямо зовут
    # прикладным разработчиком на его стеке, инфраструктурная лексика в
    # описании — это окружение проекта, а не суть роли.
    title_exemption_patterns:
      - "\\.net"
      - "\\bc#\\b"
      - "full[ -]?stack"
      - "front[ -]?end"
      - "back[ -]?end developer"
      - "web developer"
  developer_role_override_patterns:
    - "developer"
    - "engineer"
    - "programmer"
    - "\\bswe\\b"
    - "software"
    - "full[ -]?stack"
    - "back[ -]?end"
    - "front[ -]?end"
    - "\\.net"
    - "architect"
  tech_agnostic_override_keywords:
    - "tech agnostic"
    - "technology agnostic"
    - "stack agnostic"
    - "language agnostic"
    - "any programming language"
    - "any tech stack"
    - "polyglot team"
    - "polyglot environment"

language_requirement_signal:
  # Письменности, которые человек читает. Всё остальное — полный отсев:
  # объявление на иврите или китайском нечитаемо, и перечислять его частые
  # слова бессмысленно, алфавит виден сразу.
  #
  # Найдено 2026-08-05 чтением выдачи: вакансия на иврите стояла на 13-м
  # месте. Списки слов существовали для пяти европейских языков и другую
  # письменность не могли поймать в принципе.
  #
  # Порог долевой: пара слов на иврите бывает и в англоязычной вакансии
  # израильской компании (название, адрес), целиком написанное объявление
  # даёт десятки процентов.
  readable_scripts: ["latin", "cyrillic"]
  unreadable_script_threshold: 0.15
  # ПОЛНЫЙ ОТСЕВ (dealbreaker). Подтверждено человеком явно (2026-07-30):
  # человек говорит только на русском и английском (см. profile.yaml →
  # owner.languages). Явное требование другого языка — например, немецкого
  # ("Web-Administration / Webmaster TYPO3" требовал sehr gute
  # Deutschkenntnisse) — дисквалифицирует вакансию полностью.
  explicit_requirement_keywords:
    - "fluent german"
    - "german required"
