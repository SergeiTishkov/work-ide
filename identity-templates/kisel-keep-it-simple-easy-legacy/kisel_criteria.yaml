language_requirement_signal:
  # The scripts the person reads. Everything else is total rejection: a posting
  # in Hebrew or Chinese is unreadable, and listing its frequent words is
  # pointless — the alphabet is visible at once.
  #
  # Found 2026-08-05 by reading the shortlist: a vacancy in Hebrew stood 13th.
  # The word lists existed for five European languages and could not catch
  # another script in principle.
  #
  # The threshold is proportional: a couple of Hebrew words occur even in an
  # English-language vacancy from an Israeli company (a name, an address),
  # whereas a posting written entirely in it gives tens of per cent.
  readable_scripts: ["latin", "cyrillic"]
  unreadable_script_threshold: 0.15
  # TOTAL REJECTION (a dealbreaker). Confirmed by the owner explicitly
  # (2026-07-30): the person speaks only Russian and English (see profile.yaml
  # -> owner.languages). An explicit requirement for another language — German,
  # for instance ("Web-Administration / Webmaster TYPO3" demanded sehr gute
  # Deutschkenntnisse) — disqualifies the vacancy entirely.
  explicit_requirement_keywords:
    - "fluent german"
    - "german required"
    - "german language required"
    - "advanced german"
    - "sehr gute deutschkenntnisse"
    - "gute deutschkenntnisse"
    - "verhandlungssicheres deutsch"
    - "muttersprache deutsch"
    - "native german speaker"
    - "german speaker required"
    - "fließend deutsch"
    - "deutschkenntnisse"
    - "german c1"
    - "german c2"
    - "fluent french"
    - "french required"
    - "native french speaker"
    - "fluent spanish"
    - "spanish required"
    - "native spanish speaker"
    - "fluent italian"
    - "italian required"
    - "fluent dutch"
    - "dutch required"
    - "native dutch speaker"
  # Many vacancies from German job boards (arbeitnow in particular) are written
  # entirely in German, with no explicit English "German required" phrase — the
  # very fact that the description is in German already means the working
  # language is neither English nor Russian. threshold_hits items from this
  # list is the heuristic "this is a German-language vacancy" (it uses the
  # "m/w/d"/"w/m/d" markup standard in German postings, and frequent words).
  german_market_indicator_keywords:
    - "m/w/d"
    - "w/m/d"
    # A real finding, 2026-07-31: two Hygraph vacancies, "Senior
    # Fullstack Engineer (f/m/d) - Berlin I Germany, EMEA I Remote"
    # — the same German gender marker, just a different letter.
    - "(f/m/d)"
    - "(d/f/m)"
    - "(m/f/d)"
    - "(m/w/x)"
    - "wir suchen"
    - "ihre aufgaben"
    - "ihr profil"
    - "kenntnisse"
    - "bewerbung"
    - "unser unternehmen"
    - "homeoffice"
    - "vollzeit"
    - "teilzeit"
    - "arbeitszeit"
    - "mitarbeiter"
    - "unternehmen"
  german_market_indicator_threshold: 3

  # Unambiguous markers of a German-language posting: one is enough.
  german_market_strong_single_markers:
    - "m/w/d"
    - "w/m/d"
    - "(f/m/d)"
    - "(d/f/m)"
    - "(m/f/d)"
    - "(m/w/x)"
    - "deutschkenntnisse"

  # The same device as for German, but for the other languages. Real findings,
  # 2026-07-31 (manual checklist): "Website Builder / WordPress Specialist" at
  # Work and Study Travel — a posting entirely in Spanish (paying 16,000
  # MXN/month), and "Full-Stack Developer (React + AWS)" at Base.com —
  # entirely in Polish. Both passed the filter only because the heuristic
  # existed for exactly one language.
  #
  # The markers are chosen so as not to occur in English text: they are the
  # functional words of job postings rather than general vocabulary.
  foreign_language_posting_indicators:
    - language: dutch
      threshold: 4
      markers: ["wil jij", "jouw ", "onze ", "wij zoeken", "vacature",
                "werkzaamheden", "functie-eisen", "ervaring met", "bij ons",
                "wat wij bieden", "sollicitatie", "medewerker", "bedrijf",
                "opdrachtgevers", "dienstverband",
                # Functional words: weak singly, unambiguous together.
                # Measured 2026-08-05 across the whole base: they fire without
                # a single explicit Dutch word on exactly one vacancy — and
                # that one really is Dutch. Zero false positives.
                " je ", " het ", " van de ", " in de ", " voor de ",
                " met een ", " zijn ", " worden ", " ontwikkelaar "]
    - language: spanish
      threshold: 3
      markers: ["buscamos", "responsabilidades", "conocimientos", "ofrecemos",
                "experiencia en", "nuestro equipo", "empresa", "puesto",
                "requisitos", "trabajo remoto"]
    - language: polish
      threshold: 3
      markers: ["szukamy", "twoje zadania", "oferujemy", "doswiadczenie",
                "doświadczenie", "zespol", "zespół", "wymagania", "praca",
                "firma", "naszą misją"]
    - language: french
      threshold: 3
      markers: ["nous recherchons", "vos missions", "votre profil",
                "compétences", "entreprise", "poste", "expérience"]
    - language: portuguese
      threshold: 3
      markers: ["estamos à procura", "responsabilidades", "experiência",
                "equipe", "vaga", "requisitos"]
    - language: italian
      threshold: 3
      markers: ["cerchiamo", "requisiti", "esperienza", "azienda",
                "competenze", "il candidato"]


