classification_thresholds:
  # REVISED 2026-07-30 (an important change of logic).
  #
  # The 65/45/25 thresholds date from the era when the score was the ONLY
  # filter, and a high threshold guarded against rubbish. Filtering is now done
  # by the hard gates (stack, location, language, profession, role complexity):
  # everything impassable is already in "rejected". For what the GATES LET
  # THROUGH, the score should RANK rather than discard.
  #
  # The problem found (on real data): vacancies that passed every gate
  # (worldwide remote, a JS/.NET stack, English, a developer role) — "Staff
  # Software Engineer (Magic Containers)" (18 points), for instance — did not
  # "Senior Vue Developer" (15), "Senior React Full-stack Developer" (15) —
  # reach the report at all. An ordinary, perfectly normal remote vacancy with
  # no "legacy", no "part-time" and no stated range scores only about 15: the
  # bonuses are awarded for tedium and low intensity, which few write down.
  # As a result, 1 of 966 vacancies was shown to the person — while about 50
  # had genuinely passed every suitability check.
  # RECALIBRATED 2026-08-05 along with the weights.
  #
  # The previous 45/25/8 described a different scale: remote_location_fit
  # weighed 25 and was awarded to almost everything that passed the gates, so
  # it acted as a constant term lifting the whole curve. Once geography stopped
  # weighing, that same 45 cut everything: five hot_leads out of 11,414.
  #
  # The new values were chosen by measurement over the real base, not by eye:
  #   38 -> 21 candidates at the head (0.18% of the base) — a readable number;
  #   28 -> 51 more;
  #   20 -> a tail of 132 instead of 261: cutting vacancies with no intelligible
  #         signal beyond having passed the gates.
  # Chosen by measurement over the 572 vacancies that passed every gate
  # (2026-08-05, after geography stopped weighing and the scale compressed):
  #
  #   38 -> 24 candidates at the head. That is what a person reads over coffee.
  #   28 -> 38 more.
  #   10 -> the tail. An ordinary vacancy that passed EVERY gate but said
  #         nothing about itself (no core stack, no legacy, no words about
  #         intensity, no range) scores exactly 10. It has to be visible: the
  #         gates have already confirmed one can apply, and here the score
  #         ranks rather than filters — decided 2026-07-30, and it still holds.
  #
  # A long tail costs nothing: the report's sections print 15 records each and
  # say how many are left.
  hot_lead: 38
  worth_a_look: 28
  long_shot: 10
  # below long_shot -> low_priority
  # a hard dealbreaker keyword -> status "rejected" regardless of points

ai_training_crowdwork_gate:
  # A genre that appeared on the boards in 2024-2026: a platform hires
  # developers not to build software but to produce training data for models —
  # writing reference solutions, labelling, rating answers, assembling RL
  # environments. The title meanwhile is ordinary: "Senior Software Engineer".
  #
  # Why this is a gate rather than a penalty: piecework with no project, team
  # or product is not what somebody looking for a steady position wants.
  # Measured 2026-08-05: such postings took four of the top nine positions,
  # including the first, because they list every language at once, write "no
  # set schedules" (which reads as low intensity) and quote an hourly rate.
  #
  # The markers are long and unambiguous: one is enough to reject, so each must
  # be something an honest product company would never write about itself.
  # Short ones ("ai", "training") would catch half the market.
  keywords:
    - "not a traditional software engineering role"
    # Wordings of the same genre found 2026-08-05: the same platform came back
    # as "Freelance Agent Evaluation Engineer" with rewritten text. A gate that
    # catches one edition of a text catches an edition, not a genre.
    #
    - "project-based ai opportunities"
    - "agent evaluation"
    - "evaluating and improving ai"
    - "testing, evaluating, and improving ai"
    - "improving ai systems"
    - "ai training data"
    - "reinforcement learning environments"
    - "ai training project"
    - "ai trainer"
    - "ai tutor"
    - "help train and improve"
    - "train and improve next-generation"
    - "training data for ai"
    - "improve ai models"
    - "ai model's ability"
    - "no minimum time or task commitments"
    - "no minimum time commitment"
    - "connects specialists with ai projects"
    - "rate ai responses"
    - "evaluate model responses"
    - "rate model responses"
    - "annotate training data"
    - "data labeling project"

mobile_role_gate:
  # Mobile development behind a neutral title. A real finding, 2026-08-05:
  # 2026-08-05: "Lead Full-stack Developer (Full-Time Remote Contractor)" @
  # at Khibraty — by its description an existing React Native and Expo
  # application, with all the work inside it. The title gate does not see that,
  # just as it did not see DevOps behind a neutral title before
  #
  # A threshold of two: an ordinary web vacancy may mention a mobile app among
  # the company's products. Agency marketing blocks are cut by the same
  # mechanism as in stack scoring — otherwise a list of "React Native, Flutter,
  # ..." would reject everything from Lemon.io outright.
  #
  # The words are long: "expo" is deliberately dropped, being a substring of
  # "exposure" and "export" (the same class of mistake as "java" in "javascript").
  threshold_hits: 2
  keywords:
    - "react native"
    - "app store"
    - "google play"
    - "flutter"
    - "swiftui"
    - "xcode"
    - "testflight"
    - "ios and android"
    - "android and ios"
    - "mobile application"
    - "native app"
    - "mobile app"
