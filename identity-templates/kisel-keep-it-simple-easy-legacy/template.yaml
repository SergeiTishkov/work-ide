# Манифест шаблона. Версия — ЧИСЛО, и именно по нему решается, есть ли
# обновление: разбирать markdown ради решения о запуске нельзя.
#
# При изменении любого файла шаблона версия увеличивается на единицу, и в
# CHANGELOG.md добавляется раздел с этим номером. Проверяется тестом
# test_template_version_matches_changelog — правило, которое держится на
# памяти агента, в этом проекте уже ломалось.

name: kisel
version: 1
summary: >
  Спокойная легаси-удалёнка с низкой нагрузкой для .NET/JS-разработчика.
  Ищет скучную, предсказуемую, хорошо документированную работу с низкой
  конкуренцией: legacy, enterprise, банки, госсектор — это плюсы, а
  greenfield, стартапы и "move fast" — минусы.
suitable_for: >
  Разработчик уровня senior на .NET/C# или JS/TS, которому важнее нагрузка и
  предсказуемость, чем интересные задачи и карьерный рост.
