# The template manifest. The version is a NUMBER, and that is what decides
# whether an update exists: parsing markdown to decide about a run will not do.
#
# When any template file changes, the version goes up by one and a section with
# that number is added to CHANGELOG.md. Checked by the test
# test_template_version_matches_changelog — a rule that rests on an agent's
# memory has broken in this project before.

name: kisel
version: 9
summary: >
  Calm, low-intensity legacy remote work for a .NET/JS developer.
  It looks for dull, predictable, well-documented work with little competition:
  legacy, enterprise, banks and the public sector are pluses, while greenfield,
  startups and "move fast" are minuses.
suitable_for: >
  A senior developer in .NET/C# or JS/TS to whom workload and predictability
  matter more than interesting problems and career growth.
