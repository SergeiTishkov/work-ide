# Вопросник шаблона: ЗАЧЕМ настройки именно такие.
#
# Здесь ответы уровня ТИПА поиска — они одинаковы для всех, кто выбрал этот
# шаблон. Ответы про конкретного человека (где живёт, сколько хочет получать,
# какие языки знает, с какими странами уже есть опыт) в шаблон не попадают:
# их место в локальной идентичности, и туда же агент запишет их при онбординге.
#
# Полный список вопросов и порядок опроса — docs/QUESTIONNAIRE.md.

schema_version: 1
identity_prefix: kisel
kind: template

answers:

  - question: "Что именно вы ищете?"
    answer: >
      Лёгкую работу. Цель — НАГРУЗКА, а не количество часов: ненапряжная
      полная ставка подходит так же, как средненагруженный неполный день.
      Сокращённый график, четырёхдневная неделя и частичная занятость — формы
      низкой нагрузки, а не самостоятельные требования.

  - question: "Что НЕ является целью?"
    answer: >
      Интересные задачи, карьерный рост, амбициозные проекты, обучение новому
      стеку. Это осознанный выбор, а не компромисс: именно отказ от них даёт
      доступ к вакансиям с низкой конкуренцией.

  - question: "Почему legacy — это плюс?"
    answer: >
      Устоявшийся код меняется медленно, требования известны, процессы
      описаны, а конкуренция за место низкая: большинство кандидатов бежит от
      слов "legacy" и "maintenance". Плюс современные LLM хорошо знают именно
      распространённый, хорошо задокументированный стек в его "устаревшем"
      изводе.

  - question: "Какие роли отсекаются полностью и почему?"
    answer: >
      Менеджмент, продажи, пресейл, DevRel, аналитика, QA, мобильная
      разработка, инфраструктура/DevOps и краудворк по обучению ИИ. Все они
      добавлялись по одной, после реальной находки в выдаче: шанс попасть на
      такую вакансию прикладному разработчику нулевой, а балльный штраф
      нулевой шанс не выражает.

  - question: "Как оценивается нагрузка, если про неё никто не пишет?"
    answer: >
      Косвенно. Прямых слов "у нас спокойно" в вакансиях не бывает; признаки
      выводятся из стека (старые технологии), отрасли (банки, госсектор,
      страхование), формулировок про режим работы и из площадок, которые сами
      сортируют работодателей по режиму (4dayweek.io).

  # --- ВОПРОСЫ, ОТВЕТЫ НА КОТОРЫЕ ЛИЧНЫЕ -----------------------------------
  # Шаблон их перечисляет, но не отвечает: ответ зависит от человека и живёт
  # в его локальной идентичности.

  - question: "Где вы живёте и какое у вас резидентство?"
    answer: null
    note: >
      Из резидентства ВЫВОДЯТСЯ гео-правила: одна и та же фраза "US only" для
      резидента США — плюс, для всех остальных — дисквалификация. Таблица
      вывода — config/derivation/regions.yaml.

  - question: "Какие языки вы знаете?"
    answer: null
    note: "Из этого выводится языковой фильтр: какие вакансии отсеивать."

  - question: "На какие деньги рассчитываете?"
    answer: null

  - question: "Есть ли страны, где найм для вас особенно вероятен?"
    answer: null
    note: >
      Обычно из-за уже имеющегося опыта работы с компаниями оттуда или связей.
      Попадает в acceptable_region_signal локальной идентичности.

  - question: "Есть ли топонимы, неоднозначные лично для вас?"
    answer: null
    note: >
      Например, для жителей одноимённой страны — «Georgia»: в вакансиях это
      "Georgia" почти всегда означает штат. Заготовки частых ловушек —
      config/derivation/ambiguous_places.yaml.
