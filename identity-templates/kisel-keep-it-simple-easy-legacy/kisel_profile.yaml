# =============================================================================
#  KISEL — the identity profile
# =============================================================================
#  The human-readable truth about who is searching, and for what.
#  tools/score.py reads kisel_criteria.yaml; this file is context for the agent
#  and the person, which must not get lost in the code.
#
#  The full description of the identity is in kisel_identity.md.
#  Why the settings are what they are is in kisel_questionnaire.yaml.
# =============================================================================

identity:
  kind: personal
  display_name: "Calm, low-intensity legacy remote work (.NET/JS)"
  abbreviation: "KISEL = Keep It Simple, Easy, Legacy"
  created_at: "2026-07-31"
  # How to explain the score scale to a person in their report. Every identity
  # has its own: what is a plus here is a minus for an onsite startup search.
  scoring_philosophy: >
    The higher the score (0-100), the more the vacancy looks like "dull,
    legacy, well paid, little competition" — exactly what is wanted.

contact:
  # The contact in the User-Agent is an engineering commitment of the project:
  # our requests should be recognisable, and a site's administrator should have
  # a way to write to a live person (see the constitution, §5, "politeness by
  # default").
  #
  # The template sets no value: an address is personal. It is filled in in the
  # local identity, which is outside git, so there is nobody left to hide it from.
  user_agent_contact: ""

# ==== PERSONAL: the values live in the local identity, outside git ====
#
# The `local` sentinel means: the real value lives in the personal file and is
# merged in when the identity is activated (common.resolve_local_fields). This
# is the retired mechanism, kept for machines that have not migrated.
#
# Why: this folder is in the shared repository and describes a SEARCH, not a
# person. A name, a LinkedIn profile, residency, a CV and pay expectations are
# no part of describing a search; without the split, everyone who cloned the
# project would get the author's personal file. Until the personal layer is
# filled in, the identity counts as unfinished and no search runs.
owner:
  # The role is part of the SEARCH profile: it explains which vacancies the
  # search aims at, and is the same for everybody using this template.
  role: "Senior Software Engineer (.NET / C#)"

  # EVERYTHING ELSE ABOUT THE PERSON GOES IN THE LOCAL IDENTITY, NOT HERE.
  #
  # Name, LinkedIn, CV files, languages, residency and time zone are properties
  # of a person rather than of a search. The template is in git and is meant
  # for anyone looking for calm legacy work; somebody else's residency would
  # make it unusable, and their personal data would make it dangerous.
  #
  # Residency matters especially: the geography rules are DERIVED from it. The
  # phrase "US only" is a plus for a US resident and a disqualification for
  # everybody else. So the template holds no geography rules: the local
  # identity supplies them, see docs/ONBOARDING.md and config/derivation/.
  #
  # Filled in at clone time: the <prefix>_profile.yaml file beside the
  # template/ folder inside your local identity.

# Personal bonuses — for a market (personal_market_bonus) and for technologies
# (personal_tech_bonus) — are NOT DECLARED in the template at all.
#
# The reasons for such a bonus can be anything: tax residency, pension credit,
# family, plans to move, a personal preference between two familiar stacks.
# None of them is a property of the search, so they belong in the local
# identity, where they are simply added as keys.
# The mechanics are in docs/OVERRIDES.md.

# Which labour markets the search covers. The country table is shared
# (config/derivation/market_tiers.yaml); only the choice of tiers is here: the
# table describes the objective state of things, the choice is the identity's.
#
# The point of the distinction: countries that IMPORT development hire from
# outside, with higher rates and better treatment of a remote contractor.
# EXPORTERS supply engineers themselves and compete downwards on price.
target_markets:
  tiers:
    - importer_prime      # countries with a pronounced developer shortage
    - importer_ok         # the rest of Western Europe, Japan, Korea, New Zealand
  # Individual additions beyond the tiers, if any are needed.
  extra_locations: []

target_regions:
  # Which markets a person considers a dream and which realistic depends on
  # them: on their residency, their contacts and their existing experience with
  # companies in a particular country. The template imposes no such preference.
  #
  # The shared market table is config/derivation/market_tiers.yaml, and the
  # choice of tiers (target_markets above) describes it well enough. The lists
  # below are an optional refinement for a local identity.
  dream: []
  solid_realistic: []
  # CORRECTED 2026-07-30 (evening): "Europe" here WAS a mistake — in a real
  # vacancy found, "(EU Remote)" in the title means EU residency is required,
  # which disqualifies anyone who is not an EU resident exactly as "US Remote"
  # does. A plain "a European company" is not tracked as its own plus (too easy
  # to confuse with a residency requirement) — see criteria.yaml ->
  # remote_location_fit.restrictive_region_signal, where "eu remote" and
  # "remote europe" moved as dealbreakers.
  #
  note: >
    Note: "the company is based in region X" is not "the company requires
    residency in X". Israel and the UAE are valuable as ADDITIONAL realistic
    hiring regions rather than as a replacement for geography filtering — a
    hard residency or citizenship requirement in ANY country (including these
    two, and including the US and Canada) that the person does not hold is
    always a dealbreaker (total rejection), see criteria.yaml ->
    remote_location_fit.restrictive_region_signal.

goal:
  purpose: >
    Easy work. The goal is INTENSITY rather than a number of hours: an
    undemanding full-time role suits as well as a moderately loaded part-time
    one. Reduced hours, a four-day week and part-time work are forms of low
    intensity rather than requirements in themselves, and the absence of any
    of them is not a minus.

    What is valued is predictability, low cognitive load, settled processes and
    little competition for the position. Interesting problems and career growth
    are NOT the goal here — a deliberate choice rather than a compromise.
  # A guide to actual hours rather than a contractual requirement: a full-time
  # vacancy with clear signs of low intensity is suitable.
  effective_hours_per_day_target: [2, 4]
  ai_assisted: true
  ai_tools_note: >
    AI (Claude/Cursor/Copilot) is to be used actively for efficiency. So the
    technologies that suit especially well are the ones modern LLMs understand
    excellently: ASP.NET (Framework and Core), C#, classic REST/SOAP — that is,
    ASP.NET MVC/WebForms, EF6/EF Core, jQuery, Angular(JS), SQL Server,
    a widespread, well-documented stack in its "ageing" edition.
    
  # Pay expectations are personal: they depend on the person and their
  # circumstances rather than on the kind of search.
  # Pay expectations. The amounts are personal — only the SHAPE the scoring
  # expects is here. Filled in in the local identity.
  #
  # Three ranges, because vacancies quote money in different ways and the
  # comparison has to be against a comparable figure. Fill in the ones that
  # mean something to you; an empty range simply sits out the comparison.
  #
  #   target_compensation:
  #     monthly_parttime_usd:  [5000, 8000]    # "$5-8k/month"
  #     annual_parttime_usd:   [60000, 96000]  # "$60k-96k/year"
  #     hourly_contractor_usd: [55, 130]       # "$55-130/hour"
  #
  # The unit is US dollars: vacancies quote sums in anything at all, and
  # converting once here is simpler than in every comparison.
  target_compensation: {}

employment_type_priority:
  high: ["contractor", "1099", "part-time", "fractional", "freelance", "hourly"]
  medium: ["W-2 part-time", "temporary", "contract-to-hire"]
  # Full-time is NOT lower priority in itself — what matters is the intensity.
  low_but_possible: ["W-2 full-time remote without any workload signal"]
  dealbreaker_signals:
    - "exclusive employment"
    - "no other employment"
    - "moonlighting prohibited"
    - "sole and primary employer"
    - "must not hold other employment"
    - "security clearance required"
    - "must relocate"
    - "on-site required"
    - "in-office"

# Recomputed from actual frequency in the CV (2026-07-30): the 3 levels reflect
# in how many of the last 8 jobs (2018-2026) a technology really appeared,
# rather than a subjective "that fits too". A vacancy matching only familiar
# technologies must not be scored the same as one matching core — see
# criteria.yaml -> stack_fit.
tech_stack:
  # core: appears in the overwhelming majority of roles (6-8 of 8) — literally
  # what the person has been doing almost without a break for 7+ years.
  # NOTE: a bare ".NET" is deliberately absent. It would catch .NET Core, .NET
  # Framework and the rest as a substring, but also "VB.NET" — a technology the
  # person has not worked with. More specific keys (.NET Core, .NET Framework,
  # ASP.NET, C#) already cover the real cases without that side effect.
  #
  core:
    - ".NET"          # the platform's general name; how to find it in text —
                     # config/tech_vocabulary.yaml -> matching_patterns
    - ".NET Core"
    - ".NET Framework"
    - "C#"
    - "ASP.NET"
    - "ASP.NET MVC"
    - "ASP.NET Core"
    - "ASP.NET Web API"
    - "SQL Server"
    - "MS SQL"
    - "Angular"
    - "AngularJS"
  # strong: regularly, but not in every role (2-4 of 8) — real but not daily
  # expertise.
  strong:
    - "Entity Framework"
    - "EF6"
    - "EF Core"
    - "TypeScript"
    - "JavaScript"
    - "React"
    - "Azure"
    - "Docker"
    - "Microservices"
    - "CQRS"
    - "DDD"
    - "Event Sourcing"
    - "HTML"
    - "CSS"
  # familiar: was in 1-2 roles across a whole career — real experience, but
  # narrow, and not to be counted level with core.
  # NOTE: "Express" here is specifically "Express.js" (without the .js it risks
  # falsely matching the ordinary English word "express"); "LESS" was removed
  # entirely — a real bug found (2026-07-30): the CSS preprocessor "LESS"
  # falsely matched the ordinary English word "less" in a finance vacancy
  # ("no less than...") and gave it an undeserved stack_fit. SCSS already
  # covers the same class of work without that risk.
  # "Java"/"Scala" — confirmed by the owner explicitly (2026-07-30): ON THEIR
  # OWN they do not count as relevant (Java web development is not something
  # the person can expect), but Java/Scala FOR DATA PIPELINES
  # (Spark/Databricks/ETL) is a wanted variant (real experience, from a
  # previous job). The special handling is in criteria.yaml -> stack_fit ->
  # data_pipeline_language_keywords / data_pipeline_context_keywords.
  familiar:
    - "Node.js"
    - "Express.js"
    - "MongoDB"
    - "Cosmos DB"
    - "DynamoDB"
    - "Apache Spark"
    - "Databricks"
    - "Delta Lake"
    - "Python"
    - "SASS"
    - "SCSS"
    - "jQuery"
    - "SOAP"
    - "XSLT"
    - "PHP"
    - "GraphQL"
    - "DevExpress"
    - "Scala"
    - "Java"
    - "NgRx"
    - "Redux"
    - "MobX"
  # NOTE: "WebForms", "VB.NET" and "Classic ASP" are deliberately NOT in
  # tech_stack (the CV does not confirm the person really worked with them) —
  # but they remain in criteria.yaml -> legacy_enterprise_signal, because they
  # signal the character of the VACANCY (legacy) rather than a personal skill.
  # Do not confuse those two axes in future edits.

ideal_company_traits:
  high_priority:
    - "remote-first or fully distributed"
    - "US or Canada based (dream scenario)"
    - "Israel, UAE, or Europe based and open to hiring outside their home country (solid, realistic scenario — see target_regions)"
    - "mature company (10+ years old)"
    - "enterprise / corporate software"
    - "legacy system maintenance / support"
    - "calm engineering culture"
    - "good work-life balance"
    - "low stress"
    - "few meetings"
    - "well-understood, boring technology"
    - "hires internationally via EOR (Deel, Remote.com, Oyster, Papaya Global, Multiplier, G-P/Globalization Partners) or as 1099 contractor"
  low_priority_avoid:
    - "startup"
    - "AI-first company"
    - "crypto"
    - "web3"
    - "constant deadlines"
    - "high pace of change"
    - "chronic overtime"
    - "hero culture"
    - "move fast and break things"
    - "wear many hats"

eor_platforms_signal:
  # A mention of an employment platform is a strong signal that a company is
  # genuinely able to engage a contractor abroad (+18, the rubric's largest plus).
  #
  # BEWARE SHORT AND GENERIC FORMS. Measured 2026-08-05 over a base of 9527
  # vacancies: 345 false matches.
  #   * "Multiplier" (266) was caught in "productivity multiplier", "Talent
  #     Multiplier", "operating as a multiplier" — an ordinary English word;
  #   * "G-P" (79) was caught inside German words like "Mentoring-Programm".
  # The same class of mistake as "LESS" inside "no less than" and "eor" inside
  # "theoretical". So names that coincide with ordinary words are written as a
  # domain: a domain in vacancy text is unambiguous.
  - "Deel"                      # verified: 17 matches, all genuine
  - "Remote.com"
  - "Oyster HR"
  - "Papaya Global"
  - "multiplier.com"            # instead of a bare "Multiplier"
  - "Globalization Partners"
  - "g-p.com"                   # instead of a bare "G-P"
  - "Velocity Global"
  - "Employer of Record"        # the generic term, safer than any brand
  - "EOR provider"
  - "Remofirst"
  - "Rippling EOR"
  - "Safeguard Global"

# Overriding the weights of employer red flags.
#
# The shared catalogue (config/derivation/company_red_flags.yaml) rates how bad
# a thing is IN ITSELF. How bad it is for a particular person depends on their
# circumstances, and circumstances have no place in a shared repository. So the
# weights come from the local identity's own file.
#
#
# The override works in either direction, including into a plus. The boundaries
# of the mechanism, and what it CANNOT do (lift a hard gate), are in

# ==== PREFERENCES: about the person, not about the search ====
preferences:
  # Language of the REPORT. Everything else in this repository is English so
  # that anyone can read it; the report is the one file its owner opens by
  # hand every morning, and it should speak their language.
  #
  # Default is the language the owner talks to the agent in. The agent fills
  # this in during onboarding without asking a separate question — it already
  # knows which language the conversation is happening in.
  #
  # Two-letter code: en, ru, de, … An unknown code falls back to English
  # rather than to a half-translated report.
  language: "en"
