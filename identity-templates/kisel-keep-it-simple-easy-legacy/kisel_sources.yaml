# Sources for the KISEL identity.
#
# ONLY preferences here: which sources are enabled, and with what parameters.
# Endpoints, source kind, the remote_only flag and the documentation for each
# source live in the shared catalogue config/sources.catalog.yaml.
#
# A catalogue of the available blocks, with each one's strengths and
# docs/BUILDING_BLOCKS.md.

schema_version: 1

sources:
  # --- Primary: remote-only boards, English-language -----------------------
  - name: weworkremotely
    enabled: true
    # The best source by signal-to-noise: ~242 vacancies per run, a structured
    # region field, in English.

  - name: remoteok
    enabled: true

  - name: remotive
    enabled: true

  - name: jobicy
    enabled: true

  - name: himalayas
    enabled: true

  # --- Vacancies straight from employers -----------------------------------
  - name: ats
    enabled: true
    # The company list is in kisel_ats_targets.yaml. That is the main lever on
    # quality: the source itself works well, but its yield is determined
    # entirely by which companies are on the list.

  # --- Niche ---------------------------------------------------------------
  - name: hn_whoishiring
    enabled: true
    params:
      # Set explicitly rather than taken from tech_stack.core: "legacy" and
      # "SQL Server" are not languages, but for THIS identity they are worth
      # more than half the stack, because legacy maintenance is what is being
      keywords: [".NET", "C#", "ASP.NET", "legacy", "SQL Server"]
      hits_per_keyword: 50

  - name: arbeitnow
    enabled: true
    # Deliberately left enabled despite the low yield: measured 2026-07-30 it
    # gave 68% of the base at about 6% useful (a German-language market, cut by
    # the language filter). It occasionally brings English-language remote
    # vacancies from European companies. If it starts getting in the way, set
    # enabled: false; no code needs touching.

  - name: linkedin
    enabled: true
    params:
      # Each word is multiplied by each country from the market tiers, so the
      # list is deliberately short: 3 words x 26 countries x up to 4 pages is
      # already hundreds of requests. Start from the core of the stack.
      # The basis is the stack: it finds what the person can actually do.
      # Plus a few queries along the INTENSITY AXIS: measured 2026-08-05, calm
      # part-time work barely turns up if you search by stack alone and filter
      # afterwards (8 vacancies with such a sign out of 10,215).
      # LinkedIn's f_JT=P/C filter will not do for this — verified, the guest
      # endpoint ignores it and the result sets match byte for byte.
      keywords: [".NET developer", "C# developer", "ASP.NET",
                 "part-time .NET developer", "contract C# developer",
                 "fractional software engineer"]
      max_pages: 2
      # Fetching descriptions from vacancy pages: a search card has no text,
      # and without it the stack gate rejects three quarters of what was found.
      # Each fetch is a separate request, hence the cap.
      enrich_limit: 150
    # Locations are not set: they come from profile.target_markets (the market
    # tiers). That way the country list lives in one place and does not drift.

  - name: devitjobs
    enabled: true
    params:
      boards: [uk, us]

  - name: jobs_ch
    enabled: true
    params:
      queries: ["software engineer", "backend developer", ".NET", "C#"]
      pages: 5

  - name: mycareersfuture
    enabled: true
    params:
      queries: ["software engineer", "backend developer", ".NET developer"]

  - name: landing_jobs
    enabled: true

  - name: workingnomads
    enabled: true

  - name: rss_boards
    enabled: true

  - name: 4dayweek
    enabled: true
    params:
      categories: [engineering]
      pages: 6

  - name: manual
    enabled: true
    # The manual channel: the agent's finds from Indeed and careers pages,
    # entered through tools/ingest_manual.py. It matters especially for this
    # identity: the public boards cover the combination "legacy + worldwide
    # remote + a high rate" poorly.
