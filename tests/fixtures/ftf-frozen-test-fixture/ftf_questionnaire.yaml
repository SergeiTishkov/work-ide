# The fixture's questionnaire — filled in as a formality.
#
# A test fixture has no live person to interview. The file exists so that the
# folder structure is complete and `identity.py validate` checks the fixture by
# the same rules as a real identity.
#
# The template with the full list of questions is each template's
# <prefix>_questionnaire.yaml; how to run the interview is in
# docs/QUESTIONNAIRE.md.
#
# Deliberately without a reference to any live identity: one identity's files
# must not mention another's prefix — identity.validate() checks that, and it
# caught this very line when a direct reference stood here.
#

schema_version: 1
identity_prefix: ftf
filled_with_user_at: null   # nobody was interviewed: this is a fixture
is_fixture: true

note: >
  This identity's profile and criteria values are a byte-for-byte copy of the
  project's configuration as of 2026-07-31, which the tests are calibrated
  against. They are NOT derived from questionnaire answers and must not be

answers: []
