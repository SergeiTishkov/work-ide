# Sources for the test fixture.
#
# FROZEN: change only together with a deliberate update to the tests
# (see ftf_identity.md).
#
# What this file describes: ONLY preferences — which sources are enabled and
# with what parameters. Endpoints, source kind and the remote_only flag live in
# the shared catalogue config/sources.catalog.yaml and are not overridable by an
# identity: a stale URL is a bug for everybody at once.

schema_version: 1

sources:
  - name: weworkremotely
    enabled: true

  - name: remoteok
    enabled: true

  - name: remotive
    enabled: true

  - name: jobicy
    enabled: true

  - name: himalayas
    enabled: true

  - name: ats
    enabled: true

  - name: hn_whoishiring
    enabled: true
    params:
      # In production this defaults to the active identity's
      # profile.tech_stack.core; here it is set explicitly so the fixture does
      # not depend on edits to a profile.
      keywords: [".NET", "C#", "ASP.NET", "legacy", "SQL Server"]
      hits_per_keyword: 50

  - name: arbeitnow
    enabled: true

  - name: manual
    enabled: true
