# =============================================================================
#  FTF — A TEST FIXTURE. DO NOT EDIT WHILE TUNING ANYBODY'S SEARCH.
# =============================================================================
#  This is not a live person's identity but a frozen snapshot of the
#  configuration the project's tests are calibrated against. It exists purely so
#  that the tests do not depend on which identity a developer keeps active, and
#  do not go red every time somebody tunes their own criteria.
#
#  THE FREEZE RULE: ftf_* files change ONLY together with a deliberate update
#  to the tests. If you are editing the machinery and ftf has "fallen behind",
#  that is no reason to synchronise it silently: the divergence IS the signal
#  that the change affects behaviour and the tests need revisiting.
#
#  Activation outside the tests is forbidden (kind: fixture).
# =============================================================================

identity:
  kind: fixture
  display_name: "Test fixture (frozen, calibrates the tests)"
  abbreviation: "FTF = Frozen Test Fixture"
  scoring_philosophy: >
    The test fixture's scale — it calibrates the tests and is shown to nobody.
  frozen: true

contact:
  # A fixture has no live person and needs no contact: network calls in the
  # tests are mocked.
  user_agent_contact: null

owner:
  name: "Test Person"
  role: "Senior Software Engineer (.NET / C#)"
  years_experience: 7
  linkedin: "https://example.com/in/test-person"
  cv_files:
    - "CV Test Person Software Engineer.pdf"
    - "CV Test Person Software Engineer.docx"
  # Confirmed by the owner explicitly (2026-07-30): only these two languages.
  # Any explicit requirement for another language in a vacancy is a dealbreaker,
  # see criteria.yaml -> language_requirement_signal. (Not to be confused with
  # an earlier, unconfirmed and low-reliability mention of German and Chinese at
  # "elementary" level from the public LinkedIn view without a login — the
  # person denied it outright in conversation, and we believe the person rather
  # than an automatic extract from somebody else's site.)
  languages:
    - "English"
    - "Russian"
  location:
    country: "Georgia"          # the country in the Caucasus, NOT the US state
    not_in: ["EU", "Russia", "Belarus"]
    utc_offset: 4
    disambiguation_warning: >
      In vacancy text "Georgia" almost always means the US state (GA). Never
      confuse them. If "Georgia" appears in an address or description without
      an explicit "country" or "Tbilisi"/"Batumi"/"Caucasus", mark the vacancy
      needs_manual_review=true and draw no automatic conclusions about
      geographic fit.
  timezone_notes: >
    Georgia: UTC+4 all year. A convenient overlap with the US East Coast
    (UTC-4/-5) — evening local time. The overlap with the US West Coast is
    worse but still possible in the evening. Async-friendly roles preferred.

target_regions:
  # Confirmed by the owner explicitly (2026-07-30). The US and Canada are the
  # priority (the "dream"), but the real, dependable option is a contract with
  # a company in Israel or the UAE at about $5k a month: a lower ceiling but a
  # higher probability of actually being hired. Both are equally valid to the
  # system — not "plan B is worse" but "the same quality, a different chance".
  dream:
    - "United States"
    - "Canada"
  solid_realistic:
    - "Israel"        # real experience of working with an Israeli company — not a hypothesis
    - "UAE"
  # CORRECTED 2026-07-30 (evening): "Europe" here WAS a mistake — in a real
  # vacancy found, "(EU Remote)" in the title means EU residency is required,
  # EU residency, which disqualifies the person (Georgia is not in the EU)
  # does. A plain "a European company" is not tracked as its own plus (too easy
  # to confuse with a residency requirement) — see criteria.yaml ->
  # remote_location_fit.restrictive_region_signal, where "eu remote" and
  # "remote europe" moved as dealbreakers.
  #
  note: >
    Note: "the company is based in region X" is not "the company requires
    residency in X". Israel and the UAE are valuable as ADDITIONAL realistic
    hiring regions rather than as a replacement for geography filtering — a
    hard residency or citizenship requirement in ANY country (including these
    two, and including the US and Canada) that the person does not hold is
    always a dealbreaker (total rejection), see criteria.yaml ->
    remote_location_fit.restrictive_region_signal.

goal:
  purpose: >
    Calm part-time work: 2-4 hours a day.
    The main job fully satisfies the need for interesting problems — here, on
    the contrary, what is valued is tedium, predictability, low cognitive load
    and little competition for the position.
  hours_per_day_target: [2, 4]
  ai_assisted: true
  ai_tools_note: >
    AI (Claude/Cursor/Copilot) is to be used actively for efficiency. So the
    technologies that suit especially well are the ones modern LLMs understand
    excellently: ASP.NET (Framework and Core), C#, classic REST/SOAP — that is,
    ASP.NET MVC/WebForms, EF6/EF Core, jQuery, Angular(JS), SQL Server,
    C#, classic REST/SOAP — that is, exactly the stack already in the CV, only
    in its "ageing", well-documented edition.
  target_compensation:
    currency: USD
    # Confirmed by the owner explicitly (2026-07-30): the guide is $5000-8000 a
    # month at 2-4 hours a day. $7-8k is preferable but not at the cost of
    # calm: guaranteed dull, easy work at $5k beats stressful work at $8k.
    monthly_parttime_usd: [5000, 8000]
    annual_parttime_usd: [60000, 96000]  # = monthly_parttime_usd * 12, to compare with annual ranges
    hourly_contractor_usd: [55, 130]  # $5-8k/month at 44-88 h/month (2-4 h x ~22 working days)
    priority_note: >
      The priority is strict: guaranteed low intensity and stress matter more
      than higher pay. If a vacancy is plainly calm (low low_intensity risk,
      legacy or enterprise, no deadlines), it should score above a vacancy with
      a higher rate but signs of stress and haste. That is precisely why
      low_intensity_signal (20) weighs twice compensation_signal (10) in
      criteria.yaml — a deliberate decision rather than an oversight.
    note: >
      The higher the rate at plainly low intensity, the higher the priority.
      A vacancy with no range is not disqualified, but scoring is less
      confident about it. Below the bottom of the range a vacancy is not
      excluded automatically (it may genuinely be pleasant and easy) but takes
      a penalty in compensation_signal.

employment_type_priority:
  high: ["contractor", "1099", "part-time", "fractional", "freelance", "hourly"]
  medium: ["W-2 part-time", "temporary", "contract-to-hire"]
  low_but_possible: ["W-2 full-time remote with clear low workload signals"]
  dealbreaker_signals:
    - "exclusive employment"
    - "no other employment"
    - "moonlighting prohibited"
    - "sole and primary employer"
    - "must not hold other employment"
    - "security clearance required"
    - "must relocate"
    - "on-site required"
    - "in-office"

# Recomputed from actual frequency in the CV (2026-07-30): the 3 levels reflect
# in how many of the last 8 jobs (2018-2026) a technology really appeared,
# rather than a subjective "that fits too". A vacancy matching only familiar
# technologies must not be scored the same as one matching core — see
# criteria.yaml -> stack_fit.
tech_stack:
  # core: appears in the overwhelming majority of roles (6-8 of 8) — literally
  # what the person has been doing almost without a break for 7+ years.
  # NOTE: a bare ".NET" is deliberately absent. It would catch .NET Core, .NET
  # Framework and the rest as a substring, but also "VB.NET" — a technology the
  # person has not worked with. More specific keys (.NET Core, .NET Framework,
  # ASP.NET, C#) already cover the real cases without that side effect.
  #
  core:
    - ".NET"
    - ".NET Core"
    - ".NET Framework"
    - "C#"
    - "ASP.NET"
    - "ASP.NET MVC"
    - "ASP.NET Core"
    - "ASP.NET Web API"
    - "SQL Server"
    - "MS SQL"
    - "Angular"
    - "AngularJS"
  # strong: regularly, but not in every role (2-4 of 8) — real but not daily
  # expertise.
  strong:
    - "Entity Framework"
    - "EF6"
    - "EF Core"
    - "TypeScript"
    - "JavaScript"
    - "React"
    - "Azure"
    - "Docker"
    - "Microservices"
    - "CQRS"
    - "DDD"
    - "Event Sourcing"
    - "HTML"
    - "CSS"
  # familiar: was in 1-2 roles across a whole career — real experience, but
  # narrow, and not to be counted level with core.
  # NOTE: "Express" here is specifically "Express.js" (without the .js it risks
  # falsely matching the ordinary English word "express"); "LESS" was removed
  # entirely — a real bug found (2026-07-30): the CSS preprocessor "LESS"
  # falsely matched the ordinary English word "less" in a finance vacancy
  # ("no less than...") and gave it an undeserved stack_fit. SCSS already
  # covers the same class of work without that risk.
  # "Java"/"Scala" — confirmed by the owner explicitly (2026-07-30): ON THEIR
  # OWN they do not count as relevant (Java web development is not something
  # the person can expect), but Java/Scala FOR DATA PIPELINES
  # (Spark/Databricks/ETL) is a wanted variant (real experience, from a
  # previous job). The special handling is in criteria.yaml -> stack_fit ->
  # data_pipeline_language_keywords / data_pipeline_context_keywords.
  familiar:
    - "Node.js"
    - "Express.js"
    - "MongoDB"
    - "Cosmos DB"
    - "DynamoDB"
    - "Apache Spark"
    - "Databricks"
    - "Delta Lake"
    - "Python"
    - "SASS"
    - "SCSS"
    - "jQuery"
    - "SOAP"
    - "XSLT"
    - "PHP"
    - "GraphQL"
    - "DevExpress"
    - "Scala"
    - "Java"
    - "NgRx"
    - "Redux"
    - "MobX"
  # NOTE: "WebForms", "VB.NET" and "Classic ASP" are deliberately NOT in
  # tech_stack (the CV does not confirm the person really worked with them) —
  # but they remain in criteria.yaml -> legacy_enterprise_signal, because they
  # signal the character of the VACANCY (legacy) rather than a personal skill.
  # Do not confuse those two axes in future edits.

ideal_company_traits:
  high_priority:
    - "remote-first or fully distributed"
    - "US or Canada based (dream scenario)"
    - "Israel, UAE, or Europe based and open to hiring outside their home country (solid, realistic scenario — see target_regions)"
    - "mature company (10+ years old)"
    - "enterprise / corporate software"
    - "legacy system maintenance / support"
    - "calm engineering culture"
    - "good work-life balance"
    - "low stress"
    - "few meetings"
    - "well-understood, boring technology"
    - "hires internationally via EOR (Deel, Remote.com, Oyster, Papaya Global, Multiplier, G-P/Globalization Partners) or as 1099 contractor"
  low_priority_avoid:
    - "startup"
    - "AI-first company"
    - "crypto"
    - "web3"
    - "constant deadlines"
    - "high pace of change"
    - "chronic overtime"
    - "hero culture"
    - "move fast and break things"
    - "wear many hats"

eor_platforms_signal:
  # A mention of an employment platform is a strong signal that a company is
  # genuinely able to engage a contractor abroad (+18, the rubric's largest plus).
  #
  # BEWARE SHORT AND GENERIC FORMS. Measured 2026-08-05 over a base of 9527
  # vacancies: 345 false matches.
  #   * "Multiplier" (266) was caught in "productivity multiplier", "Talent
  #     Multiplier", "operating as a multiplier" — an ordinary English word;
  #   * "G-P" (79) was caught inside German words like "Mentoring-Programm".
  # The same class of mistake as "LESS" inside "no less than" and "eor" inside
  # "theoretical". So names that coincide with ordinary words are written as a
  # domain: a domain in vacancy text is unambiguous.
  - "Deel"                      # verified: 17 matches, all genuine
  - "Remote.com"
  - "Oyster HR"
  - "Papaya Global"
  - "multiplier.com"            # instead of a bare "Multiplier"
  - "Globalization Partners"
  - "g-p.com"                   # instead of a bare "G-P"
  - "Velocity Global"
  - "Employer of Record"        # the generic term, safer than any brand
  - "EOR provider"
  - "Remofirst"
  - "Rippling EOR"
  - "Safeguard Global"

# Overriding the weights of employer red flags.
#
# The shared catalogue (config/derivation/company_red_flags.yaml) rates how bad
# a thing is IN ITSELF. How bad it is for a particular person depends on their
# circumstances, and circumstances have no place in a shared repository. So the
# weights come from the local identity's own file.
#
#
# The override works in either direction, including into a plus. The boundaries
# of the mechanism, and what it CANNOT do (lift a hard gate), are in
company_red_flag_severity: local
