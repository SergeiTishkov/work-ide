<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <nav class="tabs identity-tabs" role="tablist" data-testid="identity-tabs"></nav>
    <div class="picker" data-testid="refresh-slot"></div>
    <div class="picker" data-testid="theme-picker"></div>
    <div class="picker" data-testid="language-picker"></div>
    <div class="menu-slot" data-testid="menu-slot"></div>
  </header>
  <div class="error" data-testid="error" hidden></div>
  <!-- A spinner from the first paint: app.js replaces it once it knows more. -->
  <main class="panel" data-testid="panel"><div class="loading"><span class="spinner"></span></div></main>
  <!-- The tasks and the log of one, as an IDE's bottom panel (app.js,
       renderTaskPanel). The sashes resize it. -->
  <section class="taskpanel" data-testid="task-panel" hidden>
    <div class="sash sash-y" data-axis="y" data-testid="task-panel-sash"></div>
    <div class="pane tasks-pane">
      <div class="pane-title" data-testid="task-list-title"></div>
      <div class="pane-body task-list" data-testid="task-list"></div>
      <div class="task-view-host" data-testid="task-view-host"></div>
    </div>
    <div class="sash sash-x" data-axis="x" data-testid="task-split-sash"></div>
    <div class="pane log-pane">
      <div class="pane-title" data-testid="task-log-title"></div>
      <pre class="pane-body task-log" data-testid="task-log"></pre>
    </div>
  </section>
  <!-- The panel folded: a tab out of the window's bottom edge opens it. -->
  <button type="button" class="task-tab" data-testid="task-tab" hidden></button>
  <!-- Popups that belong to no identity: the settings, the stop confirmation. -->
  <div data-testid="modal-host"></div>
  <script src="locales/ru.js"></script>
  <script src="locales/en.js"></script>
  <script src="i18n.js"></script>
  <script src="funnel.js"></script>
  <script src="app.js"></script>
</body>
</html>
